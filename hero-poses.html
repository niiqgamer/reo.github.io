<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>REO Hero Poses</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d1130;--card:#161b44;--line:rgba(170,160,255,.25);--tx:#e7e9ff;--mu:#a7abd6;--ac:#e9c46a;--on:#5b4fd6}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at top,#262a6e,var(--bg) 60%);background-color:var(--bg);color:var(--tx);font:15px Kanit,system-ui,sans-serif;min-height:100vh}
header{padding:18px 16px 6px;max-width:1400px;margin:0 auto}
header small{color:var(--ac);letter-spacing:.04em}
h1{margin:2px 0 4px;font-size:24px}
header p{margin:0;color:var(--mu);font-size:13px}
.ctl{max-width:1400px;margin:10px auto;padding:0 16px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.ctl label{display:flex;gap:6px;align-items:center;color:var(--mu);font-size:13px}
select,button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--line);border-radius:9px;padding:5px 9px;cursor:pointer}
button.on{background:var(--on);border-color:#8f86ff}
input[type=range]{accent-color:#8f86ff;width:110px}
.wrap{max-width:1400px;margin:0 auto 24px;padding:0 16px;overflow-x:auto}
table{border-collapse:separate;border-spacing:6px;margin:0 auto}
th{color:var(--mu);font-weight:400;font-size:12px;padding:2px}
th.rh{text-align:right;padding-right:6px;white-space:nowrap}
td{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0}
td canvas{display:block;width:150px;height:159px}
@media (max-width:600px){td canvas{width:104px;height:110px}}
</style></head><body>
<header><small>Rare Earth Online · drawHero8</small><h1>ท่าทางตัวละคร 8 ทิศ</h1><p>ทุกท่า × ทุกทิศ (S, SE, E, NE, N, NW, W, SW) วาดจากโค้ดเดียวกับในเกม</p></header>
<div class="ctl">
  <span id="sex"></span>
  <label>ทรงผม <select id="style"></select></label>
  <label>สีผม <select id="hc"></select></label>
  <label>สีตา <select id="ec"></select></label>
  <label>สีชุด <select id="suit"></select></label>
  <label>ความเร็ว <input type="range" id="spd" min="0" max="2" step=".1" value="1"></label>
  <button id="pause">หยุด</button>
</div>
<div class="wrap"><table id="grid"></table></div>
<script>
/* BEGIN HERO CODE: copied from index.html by hero-poses-sync.py, do not edit here */
const HERO_SUITS={def:null,silver:{body:["#7d8594","#f2f5fa"],acc:["#3c4656","#9fb0c8"]},copper:{body:["#8a4a2a","#ffd9b8"],acc:["#5a2410","#c8643a"]},
  green:{body:["#2f6a44","#d8f5de"],acc:["#1d4a2c","#e9c46a"]},purple:{body:["#4f3a8a","#e8dcff"],acc:["#3a1d6e","#b27cff"]}};
const HERO_ACC=new Set(["#e8811f","#f08a24","#f5a540","#ffd58a","#ffcf7a","#c66d14"]);
const HERO_BODY=new Set(["#cfc9d9","#fbf9fd","#f3f0f7","#b9b2c8","#d6d0e0","#ffffff","#b4adc4","#cdc7d8","#f7f5fa","#aea7bf","#d9d5e2","#b7b0c6","#f2eff6","#c9c3d6","#8d86a0","#efeaf3","#e9e4ee","#d7d2e2"]);
function heroHex(h){h=h.slice(1);return [0,2,4].map(i=>parseInt(h.substr(i,2),16))}
function heroMix(a,b,k){const A=heroHex(a),B=heroHex(b);return "rgb("+A.map((v,i)=>Math.round(v+(B[i]-v)*k)).join(",")+")"}
function heroLum(h){const [r,g,b]=heroHex(h);return (r*.3+g*.59+b*.11)/255}
const HERO_DEF={m:{style:"spiky",hair:["#ffffff","#e3def2","#a59cc6"],eye:["#bff4ff","#3fb3f0","#0c4a8c"]},
  f:{style:"ponytail",hair:["#ffe3f1","#f59ac4","#b8558a"],eye:["#f6dcff","#b45ff0","#4a1a8c"]}};
const heroEase=u=>u*u*(3-2*u);
/* pose = joint angles at time t. Arms/legs: phi = swing forward from hanging down (PI/2 = straight ahead, PI = straight up),
   al = spread out to the side, ext = arm reach (1 = straight). Side +1 = the character's left, -1 = right (the weapon hand). */
function heroPose(pose,t,o={}){
  const arm=()=>({phi:.06,al:.14,ext:1}),leg=()=>({phi:0,al:.03});
  const P={bob:0,lean:0,drop:0,push:0,fall:0,arms:{1:arm(),"-1":arm()},legs:{1:leg(),"-1":leg()},eyes:"open",mouth:"smile",fx:null};
  const A=P.arms,L=P.legs;
  switch(pose){
    case "idle":{const b=Math.sin(t*2.2);P.bob=b*1.2;A[1].al=A[-1].al=.14+b*.02;if((t%3.6)>3.45)P.eyes="closed";break}
    case "walk":{const ph=o.phase!=null?o.phase:t*9,sw=Math.sin(ph);P.bob=-Math.abs(Math.sin(ph))*3.5;L[1].phi=sw*.5;L[-1].phi=-sw*.5;A[1].phi=-sw*.55;A[-1].phi=sw*.55;break}
    case "attack":{const p=o.p!=null?o.p:(t*1.25)%1;let ph;
      if(p<.4)ph=.2+heroEase(p/.4)*3.2;else if(p<.55)ph=3.4-(p-.4)/.15*2.7;else ph=.7-(p-.55)/.45*.5;
      const k=p<.4?0:p<.6?(p-.4)/.2:Math.max(0,1-(p-.6)/.4);
      A[-1].phi=ph;A[-1].al=.12;A[1].phi=.45+k*.3;A[1].al=.35;P.lean=.16*k;L[1].phi=.38*k;L[-1].phi=-.32*k;P.bob=k*3;
      const hitPhase=p>.38&&p<.7;P.mouth=hitPhase?"open":"smile";P.eyes=hitPhase?"focus":"open";
      P.fx={type:"sword",trail:p>.4&&p<.62?[Math.min(3.4,ph+1.4),ph]:null};break}
    case "cast":{const p=(t*.7)%1,w=Math.sin(t*3);A[1].phi=A[-1].phi=1.25+w*.08;A[1].al=A[-1].al=.34;P.bob=w;P.mouth="open";P.eyes="focus";P.fx={type:"cast",p,t};break}
    case "bow":{const p=o.p!=null?o.p:(t*.8)%1,dr=p<.6?heroEase(p/.6):p<.72?1:0;
      A[1].phi=Math.PI/2;A[1].al=0;A[-1].phi=Math.PI/2;A[-1].al=.18;A[-1].ext=1-.62*dr;L[1].phi=.22;L[-1].phi=-.22;L[1].al=L[-1].al=.08;
      P.eyes=dr>.4?"focus":"open";P.fx={type:"bow",dr,p};break}
    case "sit":{const b=Math.sin(t*1.8);P.drop=30;P.bob=b*.8;L[1].phi=L[-1].phi=1.42;L[1].al=L[-1].al=.34;A[1].phi=A[-1].phi=.6;A[1].al=A[-1].al=.32;if((t%4)>3.85)P.eyes="closed";break}
    case "hit":{const p=o.p!=null?o.p:(t*1.5)%1,k=p<.12?p/.12:Math.max(0,1-(p-.12)/.5);P.lean=-.28*k;P.push=-7*k;A[1].phi=A[-1].phi=.75*k;A[1].al=A[-1].al=.14+.5*k;
      P.eyes=k>.15?"squint":"open";P.mouth=k>.15?"open":"smile";P.fx={type:"hit",k};break}
    case "death":{const p=Math.min(1,(o.dt!=null?o.dt:t%3.2)/1.1),u=heroEase(p);P.fall=u;P.lean=-.2*u;A[1].al=A[-1].al=.14+.7*u;A[1].phi=A[-1].phi=.3*u;
      L[1].al=L[-1].al=.03+.12*u;P.eyes=p>.3?"x":"squint";P.mouth="open";break}
  }
  return P;
}
/* o = {dir:0..7 (S,SE,E,NE,N,NW,W,SW, the same order as the sprite sheet rows), pose, t, sex:'m'|'f', style, hair:[3], eye:[3], suit,
   phase (walk), p (0..1 progress for attack / bow / hit), dt (seconds since death), noShadow}. Feet at (X,Y), units of a 256 px sprite frame. */
function drawHero8(g,X,Y,sc,o={}){
  const F=o.sex==="f",D=HERO_DEF[F?"f":"m"],style=o.style||D.style,HC=o.hair||D.hair,EY=o.eye||D.eye,SU=HERO_SUITS[o.suit||"def"];
  const psi=(o.dir||0)*Math.PI/4,cl=v=>Math.abs(v)<1e-6?0:v,S=cl(Math.sin(psi)),Cc=cl(Math.cos(psi)),s0=Math.sign(S);
  const pz=heroPose(o.pose||"idle",o.t||0,o);
  const OL="#2b2233",LW=2.6,TAU=Math.PI*2;
  const C=h=>{if(!SU||typeof h!=="string"||h[0]!=="#"||h.length!==7)return h;const k=h.toLowerCase();
    if(HERO_ACC.has(k))return heroMix(SU.acc[0],SU.acc[1],Math.min(1,Math.max(0,(heroLum(k)-.35)/.6)));
    if(HERO_BODY.has(k))return heroMix(SU.body[0],SU.body[1],Math.min(1,Math.max(0,(heroLum(k)-.5)/.5)));return h};
  /* ---- warp: front-view coordinates wrapped onto a turning sphere (head) or elliptic cylinder (torso) ---- */
  let WARP=null;const W=(x,y,z)=>WARP?WARP(x,y,z):[x,y,1];
  const HR=46,FL=1,HX=40,HY=52,HZ=42,HW=(x,y,z)=>{const zz=z!==undefined?z:HZ*Math.sqrt(Math.max(0,1-(x/HX)**2-((y+4)/HY)**2));return [x*Cc+zz*S-(FEAT?S*7:0),y,-x*S+zz*Cc]};let FEAT=0;
  const TA=F?27:30,TB=20,tw=Math.sqrt(TA*TA*Cc*Cc+TB*TB*S*S)/TA;
  const TW=(x,y,back)=>{const u=Math.max(-1,Math.min(1,x/TA)),th=Math.asin(u),zz=(back?-1:1)*TB*Math.cos(th);return [TA*u*Cc+zz*S,y,-TA*u*S+zz*Cc]};
  const TWB=(x,y)=>TW(-x,y,true);   // back of the torso, x seen from behind
  const kx=(x,y,r)=>{if(!WARP)return 1;const a=W(x-r,y),b=W(x+r,y);return Math.max(.14,Math.abs(b[0]-a[0])/(2*r))};
  const vz=pts=>{if(!WARP)return 1;let z=0;for(const p of pts)z+=W(p[0],p[1])[2];return z/pts.length};
  const fs=(fill,stroke,lw)=>{if(fill){g.fillStyle=fill;g.fill()}if(stroke){g.strokeStyle=stroke;g.lineWidth=lw;g.stroke()}};
  const path=(pts,close=true)=>{g.beginPath();pts.forEach((p,i)=>{const q=W(p[0],p[1]);i?g.lineTo(q[0],q[1]):g.moveTo(q[0],q[1])});if(close)g.closePath()};
  const P=(pts,fill,stroke=OL,lw=LW)=>{path(pts);fs(fill,stroke,lw)};
  const E=(x,y,rx,ry,fill,stroke=OL,lw=LW,rot=0)=>{const q=W(x,y),k=kx(x,y,rx);g.beginPath();g.ellipse(q[0],q[1],Math.max(.1,rx*k),ry,rot,0,TAU);fs(fill,stroke,lw)};
  const RR=(x,y,w,h,r,fill,stroke=OL,lw=LW)=>{if(WARP){P([[x,y],[x+w,y],[x+w,y+h],[x,y+h]],fill,stroke,lw);return}g.beginPath();g.roundRect(x,y,w,h,r);fs(fill,stroke,lw)};
  const Q=(a,c,b,stroke,lw)=>{const A=W(a[0],a[1]),Cq=W(c[0],c[1]),B=W(b[0],b[1]);g.beginPath();g.moveTo(A[0],A[1]);g.quadraticCurveTo(Cq[0],Cq[1],B[0],B[1]);g.strokeStyle=stroke;g.lineWidth=lw;g.stroke()};
  const LG=(x0,y0,x1,y1,st)=>{const q=g.createLinearGradient(x0,y0,x1,y1);st.forEach(([o,c])=>q.addColorStop(o,c));return q};
  const RG=(x,y,r0,r1,st)=>{const q=g.createRadialGradient(x,y,r0,x,y,r1);st.forEach(([o,c])=>q.addColorStop(o,c));return q};
  /* ---- hair kit ---- */
  const hairG=(y0=-60,y1=30)=>LG(0,y0,0,y1,[[0,HC[0]],[.4,HC[1]],[1,HC[2]]]);
  const curve=(pts,fill,lw=2.2)=>{const q=pts.map(p=>W(p[0],p[1]));g.beginPath();g.moveTo(q[0][0],q[0][1]);for(let i=1;i<=q.length;i++){const a=q[i-1],b=q[i%q.length];g.quadraticCurveTo((a[0]+b[0])/2+(b[1]-a[1])*.12,(a[1]+b[1])/2-(b[0]-a[0])*.12,b[0],b[1])}fs(fill,OL,lw)};
  const spikes=(cx,cy,rx,ry,n,len,a0,a1,seed,fill)=>{const pts=[];for(let i=0;i<=n;i++){const a=a0+(a1-a0)*i/n,tip=i%2==0,r=tip?1+len*(.7+.6*Math.abs(Math.sin(i*seed))):.92;pts.push([cx+Math.cos(a+(tip?.05:0))*rx*r,cy+Math.sin(a+(tip?.05:0))*ry*r,a])}
    g.beginPath();g.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++){const [x0,y0]=pts[i-1],[x1,y1,a]=pts[i];g.quadraticCurveTo((x0+x1)/2+Math.cos(a)*4,(y0+y1)/2+Math.sin(a)*4,x1,y1)}g.closePath();fs(fill,OL,2.2)};
  const strands=arr=>{g.strokeStyle="rgba(255,255,255,.7)";g.lineWidth=1.4;for(const [x0,y0,x1,y1,cx,cy] of arr){g.beginPath();g.moveTo(x0,y0);g.quadraticCurveTo(cx,cy,x1,y1);g.stroke()}};
  const blob=(list,fill)=>{const L=list.map(([x,y,r])=>{const q=W(x,y);return [q[0],q[1],r*(WARP?Math.max(.5,kx(x,y,r)):1)]});
    g.strokeStyle=OL;g.lineWidth=4.4;for(const [x,y,r] of L){g.beginPath();g.arc(x,y,r,0,TAU);g.stroke()}g.fillStyle=fill;for(const [x,y,r] of L){g.beginPath();g.arc(x,y,r,0,TAU);g.fill()}};
  const curls=(list,k=.45)=>{g.strokeStyle=HC[2];g.lineWidth=1.3;for(const [x,y,r] of list){const q=W(x,y);g.beginPath();g.arc(q[0],q[1],r*k,.4,Math.PI*1.7);g.stroke()}};
  const puffs=(list,fill)=>{for(const [x,y,r] of list)E(x,y,r,r,fill,OL,2)};
  const cap=()=>curve([[-44,16],[-45,-20],[-30,-50],[0,-58],[30,-50],[45,-20],[44,16]],hairG());
  const tie=(x,y)=>{E(x,y,6,5,"#f08a24",OL,1.6);E(x-1.5,y-1.5,2,1.4,"rgba(255,255,255,.6)",null)};
  const tail=(x0,y0,cx,cy,x1,y1,r0,r1,n,hg)=>{const L=[];for(let i=0;i<n;i++){const u=i/(n-1),w=Math.sin(u*Math.PI*3)*5;L.push([(1-u)*(1-u)*x0+2*(1-u)*u*cx+u*u*x1+w,(1-u)*(1-u)*y0+2*(1-u)*u*cy+u*u*y1,r0+(r1-r0)*u])}blob(L,hg);
    g.strokeStyle="rgba(255,255,255,.55)";g.lineWidth=1.3;g.beginPath();L.forEach(([x,y,r],i)=>i?g.lineTo(x-r*.35,y):g.moveTo(x-r*.35,y));g.stroke()};
  const afroMass=()=>{const L=[];for(let i=0;i<14;i++){const a=i/14*TAU;L.push([Math.cos(a)*48,-14+Math.sin(a)*46,16])}L.push([0,-14,45]);blob(L,hairG(-80,40));curls(L.slice(0,14),.5)};
  const CURTAIN={long:1,straight:1,bobL:1,longcurly:1};
  /* hair hanging behind the head; ph = "back" (before the body) or "front" (after the head, when the hair is nearer the camera) */
  const hairBehind=ph=>{const hg=hairG(-60,100);
    if(CURTAIN[style]){if((Cc<-.25?"front":"back")!==ph)return;g.save();g.translate(-S*HR*.42,0);g.scale(.62+.38*Math.abs(Cc),1);
      const fr=ph==="front";
      if(style==="long")curve(fr?[[-40,-20],[-30,-50],[0,-58],[30,-50],[40,-20],[48,30],[46,74],[30,66],[14,72],[0,66],[-14,72],[-30,66],[-46,74],[-48,30]]:[[-40,-20],[-30,-50],[0,-58],[30,-50],[40,-20],[48,30],[46,74],[32,62],[20,44],[-20,44],[-32,62],[-46,74],[-48,30]],hg);
      if(style==="bobL")curve(fr?[[-46,0],[-48,-20],[-30,-52],[0,-58],[30,-52],[48,-20],[46,0],[50,46],[58,56],[38,58],[0,54],[-38,58],[-58,56],[-50,46]]:[[-46,0],[-48,-20],[-30,-52],[0,-58],[30,-52],[48,-20],[46,0],[50,46],[58,56],[38,58],[30,36],[-30,36],[-38,58],[-58,56],[-50,46]],hg);
      if(style==="straight"){curve(fr?[[-42,-20],[-30,-50],[0,-58],[30,-50],[42,-20],[47,40],[46,82],[34,88],[22,82],[10,88],[0,82],[-10,88],[-22,82],[-34,88],[-46,82],[-47,40]]:[[-42,-20],[-30,-50],[0,-58],[30,-50],[42,-20],[47,40],[48,98],[30,96],[22,40],[-22,40],[-30,96],[-48,98],[-47,40]],hg);strands(fr?[[-30,-30,-34,78,-38,20],[-12,-40,-14,80,-14,20],[8,-42,10,80,10,20],[28,-32,32,78,36,20]]:[[-38,0,-40,86,-46,40],[38,0,40,86,46,40]])}
      if(style==="longcurly"){if(ph==="front")cap();const L=[];for(let i=0;i<7;i++){const y=-8+i*14,w=44+Math.sin(i*1.3)*5;L.push([-w,y,13],[w,y,13],[-w+14,y+6,11],[w-14,y+6,11])}blob(L,hg);curls(L)}
      g.restore();return}
    const anch=(ax,ay,az,draw)=>{const x=ax*Cc+az*S,z=-ax*S+az*Cc;if((z>4?"front":"back")!==ph)return;const m=Math.abs(x)<3?1:Math.sign(x)*Math.sign(ax);
      g.save();g.translate(x-m*ax-S*6,0);g.scale(m,1);draw();g.restore()};
    if(style==="ponytail")anch(-40,-46,-26,()=>{tail(-40,-46,-72,-30,-54,58,19,7,14,hairG(-70,70));tie(-36,-44)});
    if(style==="twin")for(const sd of[-1,1])anch(sd*44,-24,-16,()=>{tail(sd*44,-24,sd*66,-6,sd*54,52,14,6,12,hairG(-40,60));tie(sd*42,-24)});
    if(style==="afro"&&ph==="back")afroMass();
  };
  /* the hair mass around the skull, as a silhouette (it is the same from every side) */
  const hairMass=()=>{g.save();if(Math.abs(S)>.25&&Cc>-.3){const lim=HZ*Math.abs(S)-14;g.beginPath();g.rect(-200,-200,400,400);g.moveTo(s0*lim,-12);g.lineTo(s0*200,-12);g.lineTo(s0*200,200);g.lineTo(s0*lim,200);g.closePath();g.clip("evenodd")}g.translate(-S*4,0);hairMass0();g.restore()};
  let DOME=null;   // v22k: the bald dome takes the face's skin gradient (set by the head drawers) so no seam shows
  const hairMass0=()=>{const st=style;
    if(st==="ponytail"||st==="twin"||st==="bobL"||st==="straight"||st==="long"||st==="longcurly"){cap();strands([[-12,-50,-26,-22,-22,-42],[12,-50,26,-22,22,-42]]);return}
    if(st==="bobS"){curve([[-46,30],[-48,-20],[-30,-52],[0,-58],[30,-52],[48,-20],[46,30],[38,38],[32,22],[-32,22],[-38,38]],hairG());return}
    if(st==="afro")return;
    if(st==="bald"){E(0,-8,38,42,DOME||RG(-12,-30,2,46,[[0,"#ffeadb"],[1,"#eeb999"]]));E(-12-S*10,-34,10,5,"rgba(255,255,255,.55)",null,0,-.4);return}
    if(st==="spiky")return spikes(0,-8,47,46,28,.2,Math.PI*.86,Math.PI*2.14,1.7,hairG());
    if(st==="student"){curve([[-44,14],[-46,-20],[-30,-48],[0,-56],[30,-48],[46,-20],[44,14],[36,22],[-36,22]],hairG());return}
    if(st==="upright"){spikes(0,-8,46,44,22,.12,Math.PI*.9,Math.PI*2.1,1.3,hairG());
      for(const [a,b,c,d,e,f] of [[-38,-26,-44,-66,-22,-40],[-24,-38,-22,-80,-6,-46],[-6,-44,4,-86,14,-46],[10,-42,26,-80,28,-38],[24,-34,46,-64,40,-22]])curve([[a,b],[c,d],[e,f]],hairG(-100,-20),2);return}
    if(st==="fluffy"){puffs([[-38,8,14],[38,8,14],[-40,-14,16],[40,-14,16],[-30,-38,18],[30,-38,18],[-10,-50,19],[12,-50,19]],hairG());E(0,-14,40,40,hairG(),null);return}
    if(st==="curly"){const L=[];for(let i=0;i<16;i++){const a=Math.PI*.8+i/15*Math.PI*1.4;L.push([Math.cos(a)*42,-10+Math.sin(a)*44,10.5])}puffs(L,hairG());E(0,-12,40,40,hairG(),null);curls(L);return}
  };
  /* v22k: short styles whose silhouette stops high (spiky, upright) get a few hair tips over the nape, seen behind the ear; xe = ear x, b = -1/+1 the back */
  const napeHair=(xe,b)=>{if(style!=="spiky"&&style!=="upright")return;const X=u=>xe+b*u,hg=hairG();
