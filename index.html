<script>
window.REO_START=()=>{
/* Game storage: real localStorage when the page is allowed to use it; otherwise an in-page memory store (progress then lasts for this page only) */
const SLS=(()=>{try{const s=window.localStorage;s.setItem("__reo_t","1");s.removeItem("__reo_t");return s}catch(e){const M=new Map();return{getItem:k=>M.has(k)?M.get(k):null,setItem:(k,v)=>{M.set(k,String(v))},removeItem:k=>{M.delete(k)}}}})();
"use strict";
const AUTH=window.REO_AUTH||{saveKey:"reo.gameState.v2",oldKey:"reo.gameState.v1",isGuest:true,session:{type:"guest",name:"Guest",charName:"Arin"}};
/* REO combat core — pure functions, no DOM. Shared by the game and the test suite.
   Stat conventions follow iRO Classic (irowiki.org/classic/Stats); REO deviations are marked "REO:". */
/* REO combat core — pure functions, no DOM. Shared by the game and the test suite.
   Stat conventions follow iRO Classic (irowiki.org/classic/Stats); REO deviations are marked "REO:". */
const REOC=(()=>{
const fl=Math.floor,clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const STATS=["str","agi","vit","int","dex","luk"];

/* ---------- stat points (iRO classic) ---------- */
// level x -> x+1 grants floor(x/5)+3 points; 48 points at character creation
function statPointsTotal(lv){let p=48;for(let x=1;x<lv;x++)p+=fl(x/5)+3;return p}
// raising a stat from x to x+1 costs floor((x-1)/10)+2
const raiseCost=x=>fl((x-1)/10)+2;
function costTo(v){let c=0;for(let x=1;x<v;x++)c+=raiseCost(x);return c}
function spent(stats){return STATS.reduce((a,k)=>a+costTo(stats[k]||1),0)}

/* ---------- elements ---------- */
const STRONG={fire:"earth",water:"fire",wind:"water",earth:"wind"};
// REO: weak/same-element = 0.75 (classic goes lower); Elemental Attunement adds +5% per level to the 1.5 weakness bonus (attune = 0.05 x Lv, max 1.75 at Lv 5)
function elemMult(a,d,attune){
  if(!a||a==="neutral"||a==="holy"||!d||d==="neutral")return 1;
  if(STRONG[a]===d)return 1.5+(+attune||0);
  if(STRONG[d]===a||a===d)return .75;
  return 1;
}

/* ---------- archetype prototypes ---------- */
// hpLv/spLv: growth per Base Lv. aspd: base seconds between basic attacks. tpl: stat-build weights for auto-assign.
const ARCH={
 beginner:{type:"MELEE",range:1.6,hpLv:30,spLv:5,aspd:1.0,weapon:{atk:17,lvAtk:1,ranged:false},armor:.05,
   tpl:{str:3,agi:2,vit:2,int:0,dex:2,luk:1},basic:{kind:"phys",ratio:1},actives:["bash","first_aid"],passives:[]},
 fighter:{type:"MELEE",range:1.8,hpLv:55,spLv:5,aspd:.95,weapon:{atk:40,lvAtk:2.2,ranged:false},armor:.20,
   tpl:{str:5,agi:3,vit:3,int:0,dex:2,luk:0},basic:{kind:"phys",ratio:1},
   actives:["timber","gaslighting","forbear","power_strike","cleave","crushing_blow","war_cry"],passives:["weapon_mastery","shield_mastery","iron_body"]},   // v22e: Timber!!, Gaslighting, Forbear, Shield Mastery from NIIQ (SKILL-SPEC.md §3o-3t); Weapon(s) Mastery now Lv 1-10
 ranger:{type:"RANGED",range:9,hpLv:38,spLv:6,aspd:1.0,weapon:{atk:34,lvAtk:2.2,ranged:true},armor:.10,
   tpl:{str:0,agi:4,vit:1,int:0,dex:6,luk:2},basic:{kind:"phys",ratio:1},
   actives:["focusing","aim_strike","aiming_shower"],passives:["no_arrow","ranger_mastery"]},   // v22b: the prototype skills (Double Strafe, Arrow Shower, Piercing Shot, Evasive Leap, Eagle Eye, Steady Aim) are out of the Ranger
 spellcaster:{type:"MAGIC",range:7,hpLv:30,spLv:11,aspd:1.3,weapon:{atk:12,lvAtk:1,ranged:false,matkBase:2,matkLv:.65},armor:.05,
   tpl:{str:0,agi:0,vit:2,int:6,dex:4,luk:0},basic:{kind:"magic",ratio:.7,elem:"neutral"},
   actives:["fire_bolt","freezer","lightning_spear","petrifaction","overload_energy"],passives:["mana_flow","elemental_attunement"]},
 supporter:{type:"SUPPORT",range:9,healRange:15,hpLv:42,spLv:9,aspd:1.1,weapon:{atk:25,lvAtk:1.5,ranged:false,matkPct:.10},armor:.12,
   tpl:{str:0,agi:0,vit:4,int:5,dex:3,luk:0},basic:{kind:"magic",ratio:.6,elem:"holy"},
   actives:["heal","holy_light","blessing","sanctuary"],passives:["divine_grace","guardian_aura"]}
};

/* ---------- skills (prototype skill level 5) ----------
 kind: phys | magic | heal | buff | zone | move
 aoe: radius in tiles; at: "self" | "target". range in tiles. vct / fct: variable / fixed cast time in seconds (v20.9; vct is shortened by DEX and INT, fct only by gear). */
const SK={
 // beginner
 bash:{arch:"beginner",kind:"phys",ratio:2.0,sp:5,cd:5,range:1.6,ic:"sword"},   // v20.4: "Heavy Strike", Basic Skill Lv 4 (JOBS.md §1b): 200% ATK, SP 5, cooldown 5 s, no cast, range 1.6 tiles (= Beginner basic attack)
 first_aid:{arch:"beginner",kind:"heal",flat:50,sp:10,cd:5,ic:"plus"},   // v20.4: Basic Skill Lv 3 (JOBS.md §1b): 50 HP, SP 10, cooldown 5 s, no cast
 // fighter — Momentum: basic hits and Power Strike add stacks (max 5), Crushing Blow spends them
 power_strike:{arch:"fighter",kind:"phys",ratio:2.5,sp:8,cd:1.5,range:1.8,momentum:1,ic:"sword"},
 cleave:{arch:"fighter",kind:"phys",ratio:2.0,sp:14,cd:3.5,range:1.8,aoe:2,at:"self",ic:"cleave"},
 crushing_blow:{arch:"fighter",kind:"phys",ratio:1.8,perStack:.5,sp:12,cd:5,range:1.8,spend:true,stunAt:3,stun:1.5,ic:"hammer"},

/* Mana Flow (v20.6): Lv N = Max SP +N%, SP regen +(8+2N)%, SP cost -N% ; Lv 10 = +12% / +30% / -12% */
function manaFlow(lv){lv=Math.max(0,Math.min(10,lv|0));if(!lv)return {sp:0,regen:0,cost:0};return lv>=10?{sp:.12,regen:.30,cost:.12}:{sp:lv/100,regen:(8+2*lv)/100,cost:lv/100}}
function derive(p){
  const A=ARCH[p.arch]||ARCH.beginner,b=p.buffs||{},s={};
  for(const k of STATS)s[k]=Math.max(1,(p.stats&&p.stats[k])||1);
  if(b.blessing){s.str+=8;s.int+=8;s.dex+=8}
  // v20.6: p.pasLv (game only) = {passive: level learned}; the simulator leaves it out = every passive at its max level
  const pl=k=>A.passives.includes(k)?(p.pasLv?(p.pasLv[k]|0):skMax(k)):0,has=k=>pl(k)>0;
  const rm=pl("ranger_mastery");if(rm){s.dex+=rm;s.agi+=rm}   // v21f Ranger Mastery: DEX +Lv, AGI +Lv (HIT +Lv below)
  if(p.focus>0){s.dex=fl(s.dex*(1+p.focus));s.agi=fl(s.agi*(1+p.focus))}   // v21f Focusing: DEX and AGI +3..12%
  const sm=p.shield===false?0:pl("shield_mastery");if(sm){s.str+=sm;s.vit+=sm}   // v22e Shield Mastery (only while a shield is worn; the simulator assumes one: the Fighter set has a Tower Shield)
  const mf=manaFlow(pl("mana_flow"));
  const ranged=A.weapon.ranged;
  // iRO: melee status ATK = STR + [STR/10]^2 + [DEX/5] + [LUK/5]; ranged swaps STR and DEX
  const statusAtk=ranged? s.dex+fl(s.dex/10)**2+fl(s.str/5)+fl(s.luk/5) : s.str+fl(s.str/10)**2+fl(s.dex/5)+fl(s.luk/5);
  const watk=Math.round(A.weapon.atk+A.weapon.lvAtk*(p.lv-1));   // REO: weapon ATK grows with level to stand in for gear upgrades
  const mastery=PASSIVE.weapon_mastery.atk*pl("weapon_mastery");   // v22e: +4 ATK per level
  const mm=1+(A.weapon.matkPct||0);
  // REO (v20): weaponMATK is flat. The staff's base grows with level (stands in for gear upgrades); staff gear adds more below.
  const wm=Math.round((A.weapon.matkBase||0)+(A.weapon.matkLv||0)*(p.lv-1));
  // iRO: MATK min = INT + [INT/7]^2 ; max = INT + [INT/5]^2
  const matkMin=fl((s.int+fl(s.int/7)**2)*mm)+wm,matkMax=fl((s.int+fl(s.int/5)**2)*mm)+wm;
  const baseHP=300+A.hpLv*(p.lv-1),baseSP=80+A.spLv*(p.lv-1);
  // iRO: Max HP +1% per VIT ; Max SP +1% per INT
  const maxHP=fl(baseHP*(1+s.vit/100)*(has("iron_body")?1+PASSIVE.iron_body.hpPct:1));
  const maxSP=fl(baseSP*(1+s.int/100)*(1+mf.sp));
  // iRO: HIT = DEX + BaseLv ; FLEE = AGI + BaseLv ; CRIT = 1 + LUK*0.3 ; perfect dodge = 1 + LUK*0.1
  const hit=s.dex+p.lv+(has("weapon_mastery")?PASSIVE.weapon_mastery.hit:0)+(has("eagle_eye")?PASSIVE.eagle_eye.hit:0)+rm;
  const flee=s.agi+p.lv+(b.leap?30:0);
  const crit=1+s.luk*.3+(has("steady_aim")?PASSIVE.steady_aim.crit:0);
  const pdodge=1+s.luk*.1;
  // iRO: each AGI -0.4% and each DEX -0.1% of the base attack delay ; cap 5 hits/s (ASPD 190)
  const interval=Math.max(.2,A.aspd*(1-s.agi*.004-s.dex*.001)*(1+PASSIVE.shield_mastery.aspd*sm));   // v22e Shield Mastery: attack speed -2% per level (a longer delay)
  const aspd=Math.round(200-50*interval);
  // iRO: soft DEF ~0.8 per VIT (flat) ; hard DEF from armor (%)
  const softDef=fl(fl(s.vit*.8)*(has("iron_body")?PASSIVE.iron_body.softDefMul:1));
  const hardDef=Math.min(.7,A.armor+(b.warCry?.20:0)+(b.guard?.30:0)+(has("guardian_aura")?PASSIVE.guardian_aura.def:0));
  const mdef=Math.min(.6,.05+(has("guardian_aura")?PASSIVE.guardian_aura.mdef:0));
  const softMdef=fl(s.int/2);   // REO: half of classic's ~1 per INT
  // v20.9 (iRO Renewal): cast = VCT x vctMul + FCT x fctMul. Stats cut VCT by sqrt((DEX*2+INT)/530) (gone at 530);
  // FCT, cooldown and Global Delay are cut only by gear abilities (ab.vct / ab.fct / ab.cdr / ab.gd, in %)
  const GA=(p.gear&&p.gear.ab)||{},cut=v=>Math.max(0,1-(v||0)/100);
  const vctStat=Math.max(0,1-Math.sqrt((s.dex*2+s.int)/530));
  const vctMul=vctStat*cut(GA.vct),fctMul=cut(GA.fct),cdMul=cut(GA.cdr),gdMul=cut(GA.gd);
  const range=A.range+(has("eagle_eye")?PASSIVE.eagle_eye.range:0)+(rm>=10?3:rm>=6?2:rm>=1?1:0);   // v22d Ranger Mastery: range +1 at Lv 1, 6 and 10
  // iRO natural regen (per tick) adapted to per-second: HP = MaxHP/200 + VIT/5 ; SP = MaxSP/100 + INT/6 + 1
  const hpRegen=(maxHP/200+s.vit/5)/4;
  const spRegen=(maxSP/100+s.int/6+1)/2*(1+mf.regen);
  const d={arch:p.arch,type:A.type,lv:p.lv,s,ranged,statusAtk,watk,mastery,matkMin,matkMax,maxHP,maxSP,hit,flee,crit,pdodge,interval,aspd,softDef,hardDef,mdef,softMdef,vctStat,vctMul,fctMul,cdMul,gdMul,range,hpRegen,spRegen,
    attune:PASSIVE.elemental_attunement.per*pl("elemental_attunement"),perTile:has("steady_aim")?PASSIVE.steady_aim.perTile:0,spCost:1-mf.cost,over:p.over||0,
    healMul:1+(has("divine_grace")?PASSIVE.divine_grace.healPct:0),shieldCap:has("divine_grace")?PASSIVE.divine_grace.shieldCap:0,healRange:A.healRange||A.range};
  // gear: flat bonuses from equipped items (weapon ATK, DEF, HP, ...)
  const G=p.gear||{};
  d.watk+=G.atk||0;d.matkMin+=G.matk||0;d.matkMax+=G.matk||0;d.softDef+=G.def||0;d.hardDef=Math.min(.7,d.hardDef+(G.hardDef||0));d.maxHP+=G.hp||0;d.maxSP+=G.sp||0;d.hit+=G.hit||0;d.crit+=G.crit||0;d.flee+=G.flee||0;
  // percentage bonuses (set bonuses and affixes)
  d.statusAtk*=(1+(G.atkPct||0));d.watk*=(1+(G.atkPct||0));d.softDef*=(1+(G.defPct||0));d.maxHP=Math.floor(d.maxHP*(1+(G.hpPct||0)));d.matkMin*=(1+(G.matkPct||0));d.matkMax*=(1+(G.matkPct||0));d.healMul+=(G.healPct||0);
  if(G.atkPct||G.defPct||G.matkPct){d.statusAtk=Math.round(d.statusAtk);d.watk=Math.round(d.watk);d.softDef=Math.round(d.softDef);d.matkMin=Math.round(d.matkMin);d.matkMax=Math.round(d.matkMax)}
  if(sm){const f=1+PASSIVE.shield_mastery.def*sm;d.softDef=Math.round(d.softDef*f);d.hardDef=Math.min(.7,d.hardDef*f)}   // v22e Shield Mastery: DEF +2% per level (soft and hard DEF)
  if(p.forbear>0)d.mdef=Math.min(.6,d.mdef+p.forbear);   // v22e Forbear: MDEF +1..10%
  return d;
}

function rngOf(seed){let a=seed>>>0;return ()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
// physical: (status ATK + weapon roll + mastery) x ratio x element x bonus ; then x(1 - hard DEF) - soft DEF
function physHit(d,m,o,r){
  o=o||{};
  const em=elemMult(o.elem||"neutral",m.elem,d.attune),bonus=(o.bonus||1)*(1+(o.dist&&d.perTile?Math.min(.18,Math.max(0,o.dist-3)*d.perTile):0));
  const critPct=(o.canCrit===false)?0:Math.max(0,d.crit*(o.critMul||1)-(m.luk||0)/5);
  if(r()*100<critPct){ // iRO: crit = max weapon roll, ignores DEF and FLEE. REO: x1.4
    return {dmg:Math.max(1,fl((d.statusAtk+d.watk+d.mastery)*o.ratio*em*bonus*1.4)),crit:true};
  }
  const hitPct=clamp(80+d.hit+(o.hitBonus||0)-m.flee,5,95);   // iRO: 80 + HIT - FLEE, 5..95
  if(r()*100>=hitPct)return {dmg:0,miss:true};
  const lo=Math.min(1,.5+d.s.dex*.005);                        // DEX narrows the weapon roll
  const w=d.watk*(lo+(1-lo)*r());
  const raw=(d.statusAtk+w+d.mastery)*o.ratio*em*bonus;
  const hd=m.hardDef*(1-(o.ignoreDef||0));
  return {dmg:Math.max(1,fl(raw*(1-hd)-m.softDef))};
}
/* v20.18 status debuffs (Freezer, Petrifaction): the monster cannot move or attack, and one element hits it harder
   (Freeze: Wind +50%, Petrifaction: Fire +50%, added to the element multiplier). Chance and time drop with the target's MDEF and LUK.
   ASSUMPTION (not given by NIIQ): chance = skill% x (1 - MDEF%) - LUK/5, time = stDur x (1 - MDEF%); bosses are immune. */
const STATUS={frz:{elem:"wind",add:.5,hold:true},ptr:{elem:"fire",add:.5,hold:true},brn:{elem:"water",add:.5,dot:.1}};   // brn.dot: Burning burns for 10% MATK Fire every second (no Overload); a Freeze puts it out   // v21e: Burning (Fire Bolt) does not hold the monster in place
function stAdd(elem,m){let a=0;if(!m)return 0;for(const k in STATUS)if(m[k]>0&&STATUS[k].elem===elem)a+=STATUS[k].add;return a}
function stRoll(k,m,r){if(!k.st||!m||m.boss)return 0;const mdef=m.mdef||0,ch=k.stCh*100*(1-mdef)-(m.luk||0)/5;return r()*100<ch?+(k.stDur*(1-mdef)).toFixed(2):0}
// magic: MATK roll x ratio x element ; then x(1 - MDEF) - soft MDEF ; never misses
function magicHit(d,m,o,r){
  const matk=d.matkMin+(d.matkMax-d.matkMin)*r();
  const em=elemMult(o.elem||"neutral",m.elem,d.attune)+stAdd(o.elem,o.st||m);   // o.st: the monster in the game (m is only its profile there)
  // Overload (magic critical, COMBAT-FORMULAS.md 3b): chance = max(0, CRIT - targetLUK/5) x overMul; a skill without overMul never Overloads.
  // Damage uses the top of the MATK range x1.3 and still takes MDEF.
  // v20.6: Overload Energy adds its +% to the base Overload Rate (d.over), not to CRIT
  const op=Math.min(100,Math.max(0,(d.crit+(d.over||0)-(m.luk||0)/5)*(o.overMul||0)));
  if(op>0&&r()*100<op)return {dmg:Math.max(1,fl(d.matkMax*o.ratio*em*(o.bonus||1)*1.3*(1-m.mdef)-m.softMdef)),weak:em>1,over:true};
  return {dmg:Math.max(1,fl(matk*o.ratio*em*(o.bonus||1)*(1-m.mdef)-m.softMdef)),weak:em>1};
}
// iRO Heal: [(BaseLv + INT) / 8] x (4 + 8 x SkillLv)
function healAmount(d,sk){if(sk.flat)return fl(sk.flat*d.healMul);return fl(fl((d.lv+d.s.int)/8)*(4+8*(sk.lvl||5))*d.healMul)}
function monHit(m,d,r,shielded){
  if(r()*100<d.pdodge)return {dmg:0,miss:true,lucky:true};
  const hitPct=clamp(80+m.hit-d.flee,5,95);
  if(r()*100>=hitPct)return {dmg:0,miss:true};
  return {dmg:Math.max(1,fl(m.atk*(.85+.3*r())*(1-d.hardDef)-d.softDef))};
}

/* ---------- auto stat build ---------- */
function autoStats(arch,lv,base){
  const A=ARCH[arch]||ARCH.beginner,s=Object.assign({str:1,agi:1,vit:1,int:1,dex:1,luk:1},base||{});
  let pts=statPointsTotal(lv)-spent(s);
  const w=A.tpl,tot=STATS.reduce((a,k)=>a+(w[k]||0),0)||1;
  for(let guard=0;guard<2000;guard++){
    let best=null,bv=Infinity;
    for(const k of STATS){if(!w[k]||s[k]>=99)continue;const c=raiseCost(s[k]);if(c>pts)continue;
      const v=(s[k]-1)/(w[k]/tot);if(v<bv){bv=v;best=k}}
    if(!best)break;pts-=raiseCost(s[best]);s[best]++;
  }
  return s;
}

/* ---------- skill levels (v20) ----------
   Skills listed in SKLV have levels; every other skill is still the fixed Lv 5 prototype.
   v20.18 Spellcaster spells, Lv 1-5 each (SKILL-SPEC.md §3, §3e-3g). */
const SKLV={fire_bolt:{max:5,def:5},freezer:{max:5,def:5},lightning_spear:{max:5,def:5},petrifaction:{max:5,def:5},overload_energy:{max:5,def:5},mana_flow:{max:10,def:10},elemental_attunement:{max:5,def:5},
  no_arrow:{max:5,def:5},ranger_mastery:{max:10,def:10},focusing:{max:10,def:10},aim_strike:{max:10,def:10},aiming_shower:{max:10,def:10},   // v21f Ranger
  weapon_mastery:{max:10,def:10},shield_mastery:{max:10,def:10},timber:{max:10,def:10},gaslighting:{max:10,def:10},forbear:{max:10,def:10}};   // v22e Fighter
/* v21f skill requirements: {skill: {needed skill: level}} (Skills Tree locks the tile until they are met) */
const SKREQ={forbear:{gaslighting:3},ranger_mastery:{no_arrow:1},focusing:{no_arrow:3},aim_strike:{no_arrow:5},aiming_shower:{no_arrow:5}};
const NA_SC=[20,16,12,8,4];                                                                     // No Arrow: Scandium per arrow shot, Lv 1-5
const FO_P=[.03,.04,.05,.06,.07,.08,.09,.1,.11,.12];                                              // Focusing: DEX / AGI +%, time 40+20*Lv s, SP 20+5*Lv; no cast, GD 0, CD 0
const AS_R=[1,1.1,1.2,1.3,1.4,1.5,1.6,1.7,1.8,2],AS_N=[2,2,2,2,2,3,3,3,3,3],AS_CH=[.2,.22,.24,.26,.28,.3,.32,.34,.36,.38],AS_SP=[10,10,10,10,10,10,10,10,10,10];   // Aim Strike (v21h): ATK in total, arrows when split, split chance, SP (v22a: 10 at every level); FCT 0.5, VCT 0.5, GD 1, CD 1
const TB_R=[1.3,1.6,1.9,2.2,2.5,2.8,3.1,3.4,3.7,4],TB_SP=[8,8,8,8,8,15,15,15,15,15];   // v22e Timber!!: ATK, SP; HIT bonus +5 per level; FCT 0, VCT 0.5, GD 0.5, CD 1.5
const GL_D=[.1,.15,.2,.25,.3,.35,.4,.45,.5,.55],GL_A=[.05,.08,.11,.14,.17,.2,.23,.26,.29,.32];   // v22e Gaslighting: soft DEF down, ATK up; time 5 s (Lv 1-5) / 10 s (Lv 6-10); SP 3+Lv; GD 0.3, CD 1
const AW_R=[1.6,1.7,1.8,1.9,2,2.1,2.2,2.3,2.4,2.5];                                              // Aiming Shower: SP 20, FCT 0.1, GD 0.1   // v20.6: passives with levels too (derive reads them)
const OE_DUR=[20,40,60,80,120],OE_VCT=[1,1.2,1.4,1.6,2];   // Overload Energy Lv 1-5: +Lv% Overload Rate, duration, VCT (FCT 0), SP 35+15*Lv; cooldown 60 s and Global Delay 1 s at every level
const FB_N=[1,3,5,7,10],FB_SP=[12,17,22,27,40],FB_GAP=[0,.3,.3,.2,.2],FB_FCT=[.5,.6,.7,.8,1];   // Fire Bolt: 120% MATK per fireball, VCT 0, GD 1 s, CD 0
const FB_CH=[.3,.4,.5,.6,.7];                                                                    // v21e Fire Bolt: Burning chance; each fireball splashes 50% MATK on a 3x3 square around the target
const FZ_R=[1.1,1.3,1.5,1.7,2],FZ_CH=[.35,.45,.55,.65,.75];                                     // Freezer: SP 25, FCT 0.16, VCT 0.64, GD 0.5 s, CD 0
const LS_SP=[30,42,54,66,78],LS_VCT=[1,1.2,1.4,1.6,1.8];                                         // Lightning Spear: 2 spears per Lv, 100% MATK each, 0.1 s apart, FCT 1.5, GD 2 s, CD 0
const PT_R=[.75,.8,.85,.9,1],PT_CH=[.3,.4,.55,.65,.75],PT_SP=[25,27,28,32,35];                   // Petrifaction: FCT 0.2, VCT 0.8, GD 0, CD 0
const ST_DUR=[3,4,5,6,7];   // ASSUMPTION: Burning / Freeze / Petrifaction time by skill level (not given yet), before the target's MDEF
const skMax=id=>SKLV[id]?SKLV[id].max:1;   // every other skill is learn-only (one level) until its levels are designed
function skAt(id,lv){
  const k=SK[id];if(!k||!SKLV[id])return k;
  const L=clamp(Math.floor(lv)||SKLV[id].def,1,SKLV[id].max);
  const i=L-1;
  if(id==="fire_bolt")return Object.assign({},k,{lv:L,hits:FB_N[i],sp:FB_SP[i],gap:FB_GAP[i],fct:FB_FCT[i],stCh:FB_CH[i],stDur:ST_DUR[i]});
  if(id==="freezer")return Object.assign({},k,{lv:L,ratio:FZ_R[i],stCh:FZ_CH[i],stDur:ST_DUR[i]});
  if(id==="lightning_spear")return Object.assign({},k,{lv:L,hits:2*L,sp:LS_SP[i],vct:LS_VCT[i]});
  if(id==="petrifaction")return Object.assign({},k,{lv:L,ratio:PT_R[i],stCh:PT_CH[i],sp:PT_SP[i],stDur:ST_DUR[i]});
  if(id==="overload_energy")return Object.assign({},k,{lv:L,over:L,dur:OE_DUR[L-1],vct:OE_VCT[L-1],sp:35+15*L});
  if(id==="focusing")return Object.assign({},k,{lv:L,focus:FO_P[i],dur:40+20*L,sp:20+5*L});
  if(id==="aim_strike")return Object.assign({},k,{lv:L,ratio:AS_R[i],split:AS_N[i],splitCh:AS_CH[i],sp:AS_SP[i]});
  if(id==="aiming_shower")return Object.assign({},k,{lv:L,ratio:AW_R[i]});
  if(id==="timber")return Object.assign({},k,{lv:L,ratio:TB_R[i],sp:TB_SP[i],hitBonus:5*L});
  if(id==="gaslighting")return Object.assign({},k,{lv:L,defD:GL_D[i],atkU:GL_A[i],dur:L>5?10:5,sp:3+L});
  if(id==="forbear")return Object.assign({},k,{lv:L,dur:7+3*L,mdef:L/100});

// v20.9: real cast time in seconds for skill row k and derived stats d (VCT cut by stats and gear, FCT by gear only)
const castTime=(k,d)=>(k.vct||0)*d.vctMul+(k.fct||0)*d.fctMul;
/* ---------- skill AI (used by idle play and by the simulator) ----------
 ctx: {d, hp, sp, cd{}, momentum, buffs{}, dist (to target), near (# targets within 2.5), tgtElem, inZone} */
function pickSkill(ctx){
  const d=ctx.d,A=ARCH[d.arch],skx=id=>skAt(id,(ctx.skLv&&ctx.skLv[id])||0),ready=id=>{const k=skx(id);return k&&!(ctx.gd>0)&&(!ctx.learned||ctx.learned.includes(id))&&!(ctx.cd[id]>0)&&ctx.sp>=k.sp*d.spCost};
  const reserve=ctx.sp>d.maxSP*.2;
  const hpPct=ctx.hp/d.maxHP;
  switch(d.arch){
   case "beginner":
    if(hpPct<.5&&ready("first_aid"))return "first_aid";
    if(reserve&&ready("bash")&&ctx.dist<=Math.max(SK.bash.range,d.range))return "bash";   // the game steps in to the skill range firstreturn null;
   case "fighter":
    if(hpPct<.6&&!ctx.buffs.warCry&&ready("war_cry"))return "war_cry";
    if(!ctx.buffs.forbear&&ctx.engaged&&ctx.dist<=4&&ready("forbear"))return "forbear";   // v22e: keep Forbear up while fighting
    if(ctx.near>=2&&!ctx.boss&&!ctx.tgtGas&&ctx.dist<=SK.gaslighting.range&&ready("gaslighting"))return "gaslighting";   // v22e: pull a pack and lower its DEF
    if(ctx.dist>SK.power_strike.range)return null;
    if(ctx.momentum>=4&&ready("crushing_blow"))return "crushing_blow";
    if(ctx.near>=2&&ready("cleave"))return "cleave";
    if((reserve||ctx.near>=2)&&ready("timber"))return "timber";   // v22e: Timber!! before Power Strike
    if(reserve&&ready("power_strike"))return "power_strike";return null;
   case "ranger":
    if(!ctx.buffs.focus&&ctx.dist<=d.range+3&&ready("focusing"))return "focusing";   // v21f: keep Focusing up while fighting
    if(ctx.dist>d.range)return null;
    if(ctx.dist<=2.5&&ready("aiming_shower"))return "aiming_shower";   // v21f: push a monster that came close back 2 tiles
    if((reserve||ctx.near>=2)&&ready("aim_strike"))return "aim_strike";return null;   // v22b: the old Ranger skills are gone
   case "spellcaster":{
    if(!ctx.buffs.overEn&&ctx.dist<=d.range&&ready("overload_energy"))return "overload_energy";   // v20.6: keep the Overload Energy buff up while fighting
    if(ctx.dist>d.range)return null;
    // v20.18: damage per second of cast + Global Delay, times the enemies it reaches; the target's weakness and its Freeze / Petrifaction count.
    // A Freeze or Petrifaction the target does not have yet is worth more (it stops the monster and opens a weakness).
    const st=ctx.tgtSt||{},held=st.frz>0||st.ptr>0||st.stun>0,nearMe=ctx.nearMe!=null?ctx.nearMe:(ctx.dist<=3.5?ctx.near:0);
    // ctx.autoLv (simulator only): also pick the level - the hits that can still land on what is left of the target's HP,
    // per second while SP is above half, per SP below that. In the game Idle keeps the level set on the hotbar.
    const lowSp=ctx.sp<d.maxSP*.5,matk=(d.matkMin+d.matkMax)/2*(1-(ctx.tgtMdef||0));
    let best=null,bv=0,bl=0;
    for(const id of ["fire_bolt","freezer","lightning_spear","petrifaction"]){
      const lvs=ctx.autoLv?Array.from({length:skMax(id)},(_,i)=>i+1):[0];
      for(const L of lvs){const k=L?skAt(id,L):skx(id);
        if(!k||ctx.gd>0||(ctx.learned&&!ctx.learned.includes(id))||ctx.cd[id]>0||ctx.sp<k.sp*d.spCost)continue;
        const n=id==="lightning_spear"?Math.max(1,ctx.near):id==="petrifaction"?nearMe:1;if(!n)continue;
        const em=elemMult(k.elem,ctx.tgtElem,d.attune)+stAdd(k.elem,st),hit=k.ratio*em;
        const hits=ctx.autoLv&&ctx.tgtHp?Math.min(k.hits||1,Math.ceil(ctx.tgtHp/Math.max(1,hit*matk))):(k.hits||1);
        let v=hit*hits*n/(ctx.autoLv&&lowSp?k.sp:Math.max(.5,castTime(k,d)+(k.gd||0)*d.gdMul));
        if(k.st&&!(STATUS[k.st].hold?held:st[k.st]>0)&&!ctx.boss)v*=1+k.stCh*(STATUS[k.st].hold?1:.25);   // Burning only opens a weakness, it does not stop the monster
        if(k.splash&&ctx.near>1&&(!k.splashOn||st[k.splashOn]>0||k.st===k.splashOn))v*=1+k.splash*(ctx.near-1)*(k.splashOn?k.stCh:1)*.5;   // splash reaches some of the pack
        if(v>bv){bv=v;best=id;bl=L}}}
    if(!best)return null;
    ctx.pickLv=bl;
    if(!reserve&&!(SK[best].st&&STATUS[SK[best].st].hold)&&elemMult(SK[best].elem,ctx.tgtElem,d.attune)+stAdd(SK[best].elem,st)<=1)return null;
    return best;}
   case "supporter":
    if(hpPct<.55&&ready("heal"))return "heal";
    if(!ctx.buffs.blessing&&ready("blessing"))return "blessing";
    if(ctx.dist<=d.range&&!ctx.inZone&&ctx.engaged&&ready("sanctuary"))return "sanctuary";
    if(ctx.dist<=SK.holy_light.range&&reserve&&ready("holy_light"))return "holy_light";
    return null;
  }
  return null;
}

/* ---------- simulator ----------
 Fights packs of `pack` monsters for `secs` seconds. Monsters are passive until hit, then chase at 1.6x speed.
 Returns kills, deaths, damage dealt/taken, average HP left. Used by tests and offline-idle estimates. */
function simulate(arch,lv,monKeys,opt){
  opt=opt||{};const KL=id=>skAt(id,(opt.skLv||{})[id]||0);const r=rngOf(opt.seed||7),secs=opt.secs||300,pack=opt.pack||1,dt=.05,travel=opt.travel??4;
  const stats=opt.stats||autoStats(arch,lv);
  const buffs={},cd={};let zone=0,shield=0,momentum=0,momT=0,ovV=0,focV=0,fbV=0,arrows=0;   // arrows: arrows shot (v21f No Arrow costs Scandium per arrow)
  const DV=()=>derive({arch,lv,stats,buffs,gear:opt.gear,over:buffs.overEn>0?ovV:0,focus:buffs.focus>0?focV:0,forbear:buffs.forbear>0?fbV:0});
  let d=DV();
  let hp=d.maxHP,sp=d.maxSP,t=0,kills=0,deaths=0,dealt=0,taken=0,hpSum=0,hpN=0,casting=null,swing=0,mi=0,wait=0;
  let mobs=[],pending=[],gdT=0;
  const spawn=()=>{const key=monKeys[mi++%monKeys.length];const m=Object.assign({},opt.elite?eliteOf(MONC[key]):MONC[key]);
    mobs=[];for(let i=0;i<pack;i++)mobs.push(Object.assign({},m,{key,hpNow:m.hp,dist:d.type==="MELEE"?2.2:Math.min(d.range,8),aggro:false,atkCd:0,stun:0}))};
  spawn();
  const tgt=()=>mobs.find(m=>m.hpNow>0);
  const hitMob=(m,res)=>{if(res.miss)return;m.hpNow-=res.dmg;dealt+=res.dmg;if(pack>1)mobs.forEach(x=>x.aggro=true);else m.aggro=true};
  const doBasic=m=>{const b=ARCH[arch].basic;
    if(b.kind==="phys"){if(d.ranged)arrows++;const res=physHit(d,m,{ratio:b.ratio,dist:d.ranged?m.dist:0},r);hitMob(m,res);if(arch==="fighter"&&!res.miss){momentum=Math.min(5,momentum+1);momT=5}}
    else hitMob(m,magicHit(d,m,{ratio:b.ratio,elem:b.elem},r))};
  const doSkill=(id,m,L)=>{const k=L?skAt(id,L):KL(id);sp-=k.sp*d.spCost;cd[id]=k.cd*d.cdMul;if(k.gd)gdT=k.gd*d.gdMul;
    const targets=k.aoe?mobs.filter(x=>x.hpNow>0&&(k.at==="self"?x.dist<=k.aoe+.5:true)):(m?[m]:[]);
    if(k.kind==="phys"&&k.split){arrows++;   // v21h Aim Strike: one arrow of k.ratio in total; when it splits the arrows share it; each arrow splashes 50% of its share
      const n=r()<k.splitCh?k.split:1,per=k.ratio/n;for(let h=0;h<n&&m&&m.hpNow>0;h++){const res=physHit(d,m,{ratio:per,canCrit:true,critMul:k.critMul,dist:m.dist},r);hitMob(m,res);
        if(!res.miss)for(const x of mobs){if(x===m||x.hpNow<=0||Math.abs(x.dist-m.dist)>k.splashR)continue;hitMob(x,physHit(d,x,{ratio:per*k.splash,canCrit:false,dist:x.dist},r))}}}
    else if(k.kind==="phys"&&k.knock){arrows++;if(m){hitMob(m,physHit(d,m,{ratio:k.ratio,canCrit:false,dist:m.dist},r));m.dist=Math.min(d.range,m.dist+k.knock)}}   // v21f Aiming Shower: push back 2 tiles
    else if(k.kind==="phys"){if(k.ranged)arrows+=(k.hits||1)*targets.length;for(const x of targets)for(let h=0;h<(k.hits||1);h++){
        const ratio=k.ratio+(k.spend?k.perStack*momentum:0);
        const res=physHit(d,x,{ratio,ignoreDef:k.ignoreDef,canCrit:!!k.canCrit,critMul:k.critMul,dist:k.ranged?x.dist:0,hitBonus:k.hitBonus,bonus:buffs.leapShot?1.6:1},r);hitMob(x,res);
        if(k.splashAll&&!res.miss)for(const y of mobs){if(y===x||y.hpNow<=0||Math.abs(y.dist-x.dist)>k.splashR)continue;hitMob(y,physHit(d,y,{ratio:k.splashAll,canCrit:false},r))}   // v22e Timber!!: 70% on the others in 3x3
        if(k.stunCh&&!res.miss&&!x.boss&&r()<k.stunCh)x.stun=Math.max(x.stun,k.stunT)}
      if(buffs.leapShot&&k.ranged)buffs.leapShot=0;
      if(k.momentum)momentum=Math.min(5,momentum+k.momentum),momT=5;
      if(k.spend){if(momentum>=k.stunAt&&m)m.stun=k.stun;momentum=0}}
    else if(k.kind==="magic"){for(const x of targets)for(let h=0;h<(k.hits||1);h++){if(k.gap)pending.push({t:(k.gap||0)*h+(k.gap?k.gap-.02:0),x,k});else hitMob(x,magicHit(d,x,{ratio:k.ratio,elem:k.elem,overMul:k.overMul},r))};
      if(k.st)for(const x of targets){if(x.hpNow<=0)continue;const sd=stRoll(k,x,r);if(sd>0){if(STATUS[k.st].hold)x.stun=Math.max(x.stun,sd);x[k.st]=Math.max(x[k.st]||0,sd);if(k.st==="frz")x.brn=0}}
      // v21e splash: 50% MATK on the others in a 3x3 square round the target (Fire Bolt: every fireball; Freezer: only while the target is frozen). No positions here, so "close" = a similar distance
      if(k.splash&&m&&(!k.splashOn||m[k.splashOn]>0))for(const x of mobs){if(x===m||x.hpNow<=0||Math.abs(x.dist-m.dist)>k.splashR)continue;for(let h=0;h<(k.hits||1);h++)hitMob(x,magicHit(d,x,{ratio:k.ratio*k.splash,elem:k.elem},r))}}
    else if(k.kind==="heal"){const h=healAmount(d,k),over=Math.max(0,hp+h-d.maxHP);hp=Math.min(d.maxHP,hp+h);if(d.shieldCap)shield=Math.min(d.maxHP*d.shieldCap,shield+over)}
    else if(k.kind==="debuff"){for(const x of mobs){if(x.hpNow<=0||x.boss)continue;if(x.sd0==null){x.sd0=x.softDef;x.atk0=x.atk}x.softDef=x.sd0*(1-k.defD);x.atk=x.atk0*(1+k.atkU);x.gasT=k.dur;x.aggro=true}}   // v22e Gaslighting (the pack stands together here)
    else if(k.kind==="buff"){buffs[k.buff]=k.dur;if(k.over)ovV=k.over;if(k.focus)focV=k.focus;if(k.buff==="forbear")fbV=k.mdef;if(k.buff==="blessing"||k.over||k.focus||k.buff==="forbear")d=DV();
      if(k.taunt)mobs.forEach(x=>x.aggro=true)}
    else if(k.kind==="move"){for(const x of mobs)x.dist+=k.leap;buffs.leap=k.dur;buffs.leapShot=1;d=DV()}
    else if(k.kind==="zone"){zone=k.dur}};
  while(t<secs){
    t+=dt;
    for(const k in cd)cd[k]=Math.max(0,cd[k]-dt);gdT=Math.max(0,gdT-dt);
    for(const q of pending)q.t-=dt;
    for(let i=0;i<pending.length;){const q=pending[i];if(q.x.hpNow<=0){pending.splice(i,1);continue}if(q.t<=0){pending.splice(i,1);hitMob(q.x,magicHit(d,q.x,{ratio:q.k.ratio,elem:q.k.elem,overMul:q.k.overMul},r));continue}i++}
    for(const k of Object.keys(buffs)){if(k==="leapShot")continue;buffs[k]-=dt;if(buffs[k]<=0){delete buffs[k];d=DV()}}
    if(momT>0){momT-=dt;if(momT<=0)momentum=0}
    sp=Math.min(d.maxSP,sp+d.spRegen*dt);
    if(wait>0){wait-=dt;hp=Math.min(d.maxHP,hp+(d.hpRegen+d.maxHP*.015)*dt);if(wait<=0)spawn();continue}
    const m=tgt();
    if(!m){kills+=pack;hpSum+=hp/d.maxHP;hpN++;wait=travel;casting=null;if(wait<=0)spawn();continue}
    // zone ticks
    if(zone>0){zone-=dt;hp=Math.min(d.maxHP,hp+d.maxHP*SK.sanctuary.healPct*dt);
      const zd=(d.matkMin+d.matkMax)/2*SK.sanctuary.ratio*dt;
      for(const x of mobs)if(x.hpNow>0&&x.dist<=SK.sanctuary.radius+1){const z=zd*(1-x.mdef);x.hpNow-=z;dealt+=z;x.aggro=true}}
    // monsters
    for(const x of mobs){if(x.gasT>0){x.gasT-=dt;if(x.gasT<=0){x.softDef=x.sd0;x.atk=x.atk0}}if(x.frz>0)x.frz-=dt;if(x.ptr>0)x.ptr-=dt;if(x.brn>0&&x.hpNow>0){x.brn-=dt;x.brnAcc=(x.brnAcc||0)+dt;if(x.brnAcc>=1||x.brn<=0){x.brnAcc=0;hitMob(x,magicHit(d,x,{ratio:STATUS.brn.dot,elem:"fire"},r))}}if(x.hpNow<=0||!x.aggro)continue;if(x.stun>0){x.stun-=dt;continue}
      if(x.dist>1.2){x.dist=Math.max(1.2,x.dist-x.speed*1.6*dt);continue}
      x.atkCd-=dt;if(x.atkCd<=0){x.atkCd=x.aspd;const res=monHit(x,d,r);if(!res.miss){let dmg=res.dmg;if(shield>0){const a=Math.min(shield,dmg);shield-=a;dmg-=a}hp-=dmg;taken+=dmg}}}
    if(hp<=0){deaths++;hp=d.maxHP;sp=d.maxSP;momentum=0;shield=0;zone=0;wait=20;casting=null;pending=[];spawn();continue}
    // player
    if(d.type==="MELEE"&&m.dist>d.range){m.dist=Math.max(d.range,m.dist-3.6*dt);continue}
    if(casting){casting.t-=dt;if(casting.t<=0){const c=casting;casting=null;doSkill(c.id,tgt(),c.lv)}continue}
    swing-=dt;
    const near=mobs.filter(x=>x.hpNow>0&&x.dist<=2.5).length;
    const ctx={d,hp,sp,cd,momentum,buffs,dist:m.dist,near:pack>1?mobs.filter(x=>x.hpNow>0).length:1,nearMe:mobs.filter(x=>x.hpNow>0&&x.dist<=4).length,tgtSt:{frz:m.frz,ptr:m.ptr,brn:m.brn,stun:m.stun},tgtGas:m.gasT>0,boss:!!m.boss,autoLv:!opt.skLv,tgtHp:m.hpNow,tgtMdef:m.mdef,tgtElem:m.elem,inZone:zone>0,engaged:m.aggro,skLv:opt.skLv,gd:gdT};
    const id=pickSkill(ctx);

/* idle estimate: kills per hour on a map, using the simulator once and caching by inputs */
const _cache=new Map();
function killsPerHour(arch,lv,stats,monKeys,gear){
  const key=arch+"|"+lv+"|"+JSON.stringify(stats)+"|"+JSON.stringify(gear||{})+"|"+monKeys.join(",");
  if(_cache.has(key))return _cache.get(key);
  const res=simulate(arch,lv,monKeys,{stats,secs:600,seed:11,gear});
  const v={kph:Math.round(res.kills*6),deathsPerHour:res.deaths*6,dps:res.dps,aph:res.arrows*6};   // aph: arrows shot per hour (No Arrow)
  _cache.set(key,v);return v;
}
/* Combat Power: offense = DPS from a short simulation that uses the archetype's skills against a reference mix
   of all field monsters; defense = effective HP. Same scale for every archetype. */
const CP_REF=["lumite","crawlix","oculoth","nebulite","shardback","cryoculus"];
const _cpc=new Map();
function combatPower(arch,lv,stats,gear){
  const key=arch+"|"+lv+"|"+JSON.stringify(stats)+"|"+JSON.stringify(gear||{});if(_cpc.has(key))return _cpc.get(key);
  const d=derive({arch,lv,stats,gear});
  const sim=simulate(arch,lv,CP_REF,{stats,secs:180,seed:3,travel:0,gear});
  const ehp=d.maxHP/(1-d.hardDef)+d.softDef*30;
  const v=Math.round(sim.dps*6+ehp/20);_cpc.set(key,v);return v;
}
return {manaFlow,STATS,statPointsTotal,raiseCost,costTo,spent,elemMult,ARCH,SK,PASSIVE,derive,MONC,eliteOf,rngOf,physHit,magicHit,healAmount,monHit,autoStats,pickSkill,simulate,killsPerHour,combatPower,skAt,SKLV,skMax,castTime,stRoll,stAdd,STATUS,SKREQ,NA_SC};
})();

D2.en.skd_freezer="Grips the target with the power of ice: Water magic damage to one enemy and a chance of Freeze, which also cuts its resistance to Wind by 50%. While the target is frozen, Freezer also splashes 50% MATK Water damage on a 3 × 3 area around it. The chance and time of Freeze change with the skill level and the target's MDEF and LUK.";D2.th.skd_freezer="ยึดจับและเหนี่ยวนำด้วยพลังน้ำแข็ง สร้างความเสียหายทางเวทมนตร์ธาตุ Water ต่อศัตรู 1 ตัว และมีโอกาสทำให้ติดสถานะ Freeze (แช่แข็ง) ที่ลดความต้านทานต่อธาตุ Wind ลง 50% เมื่อเป้าหมายติด Freeze จะ Splash ธาตุ Water รอบเป้าหมายกว้าง 3 × 3 ช่องด้วย MATK 50% โอกาสและระยะเวลาติด Freeze เปลี่ยนตามเลเวลสกิล พลังป้องกันเวทมนตร์ และ LUK ของเป้าหมาย";
D2.en.sk_lightning_spear="Lightning Spear";D2.th.sk_lightning_spear="Lightning Spear";

D2.en.helper_i0="Hello, traveler. I help Beginners find their path. Every adventurer eventually chooses one Archetype — a way of fighting that shapes everything after.";D2.th.helper_i0="สวัสดีนักเดินทาง ข้ามีหน้าที่ช่วย Beginner หาเส้นทางของตัวเอง นักผจญภัยทุกคนจะต้องเลือกอาร์คีไทป์หนึ่งสาย ซึ่งเป็นวิธีต่อสู้ที่กำหนดทุกอย่างหลังจากนี้";
D2.en.helper_i1="Fighters stand in front, 1–3 tiles away. They build Momentum with every hit and unleash it in a crushing finisher. The toughest of all.";D2.th.helper_i1="Fighter ยืนแนวหน้า ระยะ 1–3 ช่อง สะสม Momentum จากทุกการโจมตีแล้วปลดปล่อยเป็นท่าปิดฉาก ทนทานที่สุด";
D2.en.helper_i2="Rangers strike from up to 9 tiles with arrows of Scandium. Their arrows can split in mid-air, and a heavy shot pushes any monster back, even a boss.";D2.th.helper_i2="Ranger โจมตีไกลได้ถึง 9 ช่องด้วยลูกธนู Scandium ลูกธนูแยกกลางอากาศได้ และยิงดอกหนักผลักมอนถอยหลังได้ แม้แต่บอส";
D2.en.helper_i3="Spellcasters cast from 7 tiles. Spells never miss, and striking a monster's elemental weakness deals far more damage.";D2.th.helper_i3="Spellcaster ร่ายเวทจากระยะ 7 ช่อง เวทไม่มีวันพลาด และโจมตีธาตุที่ศัตรูแพ้จะแรงกว่ามาก";
D2.en.helper_i4="Supporters heal and bless across 15 tiles. They hit softly, but almost never fall — and overhealing becomes a shield.";D2.th.helper_i4="Supporter ฮีลและบัฟได้ไกล 15 ช่อง ตีเบาแต่แทบไม่ล้ม และฮีลที่เกินจะกลายเป็นโล่";
D2.en.helper_notyet="You can only choose once, so learn your craft first. Come back when you reach Job Lv 10 (you're Job Lv {j}).";D2.th.helper_notyet="เลือกได้ครั้งเดียวเท่านั้น ฝึกฝนให้ดีก่อน กลับมาเมื่อถึง Job Lv 10 นะ (ตอนนี้ Job Lv {j})";
D2.en.helper_offer="You've reached Job Lv 10. Prove your strength: defeat 1 Elite monster in any field, then return and choose your Archetype.";D2.th.helper_offer="เจ้าถึง Job Lv 10 แล้ว พิสูจน์ฝีมือก่อน ไปปราบมอนสเตอร์ Elite ในทุ่งไหนก็ได้ 1 ตัว แล้วกลับมาเลือกอาร์คีไทป์ของเจ้า";

/* ================= Audio (v18): 8-bit chip music for every map + sound effects, all synthesized (no files) ================= */
const AUD=(()=>{
  let ctx=null,master=null,musG=null,sfxG=null,noiseB=null,track=null,trackName="",step=0,nextT=0,pendingMap=null,bossOn=false;
  const stats={notes:0,sfx:0,tracks:0},last={},PW={};
  const hz=n=>440*Math.pow(2,(n-69)/12);
  const rng=seed=>{let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}};
  const TR={   // root = MIDI note, scale = semitone steps, prog = chord degree per bar
    town:{bpm:112,root:60,scale:[0,2,4,6,7,9,11],prog:[0,3,1,4],lead:"p25",arpOct:12,drums:"light",bass:"walk",seed:11,dens:.8},        // bright, strange (lydian)
    field1:{bpm:92,root:62,scale:[0,2,3,5,7,9,10],prog:[0,5,3,4],lead:"p25",arpOct:12,drums:"soft",bass:"walk",seed:23,dens:.65},     // calm and curious (dorian)
    field2:{bpm:80,root:57,scale:[0,1,3,5,7,8,10],prog:[0,1,0,6],lead:"p125",arpOct:12,drums:"soft",bass:"long",seed:37,dens:.55},    // dusk (phrygian)
    field3:{bpm:72,root:64,scale:[0,2,4,6,8,10],prog:[0,2,1,3],lead:"triangle",arpOct:24,drums:"none",bass:"long",seed:41,dens:.5},   // icy, sparkling (whole tone)
    geo:{bpm:76,root:52,scale:[0,2,3,5,7,8,11],prog:[0,5,2,6],lead:"p125",arpOct:12,drums:"soft",bass:"long",seed:67,dens:.5},          // ancient, heavy (harmonic minor)
    ruins:{bpm:104,root:55,scale:[0,1,4,5,7,8,11],prog:[0,1,5,4],lead:"square",arpOct:12,drums:"drive",bass:"pulse",seed:79,dens:.8},     // scorched, driving (double harmonic)
    ashfall:{bpm:118,root:50,scale:[0,1,4,5,7,8,10],prog:[0,6,5,1],lead:"square",arpOct:12,drums:"drive",bass:"pulse",seed:97,dens:.85},  // v22 ashen, ominous (phrygian dominant)
    boss:{bpm:152,root:54,scale:[0,2,3,5,7,8,11],prog:[0,5,6,4],lead:"square",arpOct:12,drums:"drive",bass:"pulse",seed:53,dens:.9}   // tense
  };
  const MAPTRACK={town:"town",field1:"field1",field2:"field2",field3:"field3",geo:"geo",ruins:"ruins",ashfall:"ashfall"};
  function deg(sp,d){const L=sp.scale.length;return sp.root+sp.scale[((d%L)+L)%L]+12*Math.floor(d/L)}
  function makeTrack(sp){
    const R=rng(sp.seed),steps=[];for(let i=0;i<64;i++)steps.push({});
    let ld=4;   // melody position (scale degree)
    for(let b=0;b<4;b++){
      const r=sp.prog[b],ch=[r,r+2,r+4],o=b*16;
      // bass
      if(sp.bass==="pulse")for(let i=0;i<16;i+=2)steps[o+i].bass=deg(sp,r)-24+(i%8===6?7:0);
      else if(sp.bass==="long"){steps[o].bass=deg(sp,r)-24;steps[o+8].bass=deg(sp,r+4)-24}
      else{steps[o].bass=deg(sp,r)-24;steps[o+6].bass=deg(sp,r)-24;steps[o+8].bass=deg(sp,r+4)-24;steps[o+14].bass=deg(sp,r+2)-24}
      // arpeggio (8th notes)
      for(let i=0;i<8;i++){const pat=[0,1,2,1][i%4];steps[o+i*2].arp=deg(sp,ch[pat])+sp.arpOct}
      // melody: random walk over the scale, longer notes on the last bar
      let s=0;while(s<16){
        if(R()>sp.dens){s+=2;continue}
        const len=[2,2,4,2,3,1,4][(R()*7)|0];ld+=[-2,-1,-1,0,1,1,2][(R()*7)|0];ld=Math.max(0,Math.min(11,ld));
        const strong=s%8===0?ch[(R()*3)|0]+7:ld;steps[o+s].lead=[deg(sp,s%8===0?strong:ld)+12,Math.min(len,16-s)];s+=len;
      }
      if(b===3)steps[o+12].lead=[deg(sp,0)+12,4];
      // drums
      const d=sp.drums;
      for(let i=0;i<16;i++){
        if(d==="light"){if(i===0||i===8)steps[o+i].kick=1;if(i%4===2)steps[o+i].hat=1}
        else if(d==="soft"){if(i===0||(i===8&&b%2))steps[o+i].kick=1;if(i===12)steps[o+i].snare=.5;if(i%4===2)steps[o+i].hat=.6}
        else if(d==="drive"){if([0,3,6,8,10,12].includes(i))steps[o+i].kick=1;if(i===4||i===12)steps[o+i].snare=1;if(i%2===0)steps[o+i].hat=1}
      }
    }
    return steps;
  }
  function pw(d){if(PW[d])return PW[d];const n=32,re=new Float32Array(n),im=new Float32Array(n);for(let k=1;k<n;k++)re[k]=2/(k*Math.PI)*Math.sin(k*Math.PI*d);return PW[d]=ctx.createPeriodicWave(re,im)}
  function tone(t0,f,dur,type,vol,dest,slide){
    const o=ctx.createOscillator(),g=ctx.createGain();
    if(type==="p25")o.setPeriodicWave(pw(.25));else if(type==="p125")o.setPeriodicWave(pw(.125));else o.type=type;
    o.frequency.setValueAtTime(f,t0);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,slide),t0+dur);
    g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(Math.max(.0002,vol),t0+.008);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
    o.connect(g);g.connect(dest);o.start(t0);o.stop(t0+dur+.03);stats.notes++;
  }
  function noise(t0,dur,vol,hp,dest){
    const s=ctx.createBufferSource();s.buffer=noiseB;const f=ctx.createBiquadFilter();f.type="highpass";f.frequency.value=hp;
    const g=ctx.createGain();g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);s.connect(f);f.connect(g);g.connect(dest);s.start(t0);s.stop(t0+dur+.03);stats.notes++;
  }
  function playStep(st,t0,sp,sd){
    if(st.lead)tone(t0,hz(st.lead[0]),st.lead[1]*sd*.95,sp.lead,.2,musG);
    if(st.arp)tone(t0,hz(st.arp),sd*1.4,"p125",.075,musG);
    if(st.bass)tone(t0,hz(st.bass),sd*(sp.bass==="long"?6:1.6),"triangle",.3,musG);
    if(st.kick)tone(t0,150,.1,"sine",.42,musG,45);
    if(st.snare)noise(t0,.09,.18*st.snare,1500,musG);
    if(st.hat)noise(t0,.035,.07*st.hat,7000,musG);
  }
  function sched(){
    if(!ctx||!track||document.hidden)return;
    if(!S.music){nextT=ctx.currentTime+.1;return}
    const sp=TR[trackName],sd=60/sp.bpm/4;
    if(nextT<ctx.currentTime-.3)nextT=ctx.currentTime+.05;
    while(nextT<ctx.currentTime+.18){playStep(track[step%64],nextT,sp,sd);nextT+=sd;step++}
  }
  function ensure(){
    if(ctx){if(ctx.state==="suspended")ctx.resume();return}
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    try{
      ctx=new AC();master=ctx.createGain();master.gain.value=.55;master.connect(ctx.destination);
      musG=ctx.createGain();musG.gain.value=.16;musG.connect(master);sfxG=ctx.createGain();sfxG.gain.value=.5;sfxG.connect(master);
      const n=ctx.sampleRate*.5;noiseB=ctx.createBuffer(1,n,ctx.sampleRate);const d=noiseB.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
      setInterval(sched,30);
      if(pendingMap)setMap(pendingMap);
    }catch(e){ctx=null}
  }
  function play(name){
    if(name===trackName&&track)return;
    trackName=name;track=makeTrack(TR[name]);step=0;stats.tracks++;
    if(ctx){const t0=ctx.currentTime;musG.gain.cancelScheduledValues(t0);musG.gain.setValueAtTime(.02,t0);musG.gain.linearRampToValueAtTime(.16,t0+.8);nextT=t0+.08}
  }
  function setMap(id){if(id!==pendingMap)bossOn=false;pendingMap=id;if(!ctx)return;play(bossOn?"boss":(MAPTRACK[id]||"field1"))}

/* ================= world basics ================= */
const TW=64,TH=32,HW=32,HH=16,N0=49;
/* v20: every map has its own grid size. Every map, Gadolinium included, is 2× the old 49×49 (98×98).
   N always holds the size of the CURRENT map; code that works on another map uses m.N. */
const MAPK={town:2,field1:2,field2:2,field3:2,geo:2,ruins:2,ashfall:2};
let N=N0*MAPK.town;
/* Lite mode: phones and low-memory devices get a smaller ground texture and keep only one map in memory */
const LITE=(()=>{try{const sm=Math.min(screen.width||9999,screen.height||9999)<=820;return matchMedia("(pointer:coarse)").matches||sm||(navigator.deviceMemory&&navigator.deviceMemory<=4)}catch(e){return true}})();
const GS=LITE?1:1.25;
/* ground texture scale per map: big maps drop a little resolution so the texture stays inside a memory budget */
const GROUND_BUDGET=LITE?24e6:40e6;
function groundScale(m){const a=(m.N*TW)*(m.N*TH+48);return Math.min(GS,Math.sqrt(GROUND_BUDGET/a))}
const T_G=0,T_R=1,T_P=2,T_W=3,T_D=4,T_F=5,T_C=6;   // T_C = chasm (blocked fault crack)
const I=(x,y)=>y*N+x, inb=(x,y)=>x>=0&&y>=0&&x<N&&y<N;
function hash(x,y){let h=(x*374761393+y*668265263)|0;h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return (h>>>0)/4294967296}
function P(x,y,z=0){return [(x-y)*HW,(x+y)*HH-z]}
/* Gadolinium layout (98×98): center, main road half-width, plaza radius, crystal monument */
const TC=49,ROAD_HW=2.1,PLAZA_R=11.5,CRY=[49,49],CRY_R=4.4,TOWN_SPAWN=[54.5,54.5];
const isRoadBand=(x,y)=>Math.abs(x+.5-TC)<ROAD_HW||Math.abs(y+.5-TC)<ROAD_HW;
function shade(hex,f){const n=parseInt(hex.slice(1),16);let r=n>>16,gg=n>>8&255,b=n&255;if(f<0){r*=1+f;gg*=1+f;b*=1+f}else{r+=(255-r)*f;gg+=(255-gg)*f;b+=(255-b)*f}return `rgb(${r|0},${gg|0},${b|0})`}
function newMap(id){const K=MAPK[id]||1,n=N0*K;return {id,K,N:n,map:new Uint8Array(n*n),blk:new Uint8Array(n*n),statics:[],B:[],portals:[],pools:[],npcs:[],wanderers:[],monsters:[]}}
function addS(m,o){const p=P(o.cx,o.cy);o.sx=p[0];o.sy=p[1];m.statics.push(o);return o}
const inEll=(x,y,e)=>((x-e[0])/e[2])**2+((y-e[1])/e[3])**2<=1;

/* ================= town ================= */
const HOUSE_ROOFS=["#d0409a","#2aa8c8","#8ad030","#8a50e0","#20c0a0","#e08a30"];
const TOWN_GATES=[[95,49],[2,49],[49,95]];   // east (Field 01), west (Path to the Geosyncline), south (Road to the Ruins)
function buildTown(){
  const m=newMap("town");Object.assign(m,{nameK:"mapName",subK:"mapSub",bg:["#1a1040","#070418"]});
  const {map,blk}=m,N=m.N,I=(x,y)=>y*N+x,inb=(x,y)=>x>=0&&y>=0&&x<N&&y<N;m.pools=[[74,24,6.7,4.8],[20,82,4,3]];
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    let tp=T_G;
    if(hash(x>>2,(y>>2)+17)<.2&&hash(x,y)<.55)tp=T_F;
    if(isRoadBand(x,y))tp=T_R;
    if(Math.hypot(x+.5-TC,y+.5-TC)<=PLAZA_R)tp=T_P;
    for(const e of m.pools)if(inEll(x+.5,y+.5,e)){tp=T_W;blk[I(x,y)]=1}
    map[I(x,y)]=tp;
    if(x===0||y===0||x===N-1||y===N-1)blk[I(x,y)]=1;
  }
  const HOUSES=[[72,38],[18,38],[54,14],[74,70],[16,68],[36,80],[36,16],[86,64],[62,84],[12,52]];
  m.B=[
   {id:"guild",x:26,y:26,w:5,h:4,H:76,wall:"#cdc6ee",trim:"#2c2250",roof:"#5a3fc0",label:"b_guild",flag:true},
   {id:"tool",x:58,y:30,w:3,h:3,H:52,wall:"#c8f0e8",trim:"#1c4a58",roof:"#18a8b0",label:"b_tool"},
   {id:"inn",x:60,y:58,w:4,h:4,H:68,wall:"#eed0f2",trim:"#44225a",roof:"#c03ad0",label:"b_inn"},
   {id:"smith",x:30,y:58,w:4,h:3,H:54,wall:"#b8b0d0",trim:"#2a2048",roof:"#e0508a",label:"b_smith",chimney:true},
   ...HOUSES.map(([x,y],i)=>({id:"h"+i,x,y,w:3,h:3,H:46,wall:["#e4dcf6","#d8f2ee","#f0e0f4"][i%3],trim:"#34224f",roof:HOUSE_ROOFS[i%HOUSE_ROOFS.length]}))
  ];
  for(const b of m.B){
    for(let y=b.y;y<b.y+b.h;y++)for(let x=b.x;x<b.x+b.w;x++)blk[I(x,y)]=1;
    const dx=b.x+Math.floor(b.w/2),dy=b.y+b.h;const vert=b.y+b.h/2<TC;let x=dx,y=dy,guard=0;
    while(inb(x,y)&&map[I(x,y)]!==T_R&&map[I(x,y)]!==T_P&&!blk[I(x,y)]&&guard++<200){map[I(x,y)]=T_R;if(vert)y++;else x+=(x<TC?1:-1)}
    addS(m,{kind:"bld",b,cx:b.x+b.w/2,cy:b.y+b.h/2,k:b.x+b.y+(b.w+b.h)/2});
  }
  /* the crystal monument sits in the middle of the plaza; its round dais blocks walking */
  for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(Math.hypot(x+.5-CRY[0],y+.5-CRY[1])<CRY_R)blk[I(x,y)]=1;
  addS(m,{kind:"crystal",cx:CRY[0],cy:CRY[1],k:CRY[0]+CRY[1]+.5,cull:520});
  const prop=(k,x,y)=>{if(!inb(x,y)||blk[I(x,y)])return;blk[I(x,y)]=1;addS(m,{kind:k,x,y,cx:x+.5,cy:y+.5,k:x+y+1,v:hash(x,y)})};
  for(const [k,x,y] of [["barrel",34,58],["barrel",34,59],["crate",61,31],["crate",61,32],["barrel",64,60],["crate",31,30],["barrel",77,73],["crate",21,42]])prop(k,x,y);
  /* market ring: stalls around the plaza, between the four roads */
  for(let i=0;i<8;i++){const a=(i+.5)*Math.PI/4;prop("stall",Math.floor(TC+Math.cos(a)*14.5),Math.floor(TC+Math.sin(a)*14.5))}
  const lampOK=(x,y)=>{if(!inb(x,y)||blk[I(x,y)])return false;const tp=map[I(x,y)];return tp===T_G||tp===T_F};
  for(let i=4;i<N-4;i+=5)for(const [x,y] of [[i,46],[i,51],[46,i],[51,i]]){
    if(!lampOK(x,y))continue;blk[I(x,y)]=1;addS(m,{kind:"lamp",x,y,cx:x+.5,cy:y+.5,k:x+y+1,v:hash(x,y)});
  }
  for(let i=0;i<12;i++){const a=(i+.5)*Math.PI/6,x=Math.floor(TC+Math.cos(a)*(PLAZA_R+1.2)),y=Math.floor(TC+Math.sin(a)*(PLAZA_R+1.2));
    if(lampOK(x,y)&&!isRoadBand(x,y)){blk[I(x,y)]=1;addS(m,{kind:"lamp",x,y,cx:x+.5,cy:y+.5,k:x+y+1,v:hash(x,y)})}}
  {const used=[],near=(x,y,d)=>used.some(q=>Math.hypot(q[0]-x,q[1]-y)<d);
    const okT=(x,y)=>{const tp=map[I(x,y)];return inb(x,y)&&(tp===T_G||tp===T_F)&&!blk[I(x,y)]&&Math.hypot(x+.5-TC,y+.5-TC)>PLAZA_R+4&&TOWN_GATES.every(q=>Math.hypot(x-q[0],y-q[1])>5)&&x>2&&y>2&&x<N-3&&y<N-3};
    const put=(kind,x,y,s)=>{blk[I(x,y)]=1;used.push([x,y]);addS(m,{kind,x,y,cx:x+.5,cy:y+.5,k:x+y+1,v:hash(x*3,y*7),s});};
    for(let i=0;i<8;i++){const a=i*Math.PI/4+.4;let x=Math.round(TC+Math.cos(a)*18),y=Math.round(TC+Math.sin(a)*18);if(okT(x,y)&&!near(x,y,3))put("mono",x,y,1.05)}
    const kinds=[["eye",.0042,1.05],["pod",.0075,1],["tent",.0055,1],["float",.0042,1.05]];
    for(let y=3;y<N-3;y++)for(let x=3;x<N-3;x++){if(!okT(x,y))continue;const r=hash(x*13+5,y*17+3);let acc=0;for(const [k,p,s] of kinds){acc+=p;if(r<acc){if(!near(x,y,3.2))put(k,x,y,s*(.9+hash(x,y)*.25));break}}}}
  const pt={x:95,y:49,to:"field1",labelK:"field1_name"};m.portals.push(pt);addS(m,{kind:"portal",p:pt,cx:95.5,cy:49.5,k:145});
  /* v19: west gate -> Path to the Geosyncline (Lv 25+, CP 2,000+), south gate -> Road to the Ruins (Lv 30+, CP 3,000+); each has a warning sign */
  const pw={x:2,y:49,to:"geo",labelK:"geo_name"},ps={x:49,y:95,to:"ruins",labelK:"ruins_name"};
  m.portals.push(pw);addS(m,{kind:"portal",p:pw,cx:2.5,cy:49.5,k:52});
  m.portals.push(ps);addS(m,{kind:"portal",p:ps,cx:49.5,cy:95.5,k:145});
  for(const [x,y,lv] of [[4,45,25],[45,93,30]])if(!blk[I(x,y)]){blk[I(x,y)]=1;addS(m,{kind:"warnsign",x,y,cx:x+.5,cy:y+.5,k:x+y+1,lv})}
  plantTrees(m,(x,y,border,r)=>{
    if(TOWN_GATES.some(q=>Math.hypot(x-q[0],y-q[1])<4))return null;
    if(r<(border?.62:.05)){const hv=hash(y*7,x*11);return hv<.14?{kind:"shroom",v:hash(x,y*5),alt:hv<.07?2:0}:{kind:"tree",v:hv<.45?4:hv<.78?5:hv<.92?3:0}}
    return null;
  });
  return m;
}
function plantTrees(m,pick){
  const {map,blk}=m,N=m.N,I=(x,y)=>y*N+x,inb=(x,y)=>x>=0&&y>=0&&x<N&&y<N;
  for(let y=1;y<N-1;y++)for(let x=1;x<N-1;x++){
    if(blk[I(x,y)])continue;const tp=map[I(x,y)];if(tp!==T_G&&tp!==T_F)continue;
    const border=x<4||y<4||x>N-5||y>N-5;let ok=true;
    for(let j=-1;j<=1&&ok;j++)for(let i=-1;i<=1;i++){const nx=x+i,ny=y+j;if(!inb(nx,ny))continue;const nt=map[I(nx,ny)];
      if(nt===T_R||nt===T_P||nt===T_W||nt===T_D||(blk[I(nx,ny)]&&!(nx===0||ny===0||nx===N-1||ny===N-1))){ok=false;break}}
    if(!ok)continue;
    const o=pick(x,y,border,hash(x*3+1,y*5+2));
    if(o){blk[I(x,y)]=1;addS(m,Object.assign({x,y,cx:x+.5,cy:y+.5,k:x+y+1,s:.82+hash(x+5,y+9)*.38},o))}
  }
}

function staticBox(o){
  if(o.kind==="bld"){const b=o.b,Z=b.H+20+Math.min(b.w,b.h)*7.5+(b.flag?50:14);return [(b.x-(b.y+b.h))*HW-6,(b.x+b.y)*HH-Z,(b.x+b.w-b.y)*HW+6,(b.x+b.w+b.y+b.h)*HH+8]}
  const [sx,sy]=P(o.cx,o.cy),s=o.s||1;
  switch(o.kind){case "tree":return [sx-30*s,sy-92*s,sx+30*s,sy+4];case "lamp":return [sx-9,sy-70,sx+9,sy+2];case "stall":return [sx-38,sy-52,sx+38,sy+14];
    case "barrel":case "crate":return [sx-17,sy-32,sx+17,sy+6];case "crystal":return [sx-200,sy-340,sx+200,sy+100];case "eye":return [sx-20,sy-74,sx+20,sy+4];
    case "pod":return [sx-16,sy-56,sx+16,sy+4];case "tent":return [sx-26,sy-62,sx+26,sy+4];case "mono":return [sx-24,sy-84,sx+24,sy+8];case "float":return [sx-34,sy-96,sx+34,sy+8];case "shroom":return [sx-30,sy-70,sx+30,sy+6];case "bgate":return [sx-130,sy-200,sx+130,sy+30]}
  return null;
}
function npcBlocked(x,y){
  const [sx,sy]=P(x,y),k=x+y,box=[sx-26,sy-132,sx+26,sy+22];
  for(const o of town.statics){if(o.kind==="portal")continue;const bb=staticBox(o);if(!bb||o.k<k-.05)continue;if(bb[0]<box[2]&&bb[2]>box[0]&&bb[1]<box[3]&&bb[3]>box[1])return true}
  return false;
}
function placeTownNpcs(){
  const taken=[];
  for(const n of town.npcs){
    const ax=n.x,ay=n.y;let best=null,bs=1e9;
    for(let dy=-9;dy<=9;dy++)for(let dx=-9;dx<=9;dx++){
      const ix=Math.floor(ax)+dx,iy=Math.floor(ay)+dy,x=ix+.5,y=iy+.5;
      if(!walkM(town,ix,iy))continue;const tp=town.map[iy*town.N+ix];if(tp!==T_R&&tp!==T_P)continue;
      if(Math.hypot(x-CRY[0],y-CRY[1])<CRY_R+1.6||Math.hypot(x-TOWN_GATES[0][0],y-TOWN_GATES[0][1])<6)continue;
      if(taken.some(q=>Math.hypot(q[0]-x,q[1]-y)<4.5))continue;
      if(npcBlocked(x,y))continue;
      let nb=0;for(let j=-1;j<=1;j++)for(let i=-1;i<=1;i++)if(!walkM(town,ix+i,iy+j))nb++;
      const sc=Math.hypot(x-ax,y-ay)+nb*.35;if(sc<bs){bs=sc;best=[x,y]}
    }
    if(best){n.x=best[0];n.y=best[1]}taken.push([n.x,n.y]);
  }
  for(const w of town.wanderers){let gd=0;while(town.npcs.some(n=>Math.hypot(n.x-w.x,n.y-w.y)<2.8)&&gd++<200){const [x,y]=townSpot();if(walkM(town,x,y)){w.x=x+.5;w.y=y+.5}}}
}

  g.fillStyle="#e4fff6";g.fillText(txt,x,y+.5);

}

const ELITE={hp:5,atk:1.6,def:3,exp:5,sc:4,size:1.3};
function spawnPos(m,type){const K=m.K||1,z=MON[type].zone.map(v=>v*K);for(let k=0;k<400;k++){const x=z[0]+Math.floor(Math.random()*(z[1]-z[0])),y=z[2]+Math.floor(Math.random()*(z[3]-z[2]));
  if(walkM(m,x,y)&&!m.portals.some(p=>Math.hypot(x-p.x,y-p.y)<8)&&(MON[type].boss||!m.arena||Math.hypot(x+.5-m.arena[0],y+.5-m.arena[1])>m.arena[2]+1))return [x+.5,y+.5]}return [m.N/2,m.N/2]}
/* v20: fields are 4× the area, so each keeps 3× the monsters and 2 Elites per kind */
const MON_MULT=3,ELITE_PER=2;
/* v21c: besides the scattered monsters, every hunting map has PACK_N packs, one per kind (3 kinds = 3 packs). A pack is a tight group
   of the same kind around a fixed centre (picked at load inside the kind's zone, at least PACK_GAP tiles from the other packs). Members
   wander only PACK_WANDER tiles around the centre, respawn next to it, and when one is attacked or spots you the whole pack charges. */
const PACK_R=2.5,PACK_WANDER=3,PACK_GAP=14,PACK_LINK=10;
const packSize=d=>d.count>=8?6:d.count>=6?5:4;   // the weakest kind runs in the biggest pack
function packSpot(m,pk){for(let k=0;k<60;k++){const a=Math.random()*Math.PI*2,r=Math.random()*PACK_R,x=Math.floor(pk.x+Math.cos(a)*r),y=Math.floor(pk.y+Math.sin(a)*r);
  if(walkM(m,x,y)&&(!m.arena||Math.hypot(x+.5-m.arena[0],y+.5-m.arena[1])>m.arena[2]+1))return [x+.5,y+.5]}return [pk.x,pk.y]}
function newMon(type,elite,pack){const d=MON[type],m=MAPS[d.map],[x,y]=pack?packSpot(m,pack):spawnPos(m,type),hp=d.hp*(elite?ELITE.hp:1);
  return mk({mon:true,type,boss:!!d.boss,rage:false,slamT:6+Math.random()*3,tele:null,skCd:null,elite:!!elite,pack:pack||null,x,y,home:[x,y],hp,maxHp:hp,speed:d.speed,wait:Math.random()*3,aggro:false,atkCd:0,hitT:0,dieT:0,dead:false,respawn:0,repath:0,phase:Math.random()*9})}
for(const k in MON){const m=MAPS[MON[k].map];if(MON[k].boss){m.monsters.push(newMon(k,false));continue}
  for(let i=0;i<MON[k].count*MON_MULT;i++)m.monsters.push(newMon(k,false));for(let i=0;i<ELITE_PER;i++)m.monsters.push(newMon(k,true));
  m.packs=m.packs||[];let c=spawnPos(m,k);for(let t=0;t<40&&m.packs.some(p=>Math.hypot(p.x-c[0],p.y-c[1])<PACK_GAP);t++)c=spawnPos(m,k);
  const pk={x:c[0],y:c[1],type:k};m.packs.push(pk);for(let i=0;i<packSize(MON[k]);i++)m.monsters.push(newMon(k,false,pk))}
function respawnMon(mo){Object.assign(mo,newMon(mo.type,mo.elite,mo.pack))}
/* the whole pack joins in once one member is angry */
function packAggro(mo){if(!mo.pack)return;for(const o of cur.monsters)if(o!==mo&&o.pack===mo.pack&&!o.aggro&&!o.dead&&o.dieT<=0&&Math.hypot(o.x-mo.x,o.y-mo.y)<=PACK_LINK){o.aggro=true;o.speed=MON[o.type].speed*1.6;o.path=[];o.repath=0}}
const mAtk=mo=>MON[mo.type].atk*(mo.elite?ELITE.atk:1),mDef=mo=>MON[mo.type].def+(mo.elite?ELITE.def:0),mLv=mo=>MON[mo.type].lv+(mo.elite?2:0),mSize=mo=>MON[mo.type].size*(mo.elite?ELITE.size:1);

function gStats(arch,slot,L,r,ref){
  const m=(3+L*.8)*[1,1.4,2,2.8,4][r-1]*(1+.04*(ref||0));

    case "legs":o.def=Math.round(m*.6);o.hp=Math.round(m*3);break;
    case "offhand":o.def=Math.round(m*.7);o.hardDef=+(r*.01*(1+.04*(ref||0))).toFixed(3);break;
    case "necklace":o.hp=Math.round(m*10);o.sp=Math.round(m*2);break;
    case "ring":o.crit=+(m*.08).toFixed(2);o.hit=Math.round(m*.3);break;
    case "headTop":o.def=Math.round(m*.6);o.hp=Math.round(m*4);o.flee=Math.round(m*.3);break;
    case "headMid":o.hp=Math.round(m*4);o.sp=Math.round(m*2.5);break;
    case "headLow":o.def=Math.round(m*.4);o.sp=Math.round(m*3);break;
    case "garment":o.def=Math.round(m*.5);o.hp=Math.round(m*5);break;
    case "shoes":o.def=Math.round(m*.5);o.flee=Math.round(m*.6);break;
    case "shield":o.def=Math.round(m*.9);o.hardDef=+(r*.01*(1+.04*(ref||0))).toFixed(3);break;
    case "bracelet":o.crit=+(m*.1).toFixed(2);o.hp=Math.round(m*6);break;

  o.attr[PRIMARY[arch]]=Math.round(m*.35);

const RMUL=[1,1.3,1.7,2.2,2.8];

function rollGear(arch,L,r,k,slot){
  const f=+RANDF(.85,1.15).toFixed(3);
  const naff=[1,1,2,2,3][r-1],nab=[0,Math.random()<.3?1:0,1,Math.random()<.5?2:1,2][r-1];
  const pool=[...AFF_ATTR,...AFF_FLAT,...AFF_PCT,"crit"],aff=[];
  for(let i=0;i<naff;i++){
    const key=pool.splice(Math.floor(Math.random()*pool.length),1)[0];let v;
    if(AFF_PCT.includes(key))v=+(RANDF(1.5,3)*(1+r*.25+L/60)/100).toFixed(4);
    else if(key==="crit")v=+(RANDF(.5,1.2)*RMUL[r-1]*(1+L/80)).toFixed(2);
    else if(AFF_ATTR.includes(key))v=Math.max(1,Math.round(RANDF(.6,1.2)*RMUL[r-1]*(2+L*.12)/2));
    else v=Math.max(1,Math.round(RANDF(.6,1.2)*RMUL[r-1]*(3+L*.9)));
    aff.push([key,v]);
  }
  const apool=[...ABIL],ab=[];
  for(let i=0;i<nab;i++){const a=apool.splice(Math.floor(Math.random()*apool.length),1)[0];
    const base=RANDF(a.min,a.max);ab.push([a.id,a.unit==="%"?+(base*(1+L/200)).toFixed(2):Math.round(base*(1+L/30))])}
  return {f,aff,ab};
}

function mkMods(){return {atk:0,matk:0,def:0,hardDef:0,hp:0,sp:0,hit:0,crit:0,flee:0,atkPct:0,matkPct:0,defPct:0,hpPct:0,healPct:0,spPct:0,attr:{str:0,agi:0,vit:0,int:0,dex:0,luk:0},ab:{}}}

function gFull(it){
  const p=gParse(it.id),ro=it.roll||{f:1,aff:[],ab:[]},b=gStats(p.arch,p.slot,p.L,p.r,it.ref||0),m=mkMods();
  for(const k of ["atk","matk","def","hp","sp","hit","crit","flee"])m[k]=b[k]*ro.f;

function gCompareRows(newIt,oldIt){
  const a=newIt?gFull(newIt):mkMods(),b=oldIt?gFull(oldIt):mkMods(),rows=[];
  const pf=(k,v)=>MOD_PCT.has(k)||k.endsWith("Pct")?`${(v*100).toFixed(1).replace(/\.0$/,"")}%`:k==="crit"?(Math.round(v*10)/10).toFixed(1):`${Math.round(v)}`;
  const df=(k,d)=>{const sg=d>0?"+":"";return MOD_PCT.has(k)||k.endsWith("Pct")?`${sg}${(d*100).toFixed(1).replace(/\.0$/,"")}%`:k==="crit"?`${sg}${(Math.round(d*10)/10).toFixed(1)}`:`${sg}${Math.round(d)}`};
  const push=(label,k,av,bv)=>{if(av===0&&bv===0)return;const d=av-bv;if(Math.abs(d)<1e-9)return;rows.push({label,old:pf(k,bv),nw:pf(k,av),diff:df(k,d),cls:d>0?"up":"down"})};
  for(const k of ["atk","matk","def","hp","sp","hit","flee","crit","hardDef"])push(MODLBL[k]?LP(MODLBL[k]):k,k,a[k],b[k]);
  for(const k of AFF_ATTR)push(k.toUpperCase(),k,a.attr[k],b.attr[k]);
  for(const k of ["atkPct","matkPct","defPct","hpPct","healPct"]){const l=MODLBL[k];push(LP(l)+"%",k,a[k],b[k])}
  const ids=new Set([...Object.keys(a.ab),...Object.keys(b.ab)]);
  for(const id of ids){const ab=ABIL_BY_ID[id],av=a.ab[id]||0,bv=b.ab[id]||0;const f=v=>ab.unit==="%"?`${v.toFixed(1)}%`:`${Math.round(v)}`;
    if(av===bv)continue;rows.push({label:LO(ab),old:bv?f(bv):"—",nw:av?f(av):"—",diff:av&&bv?`${av>bv?"+":""}${ab.unit==="%"?(av-bv).toFixed(1)+"%":Math.round(av-bv)}`:av?"NEW":"−",cls:av>=bv?"up":"down"})}
  return rows;
}

/* ---- party (max 6) and guild invites. Other players are simulated: some are already in a party / guild ---- */
const PARTY_MAX=6,PT_NAME_MAX=10,PT_LV_GAP=20,ptPending=new Set(),gdPending=new Set();let ptArm=null,ptRen=false;
// PT_BONUS[n-1] = party bonus (%) for n members, cumulative: 2nd member +5, 3rd +7, 4th +9, 5th +11, 6th +15
const PT_BONUS=[0,5,12,21,32,47];
town.wanderers.forEach((w,i)=>{w.hasParty=i%4===1;w.hasGuild=i%3===0});
const inMyParty=n=>!!(S.party&&S.party.members.some(m=>m.name===n));
const guildCanInvite=()=>!!(S.guild&&(S.guild.rank==="master"||S.guild.rank==="officer"||S.guild.canInvite));
const ptClean=s=>graphemes(String(s||"").replace(/\s+/g," ").trim()).slice(0,PT_NAME_MAX).join("");
const ptTitle=p=>fmt("pt_title",{n:player.name,p});   // "CharName (Party name)"
function ptSize(P=S.party){return P?P.members.length+1:1}
function ptLvGap(P=S.party,extra){const L=[S.lv,...(P?P.members.map(m=>m.lv):[])];if(extra!=null)L.push(extra);return Math.max(...L)-Math.min(...L)}
function ptActive(P=S.party){return !!P&&ptSize(P)>1&&ptLvGap(P)<=PT_LV_GAP}   // bonus and sharing need >1 member and a level gap of at most 20
function ptRewards(P=S.party){const on=ptActive(P),n=on?ptSize(P):1;return {on,n,mul:1+PT_BONUS[n-1]/100,shE:on&&!!P.share.exp,shI:on&&!!P.share.items}}
// Item sharing rotates the loot through [you, ...members]. Without it you keep what you get
// (the simulated members deal no damage, so the top-damage rule always gives the loot to you).
function ptTake(shI,label){
  const P=S.party;if(!shI||!P)return true;
  const N=P.members.length+1,k=(P.rr||0)%N;P.rr=(P.rr||0)+1;
  if(k===0)return true;
  if(label)pushChat({ch:"party",raw:fmt("pt_lootTo",{n:P.members[k-1].name,i:label})});
  return false;
}

/* ================= map travel ================= */
/* Arrival = a walkable tile next to the destination map's portal that leads back to where we came from */
function walkableNear(m,x,y){
  for(let r=1;r<=6;r++){            // nearest ring first
    let best=null,bd=1e9;
    for(let yy=y-r;yy<=y+r;yy++)for(let xx=x-r;xx<=x+r;xx++){
      if(Math.max(Math.abs(xx-x),Math.abs(yy-y))!==r||!walkM(m,xx,yy))continue;
      const d=Math.hypot(xx-m.N/2,yy-m.N/2);if(d<bd){bd=d;best=[xx+.5,yy+.5]}   // within that ring, face the map center
    }
    if(best)return best;
  }
  return m===town?TOWN_SPAWN.slice():[m.N/2,m.N/2];
}
function arriveAt(to,from){
  const m=MAPS[to],p=m&&m.portals.find(q=>q.to===from);
  return p?walkableNear(m,p.x,p.y):(to==="town"?TOWN_SPAWN.slice():[m.N/2,m.N/2]);
}

/* ---- v21f No Arrow (SKILL-SPEC.md §3j): a Ranger who learned it shoots Scandium arrows; every arrow that leaves the bow costs
   NA_SC[Lv-1] Scandium (20 / 18 / 15 / 13 / 10). Split arrows of Aim Strike come from one arrow and cost nothing more.

function shootArrow(mo,dur,o){o=o||{};const f=o.from||[player.x,player.y];
  fx.push({k:"arrow",x:f[0],y:f[1],tx:mo.x,ty:mo.y,m:mo,t:-(o.t0||0),d:dur,sc:arrowCost()>0,arc:o.arc==null?22:o.arc,z0:o.from?o.z0||40:26,c:o.c||null})}

/* v21d: death crumble. The body breaks into shards that scatter and drift up on the wind (0.45-0.75 s), then curve into
   the player and flash on arrival. One fx item carries every shard; positions are worked out at draw time, so the shards
   home in on the player even while you move. Normal 22 shards, Elite 38, boss 70 (half on Low graphics). */
function crumbleFx(mo){
  const d=MON[mo.type],E=mo.elite,B=mo.boss,sz=mSize(mo),base=monCol(mo.type);
  const cols=[base,base,"#ffffff",E?"#ffd76a":B?"#bfe8ff":base],n=Math.round((B?70:E?38:22)*(S.gfx==="lo"?.5:1)),ps=[];

    s:2.6+Math.random()*3*Math.min(1.6,sz),rot:Math.random()*TAU,vr:(Math.random()-.5)*14,c:cols[i%cols.length],t1:.45+Math.random()*.3,fl:Math.random()*TAU,bend:(Math.random()-.5)*90});
  fx.push({k:"crumble",x:mo.x,y:mo.y,t:0,d:1.45,ps});
  AUD.sfx(E||B?"absorbbig":"absorb",.78);   // whoosh starts as the first shards turn, sparkle lands with the ring
  fx.push({k:"ring",follow:true,t:-.95,d:.35,c:E?"#ffd76a":B?"#bfe8ff":base,r:E||B?70:44});   // flash when the shards reach you

function killMon(mo){
  const d=MON[mo.type],E=mo.elite,B=mo.boss;AUD.sfx(B?"bossdown":"kill");mo.hp=0;mo.dieT=.45;mo.aggro=false;mo.path=[];mo.stun=0;mo.frz=0;mo.ptr=0;mo.brn=0;mo.gas=0;if(player.target===mo)player.target=null;

  const PR=ptRewards(),lvM=mLv(mo),kind=B?"boss":E?"elite":"normal";
  const be=(PR.shE?be0/PR.n:be0)*PR.mul,je=(PR.shE?je0/PR.n:je0)*PR.mul;

    if(Math.random()<PR.mul-1)dr.gear.push(rollDropGear(tierOf(lvM),kind));
  }

  for(const g of dr.gear){if(!lootOk(g.id)||!ptTake(PR.shI,gName(g.id)))continue;if(gainGear(g)){got++;L.gear.push(g);floatText(`+ ${gName(g.id)}`,itemColor(g.id))}}
  floatText(`+${num(be)} EXP`,"#ffd76a");if(sc)floatText(`+${num(sc)} Sc`,"#e9d89a");
  crumbleFx(mo);
  if(E)fx.push({k:"ring",x:mo.x,y:mo.y,t:0,d:.8,c:"#ffd76a",r:90});
  if(B){fx.push({k:"pillar",x:mo.x,y:mo.y,t:0,d:1.6,c:d.col||"#bfe8ff"});fx.push({k:"ring",x:mo.x,y:mo.y,t:0,d:1.1,c:"#ffffff",r:170});fx.push({k:"ring",x:mo.x,y:mo.y,t:-.2,d:1.1,c:"#9fd8ff",r:130});toast(t(d.downK||"boss_down"),true);pushChat({ch:"sys",k:d.sysK||"sys_boss"})}
  if(S.idle){const s=S.sess;s.kills++;s.base+=be;s.job+=S.jlv<jcap()?je:0;s.sc+=sc;s.mats+=got;s.items=s.items||{};for(const [id,q] of L.items)s.items[id]=(s.items[id]||0)+q;s.gear=(s.gear||0)+L.gear.length}

function placeDet(){

  det.dataset.placed="1";det.style.position="absolute";det.style.right="auto";det.style.transform="none";det.style.margin="0";
  const ww=wins.clientWidth,wh=wins.clientHeight,W=det.offsetWidth,H=det.offsetHeight;
  let minL=1e9,maxR=-1e9;for(const el of others){minL=Math.min(minL,el.offsetLeft);maxR=Math.max(maxR,el.offsetLeft+el.offsetWidth)}

    ${cell("lt_def",`${Math.round(d.hardDef*100)}% +${Math.round(d.softDef)}`)}${cell("lt_mdef",`${Math.round(d.mdef*100)}% +${Math.round(d.softMdef)}`)}
    ${cell("lt_hp",num(d.maxHP))}${cell("lt_sp",num(d.maxSP))}
    ${cell("lt_aspd",`${d.aspd} (${d.interval.toFixed(2)} ${t("lt_sec")})`)}${cell("lt_gd",(gdcut?"-":"")+gdcut+"%",gdcut?"":none)}
    ${cell("lt_flee",num(Math.round(d.flee)))}${cell("lt_pdodge",d.pdodge.toFixed(1)+"%")}
    ${cell("lt_hit",num(Math.round(d.hit)))}${cell("lt_phit","0%",none)}
    ${cell("lt_crit",d.crit.toFixed(1)+"%")}${cell("lt_critd","+40%")}
    ${cell("lt_over",(d.crit+(d.over||0)).toFixed(1)+"%",t("lt_tip_over"))}${cell("lt_overd","+30%")}
    ${cell("lt_vcast",(vcast?"-":"")+vcast+"%")}${cell("lt_fcast",(fcast?"-":"")+fcast+"%",fcast?"":none)}

}

function siLevel(id,n){   // what one level gives
  if(id===BASIC_T){const r=BASIC_ROWS[n-1];return `${t("bs_u_"+r)} · ${t("bs_d_"+r)}`}
  if(!REOC.SK[id])return REOC.SKLV[id]?pasEffAt(id,n):"";
  const k=REOC.SKLV[id]?REOC.skAt(id,n):REOC.SK[id],d=pd(),sp=Math.ceil(k.sp*d.spCost);
  if(id==="fire_bolt")return fmt("si_fb",{a:k.hits,b:Math.round(k.hits*k.ratio*100),c:sp,d:Math.round(k.stCh*100)});
  if(id==="freezer")return fmt("si_fz",{a:Math.round(k.ratio*100),b:Math.round(k.stCh*100),c:sp});
  if(id==="lightning_spear")return fmt("si_ls",{a:k.hits,b:Math.round(k.ratio*100),c:sp});
  if(id==="petrifaction")return fmt("si_pt",{a:Math.round(k.ratio*100),b:Math.round(k.stCh*100),c:sp});
  if(id==="overload_energy")return fmt("si_oe",{a:k.over,b:k.dur,c:sp});
  if(id==="focusing")return fmt("si_fo",{a:Math.round(k.focus*100),b:k.dur,c:sp});
  if(id==="aim_strike")return fmt("si_as",{a:k.split,b:Math.round(k.splitCh*100),c:Math.round(k.ratio*100),d:sp});
  if(id==="aiming_shower")return fmt("si_aw",{a:Math.round(k.ratio*100),c:sp});
  if(id==="timber")return fmt("si_tb",{a:Math.round(k.ratio*100),b:k.hitBonus,c:sp});
  if(id==="gaslighting")return fmt("si_gl",{a:Math.round(k.defD*100),b:Math.round(k.atkU*100),c:k.dur,d:sp});
  if(id==="forbear")return fmt("si_fbr",{a:k.dur,b:Math.round(k.mdef*100),c:sp});
  const rg=k.range||k.aoe?` · ${t("rangeLbl")} ${k.ranged?d.range:(k.range||k.aoe)}`:"";
  return `SP ${sp}${rg}`}

  const name=t(id===BASIC_T?"bs_title":"sk_"+id),desc=t(id===BASIC_T?(S.arch==="beginner"?"bs_desc":"bs_kept"):"skd_"+id);

  const lvls=pas&&mx<2&&id!==BASIC_T?[]:Array.from({length:mx},(_,i)=>i+1);

  return `<div class="si" style="--ac:${ARC_COL[a]};--ag:${SKG[a]}">

   <p class="si-desc">${desc}</p>${REOC.SKREQ[id]?`<p class="si-desc si-req${skReqOk(id,skLearned)?"":" no"}"><b>${t("skt_reqL")}</b> ${skReqTxt(id)}</p>`:""}${lvHtml?`<div class="si-lvs">${lvHtml}</div>`:""}${tb}</div>`};

function isClick(a,b){   // clicks inside the Idle Settings window
  const I=S.iset,k=b.dataset.k;
  if(a==="istab"){isTab=b.dataset.v;isPick=null}
  else if(a==="is"){
    if(k==="atk"&&I.atk&&!I.sk){AUD.sfx("err");toast(t("is_atk_need"));return}
    I[k]=!I[k];if(k==="sk"&&!I.sk)I.atk=true;
  }
  else if(a==="isv"){const v=b.dataset.v;I[k]=/^\d+$/.test(v)?+v:v}
  else if(a==="isarch"){const v=b.dataset.v,j=I.lArch.indexOf(v);if(j<0)I.lArch.push(v);else I.lArch.splice(j,1)}
  else if(a==="isslot"){const g=b.dataset.g;if(g==="mons"&&!isMap())return;isPick={g,i:+b.dataset.i,sel:null,lv:{}}}
  else if(a==="ispickx")isPick=null;
  else if(a==="ispicklv"){isPick.lv[b.dataset.id]=+b.dataset.v;isPick.sel=b.dataset.id}
  else if(a==="ispickclr"){if(isPick.g==="mons"){const m=isMap(),L=isMons(m);L[isPick.i]=null;I.mons[m]=L}else I[isPick.g][isPick.i]=null;isPick=null}
  else if(a==="ispick"){const v=b.dataset.v,p=isPick;
    if(p.sel!==v){p.sel=v}
    else{if(p.g==="mons"){const m=isMap(),L=isMons(m);L[p.i]=v;I.mons[m]=L}
      else if(p.g==="items")I.items[p.i]=v;
      else{const L=skLvOf(v),max=REOC.SKLV[v]?L:0;I[p.g][p.i]={id:v,lv:max?Math.min(max,p.lv[v]||max):0}}
      isPick=null;AUD.sfx("click")}
  }
  renderWin();save();
}

  if((S.invPacks|0)>=20){toast(t("pack_max"));return}

/* ================= drag and drop (v20.5) =================
   An item or skill is dragged from the bag, the Skills window or a worn slot and dropped on a hotkey slot. A hotkey slot can be moved (drop on another slot) or cleared (drop outside any zone); the bag, the Skills list and the worn piece are never changed by a drop that is refused. Drop zones carry data-drop; a future trade or sell zone adds its entry to DROP_ZONES. */
const DROP_ZONES={hot:{check:src=>hotCheck(src),drop:(src,el)=>hotDrop(src,+el.dataset.i)}};
const DND={p:null,pid:0,sx:0,sy:0,x:0,y:0,on:false,moved:false,hold:false,ghost:null,zone:null,timer:0,endT:-1e9};
const skIcon=id=>`<span class="ic" style="--c:${skGrad(id)}">${skSvg(id)}</span>`;   // v20.10: every skill (passives too) has its own icon in its archetype colour
function dndSource(k){   // what a drag carries: "i:"/"g:" bag entry, "e:" worn slot, "s:" skill, "h:" hotkey slot
  const p=k.slice(2);
  if(k[0]==="i"||k[0]==="g"){const e=invFind(k);return e?{k,cat:e.cat,id:e.id,html:`<span class="ii-ic">${itemArt(e.id)}</span>`}:null}
  if(k[0]==="e"){const it=S.equip[p];return it?{k,cat:"gear",id:it.id,html:`<span class="ii-ic">${itemArt(it.id)}</span>`}:null}
  if(k[0]==="s"){const [id,lv]=p.split(":");return {k,cat:"skill",id,lv:+lv||0,html:skIcon(id)}}   // "s:id:lv" (v20.10: lv = the level picked in the Skills Tree, 0 = highest learned). A passive too: hotCheck refuses it, so the player is told why
  if(k[0]==="h"){const sl=SLOTS[+p];if(!sl||!sl.id)return null;return sl.item?{k,cat:"use",id:sl.item,html:`<span class="ic" style="--c:${sl.c}">${itemArt(sl.item)}</span>`}:{k,cat:"skill",id:sl.id,html:skIcon(sl.id)}}
  return null;
}
function hotCheck(src){   // can this drag go on a hotkey slot? {ok} or {ok:false,msg}
  if(src[0]==="h")return {ok:true};
  const s=dndSource(src);
  if(!s)return {ok:false,msg:t("dnd_item_no")};
  if(s.cat==="skill")return actList().includes(s.id)?{ok:true}:{ok:false,msg:t("dnd_skill_no")};
  return s.cat==="use"?{ok:true}:{ok:false,msg:t("dnd_item_no")};   // gear, worn pieces, materials, quest and cash items
}
function hotDrop(src,i){
  const c=hotCheck(src);if(!c.ok){AUD.sfx("err");toast(c.msg);return false}
  if(src[0]==="h"){const from=+src.slice(2);if(from!==i){const a=S.hot[from];S.hot[from]=S.hot[i];S.hot[i]=a}}   // move, or swap with what is there
  else{const s=dndSource(src);S.hot[i]=s.cat==="skill"?{id:s.id,lv:s.lv||0}:{item:s.id}}
  AUD.sfx("click");buildSlots();renderWin();save();return true;
}
function hotClear(i){if(!S.hot[i])return;S.hot[i]=null;buildSlots();renderWin();save()}
function dndDrop(src,x,y){
  const z=document.elementFromPoint(x,y),el=z&&z.closest?z.closest("[data-drop]"):null,zone=el&&DROP_ZONES[el.dataset.drop];
  if(zone)return zone.drop(src,el);
  if(src[0]==="h"){hotClear(+src.slice(2));return true}   // dropped outside: only the hotkey slot is cleared, the item or skill is kept
  return false;   // dropped outside: nothing happens, the item stays where it was
}
function dndBegin(){
  if(!DND.p||DND.on)return;
  const s=dndSource(DND.p);if(!s){dndReset();return}
  DND.on=true;lpCancel();
  const g=document.createElement("div");g.className="dnd-ghost";g.innerHTML=s.html;g.style.left=DND.x+"px";g.style.top=DND.y+"px";
  document.body.appendChild(g);DND.ghost=g;document.body.classList.add("dnd-on");
}
function dndMove(x,y){
  DND.x=x;DND.y=y;
  if(Math.hypot(x-DND.sx,y-DND.sy)>6)DND.moved=true;
  DND.ghost.style.left=x+"px";DND.ghost.style.top=y+"px";
  const z=document.elementFromPoint(x,y),el=z&&z.closest?z.closest("[data-drop]"):null;
  if(DND.zone&&DND.zone!==el)DND.zone.classList.remove("dnd-ok","dnd-no");
  DND.zone=el;
  const zone=el&&DROP_ZONES[el.dataset.drop];
  if(zone){const ok=zone.check(DND.p).ok;el.classList.toggle("dnd-ok",ok);el.classList.toggle("dnd-no",!ok)}
}
function dndReset(){
  clearTimeout(DND.timer);if(DND.ghost)DND.ghost.remove();
  if(DND.zone)DND.zone.classList.remove("dnd-ok","dnd-no");
  document.body.classList.remove("dnd-on");
  Object.assign(DND,{p:null,on:false,moved:false,hold:false,ghost:null,zone:null,timer:0});
}
function dndStart(e,el){   // pointerdown on a draggable. Mouse and pen: a drag starts after 6 px. Touch on a Skills tile: after a 230 ms hold, so the window still scrolls
  if(e.button>0||DND.on)return;dndReset();
  if(el.classList.contains("row")&&e.target.closest("button,select,input"))return;   // the + button and the selects are not drag handles
  DND.p=el.dataset.dnd;DND.pid=e.pointerId;DND.sx=DND.x=e.clientX;DND.sy=DND.y=e.clientY;
  DND.hold=(el.classList.contains("row")||el.classList.contains("sk-tile"))&&e.pointerType==="touch";
  if(DND.hold)DND.timer=setTimeout(()=>{DND.timer=0;dndBegin()},230);
}
addEventListener("pointermove",e=>{
  if(!DND.p||e.pointerId!==DND.pid)return;
  if(DND.on){dndMove(e.clientX,e.clientY);return}
  const d=Math.hypot(e.clientX-DND.sx,e.clientY-DND.sy);
  if(DND.hold){if(d>10)dndReset();return}   // moving before the hold ends means scrolling
  if(d>6){dndBegin();if(DND.on)dndMove(e.clientX,e.clientY)}
});
addEventListener("pointerup",e=>{
  if(!DND.p||e.pointerId!==DND.pid)return;
  if(DND.on&&DND.moved){const src=DND.p,x=e.clientX,y=e.clientY;DND.endT=performance.now();dndReset();dndDrop(src,x,y);return}
  dndReset();   // a plain tap or press: the click goes through as before
});
addEventListener("pointercancel",e=>{if(DND.p&&e.pointerId===DND.pid)dndReset()});

document.addEventListener("click",e=>{if(performance.now()-DND.endT<400){e.stopPropagation();e.preventDefault()}},true);   // the click that ends a drag does nothing
