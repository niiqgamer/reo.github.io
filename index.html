/* ---------- derived stats (substats) ---------- */
function derive(p){
  const A=ARCH[p.arch]||ARCH.beginner,b=p.buffs||{},s={};
  for(const k of STATS)s[k]=Math.max(1,(p.stats&&p.stats[k])||1);
  if(b.blessing){s.str+=8;s.int+=8;s.dex+=8}
  const has=k=>A.passives.includes(k);
  const ranged=A.weapon.ranged;
  // iRO: melee status ATK = STR + [STR/10]^2 + [DEX/5] + [LUK/5]; ranged swaps STR and DEX
  const statusAtk=ranged? s.dex+fl(s.dex/10)**2+fl(s.str/5)+fl(s.luk/5) : s.str+fl(s.str/10)**2+fl(s.dex/5)+fl(s.luk/5);
  const watk=Math.round(A.weapon.atk+A.weapon.lvAtk*(p.lv-1));   // REO: weapon ATK grows with level to stand in for gear upgrades
  const mastery=has("weapon_mastery")?PASSIVE.weapon_mastery.atk:0;
  const mm=1+(A.weapon.matkPct||0);
  // iRO: MATK min = INT + [INT/7]^2 ; max = INT + [INT/5]^2
  const matkMin=fl((s.int+fl(s.int/7)**2)*mm),matkMax=fl((s.int+fl(s.int/5)**2)*mm);
  const baseHP=300+A.hpLv*(p.lv-1),baseSP=80+A.spLv*(p.lv-1);
  // iRO: Max HP +1% per VIT ; Max SP +1% per INT
  const maxHP=fl(baseHP*(1+s.vit/100)*(has("iron_body")?1+PASSIVE.iron_body.hpPct:1));
  const maxSP=fl(baseSP*(1+s.int/100));
  // iRO: HIT = DEX + BaseLv ; FLEE = AGI + BaseLv ; CRIT = 1 + LUK*0.3 ; perfect dodge = 1 + LUK*0.1
  const hit=s.dex+p.lv+(has("weapon_mastery")?PASSIVE.weapon_mastery.hit:0)+(has("eagle_eye")?PASSIVE.eagle_eye.hit:0);
  const flee=s.agi+p.lv+(b.leap?30:0);
  const crit=1+s.luk*.3+(has("steady_aim")?PASSIVE.steady_aim.crit:0);
  const pdodge=1+s.luk*.1;
  // iRO: each AGI -0.4% and each DEX -0.1% of the base attack delay ; cap 5 hits/s (ASPD 190)
  const interval=Math.max(.2,A.aspd*(1-s.agi*.004-s.dex*.001));
  const aspd=Math.round(200-50*interval);
  // iRO: soft DEF ~0.8 per VIT (flat) ; hard DEF from armor (%)
  const softDef=fl(fl(s.vit*.8)*(has("iron_body")?PASSIVE.iron_body.softDefMul:1));
  const hardDef=Math.min(.7,A.armor+(b.warCry?.20:0)+(b.guard?.30:0)+(has("guardian_aura")?PASSIVE.guardian_aura.def:0));
  const mdef=Math.min(.6,.05+(has("guardian_aura")?PASSIVE.guardian_aura.mdef:0));
  const softMdef=fl(s.int/2);   // REO: half of classic's ~1 per INT
  // iRO: cast time x (1 - DEX/150)
  const castMul=Math.max(0,1-s.dex/150);
  const range=A.range+(has("eagle_eye")?PASSIVE.eagle_eye.range:0);
  // iRO natural regen (per tick) adapted to per-second: HP = MaxHP/200 + VIT/5 ; SP = MaxSP/100 + INT/6 + 1
  const hpRegen=(maxHP/200+s.vit/5)/4;
  const spRegen=(maxSP/100+s.int/6+1)/2*(has("mana_flow")?PASSIVE.mana_flow.spRegen:1);
  const d={arch:p.arch,type:A.type,lv:p.lv,s,ranged,statusAtk,watk,mastery,matkMin,matkMax,maxHP,maxSP,hit,flee,crit,pdodge,interval,aspd,softDef,hardDef,mdef,softMdef,castMul,range,hpRegen,spRegen,
    attune:has("elemental_attunement"),perTile:has("steady_aim")?PASSIVE.steady_aim.perTile:0,spCost:has("mana_flow")?PASSIVE.mana_flow.spCost:1,
    healMul:1+(has("divine_grace")?PASSIVE.divine_grace.healPct:0),shieldCap:has("divine_grace")?PASSIVE.divine_grace.shieldCap:0,healRange:A.healRange||A.range};
  // gear: flat bonuses from equipped items (weapon ATK, DEF, HP, ...)
  const G=p.gear||{};
  d.watk+=G.atk||0;d.softDef+=G.def||0;d.hardDef=Math.min(.7,d.hardDef+(G.hardDef||0));d.maxHP+=G.hp||0;d.maxSP+=G.sp||0;d.hit+=G.hit||0;d.crit+=G.crit||0;d.flee+=G.flee||0;
  // percentage bonuses (set bonuses and affixes)
  d.statusAtk*=(1+(G.atkPct||0));d.watk*=(1+(G.atkPct||0));d.softDef*=(1+(G.defPct||0));d.maxHP=Math.floor(d.maxHP*(1+(G.hpPct||0)));d.matkMin*=(1+(G.matkPct||0));d.matkMax*=(1+(G.matkPct||0));d.healMul+=(G.healPct||0);
  if(G.atkPct||G.defPct||G.matkPct){d.statusAtk=Math.round(d.statusAtk);d.watk=Math.round(d.watk);d.softDef=Math.round(d.softDef);d.matkMin=Math.round(d.matkMin);d.matkMax=Math.round(d.matkMax)}
  return d;
}

function eliteOf(m){return Object.assign({},m,{lv:m.lv+2,hp:m.hp*5,atk:m.atk*1.6,softDef:m.softDef+3,elite:true})}

/* ---------- damage ---------- */
function rngOf(seed){let a=seed>>>0;return ()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
// physical: (status ATK + weapon roll + mastery) x ratio x element x bonus ; then x(1 - hard DEF) - soft DEF
function physHit(d,m,o,r){
  o=o||{};
  const em=elemMult(o.elem||"neutral",m.elem,d.attune),bonus=(o.bonus||1)*(1+(o.dist&&d.perTile?Math.min(.18,Math.max(0,o.dist-3)*d.perTile):0));
  const critPct=(o.canCrit===false)?0:Math.max(0,d.crit*(o.critMul||1)-(m.luk||0)/5);
  if(r()*100<critPct){ // iRO: crit = max weapon roll, ignores DEF and FLEE. REO: x1.4
    return {dmg:Math.max(1,fl((d.statusAtk+d.watk+d.mastery)*o.ratio*em*bonus*1.4)),crit:true};
  }
  const hitPct=clamp(80+d.hit+(o.hitBonus||0)-m.flee,5,95);   // iRO: 80 + HIT - FLEE, 5..95
  if(r()*100>=hitPct)return {dmg:0,miss:true};
  const lo=Math.min(1,.5+d.s.dex*.005);                        // DEX narrows the weapon roll
  const w=d.watk*(lo+(1-lo)*r());
  const raw=(d.statusAtk+w+d.mastery)*o.ratio*em*bonus;
  const hd=m.hardDef*(1-(o.ignoreDef||0));
  return {dmg:Math.max(1,fl(raw*(1-hd)-m.softDef))};
}
// magic: MATK roll x ratio x element ; then x(1 - MDEF) - soft MDEF ; never misses
function magicHit(d,m,o,r){
  const matk=d.matkMin+(d.matkMax-d.matkMin)*r();
  const em=elemMult(o.elem||"neutral",m.elem,d.attune);
  return {dmg:Math.max(1,fl(matk*o.ratio*em*(o.bonus||1)*(1-m.mdef)-m.softMdef)),weak:em>1};
}
// iRO Heal: [(BaseLv + INT) / 8] x (4 + 8 x SkillLv)
function healAmount(d,sk){if(sk.flat)return fl(sk.flat*d.healMul);return fl(fl((d.lv+d.s.int)/8)*(4+8*(sk.lvl||5))*d.healMul)}
function monHit(m,d,r,shielded){
  if(r()*100<d.pdodge)return {dmg:0,miss:true,lucky:true};
  const hitPct=clamp(80+m.hit-d.flee,5,95);
  if(r()*100>=hitPct)return {dmg:0,miss:true};
  return {dmg:Math.max(1,fl(m.atk*(.85+.3*r())*(1-d.hardDef)-d.softDef))};
}

/* ---------- auto stat build ---------- */
function autoStats(arch,lv,base){
  const A=ARCH[arch]||ARCH.beginner,s=Object.assign({str:1,agi:1,vit:1,int:1,dex:1,luk:1},base||{});
  let pts=statPointsTotal(lv)-spent(s);
  const w=A.tpl,tot=STATS.reduce((a,k)=>a+(w[k]||0),0)||1;
  for(let guard=0;guard<2000;guard++){
    let best=null,bv=Infinity;
    for(const k of STATS){if(!w[k]||s[k]>=99)continue;const c=raiseCost(s[k]);if(c>pts)continue;
      const v=(s[k]-1)/(w[k]/tot);if(v<bv){bv=v;best=k}}
    if(!best)break;pts-=raiseCost(s[best]);s[best]++;
  }
  return s;
}

/* ---------- skill AI (used by idle play and by the simulator) ----------
 ctx: {d, hp, sp, cd{}, momentum, buffs{}, dist (to target), near (# targets within 2.5), tgtElem, inZone} */
function pickSkill(ctx){
  const d=ctx.d,A=ARCH[d.arch],ready=id=>{const k=SK[id];return k&&!(ctx.cd[id]>0)&&ctx.sp>=k.sp*d.spCost};
  const reserve=ctx.sp>d.maxSP*.2;
  const hpPct=ctx.hp/d.maxHP;
  switch(d.arch){
   case "beginner":
    if(hpPct<.5&&ready("first_aid"))return "first_aid";
    if(reserve&&ready("bash")&&ctx.dist<=SK.bash.range)return "bash";return null;
   case "fighter":
    if(hpPct<.6&&!ctx.buffs.warCry&&ready("war_cry"))return "war_cry";
    if(ctx.dist>SK.power_strike.range)return null;
    if(ctx.momentum>=4&&ready("crushing_blow"))return "crushing_blow";
    if(ctx.near>=2&&ready("cleave"))return "cleave";
    if(reserve&&ready("power_strike"))return "power_strike";return null;
   case "ranger":
    if(ctx.dist<=1.6&&ready("evasive_leap"))return "evasive_leap";
    if(ctx.dist>d.range)return null;
    if(ready("piercing_shot"))return "piercing_shot";
    if(ctx.near>=2&&ready("arrow_shower"))return "arrow_shower";
    if(reserve&&ready("double_strafe"))return "double_strafe";return null;
   case "spellcaster":{
    if(ctx.near>=2&&ctx.dist<=SK.frost_nova.aoe&&ready("frost_nova"))return "frost_nova";
    if(ctx.dist>d.range)return null;
    const spells=["lightning_spear","stone_spike","fire_bolt"].filter(ready);
    if(!spells.length)return null;
    // prefer the spell the target is weak to, then the biggest hitter
    let best=null,bv=-1;
    for(const id of spells){const k=SK[id];const v=k.ratio*(k.hits||1)*elemMult(k.elem,ctx.tgtElem,d.attune)/(k.cast||1);if(v>bv){bv=v;best=id}}
    if(!reserve&&elemMult(SK[best].elem,ctx.tgtElem,d.attune)<=1)return null;
    return best;}
   case "supporter":
    if(hpPct<.55&&ready("heal"))return "heal";
    if(!ctx.buffs.blessing&&ready("blessing"))return "blessing";
    if(ctx.dist<=d.range&&!ctx.inZone&&ctx.engaged&&ready("sanctuary"))return "sanctuary";
    if(ctx.dist<=SK.holy_light.range&&reserve&&ready("holy_light"))return "holy_light";
    return null;
  }
  return null;
}

/* ---------- simulator ----------
 Fights packs of `pack` monsters for `secs` seconds. Monsters are passive until hit, then chase at 1.6x speed.
 Returns kills, deaths, damage dealt/taken, average HP left. Used by tests and offline-idle estimates. */
function simulate(arch,lv,monKeys,opt){
  opt=opt||{};const r=rngOf(opt.seed||7),secs=opt.secs||300,pack=opt.pack||1,dt=.05,travel=opt.travel??4;
  const stats=opt.stats||autoStats(arch,lv);
  const buffs={},cd={};let zone=0,shield=0,momentum=0,momT=0;
  let d=derive({arch,lv,stats,buffs,gear:opt.gear});
  let hp=d.maxHP,sp=d.maxSP,t=0,kills=0,deaths=0,dealt=0,taken=0,hpSum=0,hpN=0,casting=null,swing=0,mi=0,wait=0;
  let mobs=[];
  const spawn=()=>{const key=monKeys[mi++%monKeys.length];const m=Object.assign({},opt.elite?eliteOf(MONC[key]):MONC[key]);
    mobs=[];for(let i=0;i<pack;i++)mobs.push(Object.assign({},m,{key,hpNow:m.hp,dist:d.type==="MELEE"?2.2:Math.min(d.range,8),aggro:false,atkCd:0,stun:0}))};
  spawn();
  const tgt=()=>mobs.find(m=>m.hpNow>0);
  const hitMob=(m,res)=>{if(res.miss)return;m.hpNow-=res.dmg;dealt+=res.dmg;if(pack>1)mobs.forEach(x=>x.aggro=true);else m.aggro=true};
  const doBasic=m=>{const b=ARCH[arch].basic;
    if(b.kind==="phys"){const res=physHit(d,m,{ratio:b.ratio,dist:d.ranged?m.dist:0},r);hitMob(m,res);if(arch==="fighter"&&!res.miss){momentum=Math.min(5,momentum+1);momT=5}}
    else hitMob(m,magicHit(d,m,{ratio:b.ratio,elem:b.elem},r))};
  const doSkill=(id,m)=>{const k=SK[id];sp-=k.sp*d.spCost;cd[id]=k.cd;
    const targets=k.aoe?mobs.filter(x=>x.hpNow>0&&(k.at==="self"?x.dist<=k.aoe:true)):(m?[m]:[]);
    if(k.kind==="phys"){for(const x of targets)for(let h=0;h<(k.hits||1);h++){
        const ratio=k.ratio+(k.spend?k.perStack*momentum:0);
        const res=physHit(d,x,{ratio,ignoreDef:k.ignoreDef,canCrit:!!k.canCrit,critMul:k.critMul,dist:k.ranged?x.dist:0,bonus:buffs.leapShot?1.6:1},r);hitMob(x,res)}
      if(buffs.leapShot&&k.ranged)buffs.leapShot=0;
      if(k.momentum)momentum=Math.min(5,momentum+k.momentum),momT=5;
      if(k.spend){if(momentum>=k.stunAt&&m)m.stun=k.stun;momentum=0}}
    else if(k.kind==="magic"){for(const x of targets)for(let h=0;h<(k.hits||1);h++)hitMob(x,magicHit(d,x,{ratio:k.ratio,elem:k.elem},r));
      if(k.freeze)for(const x of targets)if(r()<k.freeze)x.stun=Math.max(x.stun,k.freezeDur);
      if(k.stunChance&&m&&r()<k.stunChance)m.stun=Math.max(m.stun,k.stun)}
    else if(k.kind==="heal"){const h=healAmount(d,k),over=Math.max(0,hp+h-d.maxHP);hp=Math.min(d.maxHP,hp+h);if(d.shieldCap)shield=Math.min(d.maxHP*d.shieldCap,shield+over)}
    else if(k.kind==="buff"){buffs[k.buff]=k.dur;if(k.buff==="blessing")d=derive({arch,lv,stats,buffs,gear:opt.gear});
      if(k.taunt)mobs.forEach(x=>x.aggro=true)}
    else if(k.kind==="move"){for(const x of mobs)x.dist+=k.leap;buffs.leap=k.dur;buffs.leapShot=1;d=derive({arch,lv,stats,buffs,gear:opt.gear})}
    else if(k.kind==="zone"){zone=k.dur}};
  while(t<secs){
    t+=dt;
    for(const k in cd)cd[k]=Math.max(0,cd[k]-dt);
    for(const k of Object.keys(buffs)){if(k==="leapShot")continue;buffs[k]-=dt;if(buffs[k]<=0){delete buffs[k];d=derive({arch,lv,stats,buffs,gear:opt.gear})}}
    if(momT>0){momT-=dt;if(momT<=0)momentum=0}
    sp=Math.min(d.maxSP,sp+d.spRegen*dt);
    if(wait>0){wait-=dt;hp=Math.min(d.maxHP,hp+(d.hpRegen+d.maxHP*.015)*dt);if(wait<=0)spawn();continue}
    const m=tgt();
    if(!m){kills+=pack;hpSum+=hp/d.maxHP;hpN++;wait=travel;casting=null;if(wait<=0)spawn();continue}
    // zone ticks
    if(zone>0){zone-=dt;hp=Math.min(d.maxHP,hp+d.maxHP*SK.sanctuary.healPct*dt);
      const zd=(d.matkMin+d.matkMax)/2*SK.sanctuary.ratio*dt;
      for(const x of mobs)if(x.hpNow>0&&x.dist<=SK.sanctuary.radius+1){const z=zd*(1-x.mdef);x.hpNow-=z;dealt+=z;x.aggro=true}}
    // monsters
    for(const x of mobs){if(x.hpNow<=0||!x.aggro)continue;if(x.stun>0){x.stun-=dt;continue}
      if(x.dist>1.2){x.dist=Math.max(1.2,x.dist-x.speed*1.6*dt);continue}
      x.atkCd-=dt;if(x.atkCd<=0){x.atkCd=x.aspd;const res=monHit(x,d,r);if(!res.miss){let dmg=res.dmg;if(shield>0){const a=Math.min(shield,dmg);shield-=a;dmg-=a}hp-=dmg;taken+=dmg}}}
    if(hp<=0){deaths++;hp=d.maxHP;sp=d.maxSP;momentum=0;shield=0;zone=0;wait=20;casting=null;spawn();continue}
    // player
    if(d.type==="MELEE"&&m.dist>d.range){m.dist=Math.max(d.range,m.dist-3.6*dt);continue}
    if(casting){casting.t-=dt;if(casting.t<=0){const c=casting;casting=null;doSkill(c.id,tgt())}continue}
    swing-=dt;
    const near=mobs.filter(x=>x.hpNow>0&&x.dist<=2.5).length;
    const ctx={d,hp,sp,cd,momentum,buffs,dist:m.dist,near:pack>1?mobs.filter(x=>x.hpNow>0).length:1,tgtElem:m.elem,inZone:zone>0,engaged:m.aggro};
    const id=pickSkill(ctx);
    if(id){const k=SK[id];if(k.cast){casting={id,t:k.cast*d.castMul};continue}doSkill(id,m);continue}
    if(swing<=0&&m.dist<=d.range){swing=d.interval;doBasic(m)}
  }
  return {arch,lv,kills,deaths,dealt:Math.round(dealt),taken:Math.round(taken),dps:+(dealt/secs).toFixed(1),hpLeft:hpN?+(hpSum/hpN).toFixed(2):0,maxHP:d.maxHP,stats};
}

/* idle estimate: kills per hour on a map, using the simulator once and caching by inputs */
const _cache=new Map();
function killsPerHour(arch,lv,stats,monKeys,gear){
  const key=arch+"|"+lv+"|"+JSON.stringify(stats)+"|"+JSON.stringify(gear||{})+"|"+monKeys.join(",");
  if(_cache.has(key))return _cache.get(key);
  const res=simulate(arch,lv,monKeys,{stats,secs:600,seed:11,gear});
  const v={kph:Math.round(res.kills*6),deathsPerHour:res.deaths*6,dps:res.dps};
  _cache.set(key,v);return v;
}
/* Combat Power: offense = DPS from a short simulation that uses the archetype's skills against a reference mix
   of all field monsters; defense = effective HP. Same scale for every archetype. */
const CP_REF=["lumite","crawlix","oculoth","nebulite","shardback","cryoculus"];
const _cpc=new Map();
function combatPower(arch,lv,stats,gear){
  const key=arch+"|"+lv+"|"+JSON.stringify(stats)+"|"+JSON.stringify(gear||{});if(_cpc.has(key))return _cpc.get(key);
  const d=derive({arch,lv,stats,gear});
  const sim=simulate(arch,lv,CP_REF,{stats,secs:180,seed:3,travel:0,gear});
  const ehp=d.maxHP/(1-d.hardDef)+d.softDef*30;
  const v=Math.round(sim.dps*6+ehp/20);_cpc.set(key,v);return v;
}
return {STATS,statPointsTotal,raiseCost,costTo,spent,elemMult,ARCH,SK,PASSIVE,derive,MONC,eliteOf,rngOf,physHit,magicHit,healAmount,monHit,autoStats,pickSkill,simulate,killsPerHour,combatPower};
})();

D2.en.helper_i0="Hello, traveler. I help Beginners find their path. Every adventurer eventually chooses one Archetype — a way of fighting that shapes everything after.";D2.th.helper_i0="สวัสดีนักเดินทาง ข้ามีหน้าที่ช่วย Beginner หาเส้นทางของตัวเอง นักผจญภัยทุกคนจะต้องเลือกอาร์คีไทป์หนึ่งสาย ซึ่งเป็นวิธีต่อสู้ที่กำหนดทุกอย่างหลังจากนี้";

/* ================= Audio (v18): 8-bit chip music for every map + sound effects, all synthesized (no files) ================= */
const AUD=(()=>{
  let ctx=null,master=null,musG=null,sfxG=null,noiseB=null,track=null,trackName="",step=0,nextT=0,pendingMap=null,bossOn=false;
  const stats={notes:0,sfx:0,tracks:0},last={},PW={};
  const hz=n=>440*Math.pow(2,(n-69)/12);
  const rng=seed=>{let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}};
  const TR={   // root = MIDI note, scale = semitone steps, prog = chord degree per bar
    town:{bpm:112,root:60,scale:[0,2,4,6,7,9,11],prog:[0,3,1,4],lead:"p25",arpOct:12,drums:"light",bass:"walk",seed:11,dens:.8},        // bright, strange (lydian)
    field1:{bpm:92,root:62,scale:[0,2,3,5,7,9,10],prog:[0,5,3,4],lead:"p25",arpOct:12,drums:"soft",bass:"walk",seed:23,dens:.65},     // calm and curious (dorian)
    field2:{bpm:80,root:57,scale:[0,1,3,5,7,8,10],prog:[0,1,0,6],lead:"p125",arpOct:12,drums:"soft",bass:"long",seed:37,dens:.55},    // dusk (phrygian)
    field3:{bpm:72,root:64,scale:[0,2,4,6,8,10],prog:[0,2,1,3],lead:"triangle",arpOct:24,drums:"none",bass:"long",seed:41,dens:.5},   // icy, sparkling (whole tone)
    geo:{bpm:76,root:52,scale:[0,2,3,5,7,8,11],prog:[0,5,2,6],lead:"p125",arpOct:12,drums:"soft",bass:"long",seed:67,dens:.5},          // ancient, heavy (harmonic minor)
    ruins:{bpm:104,root:55,scale:[0,1,4,5,7,8,11],prog:[0,1,5,4],lead:"square",arpOct:12,drums:"drive",bass:"pulse",seed:79,dens:.8},     // scorched, driving (double harmonic)
    boss:{bpm:152,root:54,scale:[0,2,3,5,7,8,11],prog:[0,5,6,4],lead:"square",arpOct:12,drums:"drive",bass:"pulse",seed:53,dens:.9}   // tense
  };
  const MAPTRACK={town:"town",field1:"field1",field2:"field2",field3:"field3",geo:"geo",ruins:"ruins"};
  function deg(sp,d){const L=sp.scale.length;return sp.root+sp.scale[((d%L)+L)%L]+12*Math.floor(d/L)}
  function makeTrack(sp){
    const R=rng(sp.seed),steps=[];for(let i=0;i<64;i++)steps.push({});
    let ld=4;   // melody position (scale degree)
    for(let b=0;b<4;b++){
      const r=sp.prog[b],ch=[r,r+2,r+4],o=b*16;
      // bass
      if(sp.bass==="pulse")for(let i=0;i<16;i+=2)steps[o+i].bass=deg(sp,r)-24+(i%8===6?7:0);
      else if(sp.bass==="long"){steps[o].bass=deg(sp,r)-24;steps[o+8].bass=deg(sp,r+4)-24}
      else{steps[o].bass=deg(sp,r)-24;steps[o+6].bass=deg(sp,r)-24;steps[o+8].bass=deg(sp,r+4)-24;steps[o+14].bass=deg(sp,r+2)-24}
      // arpeggio (8th notes)
      for(let i=0;i<8;i++){const pat=[0,1,2,1][i%4];steps[o+i*2].arp=deg(sp,ch[pat])+sp.arpOct}
      // melody: random walk over the scale, longer notes on the last bar
      let s=0;while(s<16){
        if(R()>sp.dens){s+=2;continue}
        const len=[2,2,4,2,3,1,4][(R()*7)|0];ld+=[-2,-1,-1,0,1,1,2][(R()*7)|0];ld=Math.max(0,Math.min(11,ld));
        const strong=s%8===0?ch[(R()*3)|0]+7:ld;steps[o+s].lead=[deg(sp,s%8===0?strong:ld)+12,Math.min(len,16-s)];s+=len;
      }
      if(b===3)steps[o+12].lead=[deg(sp,0)+12,4];
      // drums
      const d=sp.drums;
      for(let i=0;i<16;i++){
        if(d==="light"){if(i===0||i===8)steps[o+i].kick=1;if(i%4===2)steps[o+i].hat=1}
        else if(d==="soft"){if(i===0||(i===8&&b%2))steps[o+i].kick=1;if(i===12)steps[o+i].snare=.5;if(i%4===2)steps[o+i].hat=.6}
        else if(d==="drive"){if([0,3,6,8,10,12].includes(i))steps[o+i].kick=1;if(i===4||i===12)steps[o+i].snare=1;if(i%2===0)steps[o+i].hat=1}
      }
    }
    return steps;
  }
  function pw(d){if(PW[d])return PW[d];const n=32,re=new Float32Array(n),im=new Float32Array(n);for(let k=1;k<n;k++)re[k]=2/(k*Math.PI)*Math.sin(k*Math.PI*d);return PW[d]=ctx.createPeriodicWave(re,im)}
  function tone(t0,f,dur,type,vol,dest,slide){
    const o=ctx.createOscillator(),g=ctx.createGain();
    if(type==="p25")o.setPeriodicWave(pw(.25));else if(type==="p125")o.setPeriodicWave(pw(.125));else o.type=type;
    o.frequency.setValueAtTime(f,t0);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,slide),t0+dur);
    g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(Math.max(.0002,vol),t0+.008);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
    o.connect(g);g.connect(dest);o.start(t0);o.stop(t0+dur+.03);stats.notes++;
  }
  function noise(t0,dur,vol,hp,dest){
    const s=ctx.createBufferSource();s.buffer=noiseB;const f=ctx.createBiquadFilter();f.type="highpass";f.frequency.value=hp;
    const g=ctx.createGain();g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);s.connect(f);f.connect(g);g.connect(dest);s.start(t0);s.stop(t0+dur+.03);stats.notes++;
  }
  function playStep(st,t0,sp,sd){
    if(st.lead)tone(t0,hz(st.lead[0]),st.lead[1]*sd*.95,sp.lead,.2,musG);
    if(st.arp)tone(t0,hz(st.arp),sd*1.4,"p125",.075,musG);
    if(st.bass)tone(t0,hz(st.bass),sd*(sp.bass==="long"?6:1.6),"triangle",.3,musG);
    if(st.kick)tone(t0,150,.1,"sine",.42,musG,45);
    if(st.snare)noise(t0,.09,.18*st.snare,1500,musG);
    if(st.hat)noise(t0,.035,.07*st.hat,7000,musG);
  }
  function sched(){
    if(!ctx||!track||document.hidden)return;
    if(!S.music){nextT=ctx.currentTime+.1;return}
    const sp=TR[trackName],sd=60/sp.bpm/4;
    if(nextT<ctx.currentTime-.3)nextT=ctx.currentTime+.05;
    while(nextT<ctx.currentTime+.18){playStep(track[step%64],nextT,sp,sd);nextT+=sd;step++}
  }
  function ensure(){
    if(ctx){if(ctx.state==="suspended")ctx.resume();return}
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    try{
      ctx=new AC();master=ctx.createGain();master.gain.value=.55;master.connect(ctx.destination);
      musG=ctx.createGain();musG.gain.value=.16;musG.connect(master);sfxG=ctx.createGain();sfxG.gain.value=.5;sfxG.connect(master);
      const n=ctx.sampleRate*.5;noiseB=ctx.createBuffer(1,n,ctx.sampleRate);const d=noiseB.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
      setInterval(sched,30);
      if(pendingMap)setMap(pendingMap);
    }catch(e){ctx=null}
  }
  function play(name){
    if(name===trackName&&track)return;
    trackName=name;track=makeTrack(TR[name]);step=0;stats.tracks++;
    if(ctx){const t0=ctx.currentTime;musG.gain.cancelScheduledValues(t0);musG.gain.setValueAtTime(.02,t0);musG.gain.linearRampToValueAtTime(.16,t0+.8);nextT=t0+.08}
  }
  function setMap(id){pendingMap=id;if(!ctx)return;play(bossOn&&id==="field3"?"boss":(MAPTRACK[id]||"field1"))}
  function setBoss(b){if(b===bossOn)return;bossOn=b;if(pendingMap==="field3"&&ctx)play(b?"boss":"field3")}
  /* ---- sound effects ---- */
  const SFX={

const TW=64,TH=32,HW=32,HH=16,N=49;
/* Lite mode: phones and low-memory devices get a smaller ground texture and keep only one map in memory */
const LITE=(()=>{try{const sm=Math.min(screen.width||9999,screen.height||9999)<=820;return matchMedia("(pointer:coarse)").matches||sm||(navigator.deviceMemory&&navigator.deviceMemory<=4)}catch(e){return true}})();
const GS=LITE?1:1.25;
const T_G=0,T_R=1,T_P=2,T_W=3,T_D=4,T_F=5,T_C=6;   // T_C = chasm (blocked fault crack)
const I=(x,y)=>y*N+x, inb=(x,y)=>x>=0&&y>=0&&x<N&&y<N;
function hash(x,y){let h=(x*374761393+y*668265263)|0;h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return (h>>>0)/4294967296}
function P(x,y,z=0){return [(x-y)*HW,(x+y)*HH-z]}
const isRoadBand=(x,y)=>(x>=23&&x<=25)||(y>=23&&y<=25);
function shade(hex,f){const n=parseInt(hex.slice(1),16);let r=n>>16,gg=n>>8&255,b=n&255;if(f<0){r*=1+f;gg*=1+f;b*=1+f}else{r+=(255-r)*f;gg+=(255-gg)*f;b+=(255-b)*f}return `rgb(${r|0},${gg|0},${b|0})`}
function newMap(id){return {id,map:new Uint8Array(N*N),blk:new Uint8Array(N*N),statics:[],B:[],portals:[],pools:[],npcs:[],wanderers:[],monsters:[]}}
function addS(m,o){const p=P(o.cx,o.cy);o.sx=p[0];o.sy=p[1];m.statics.push(o);return o}
const inEll=(x,y,e)=>((x-e[0])/e[2])**2+((y-e[1])/e[3])**2<=1;

    if(isRoadBand(x,y))tp=T_R;
    if(Math.hypot(x+.5-24.5,y+.5-24.5)<=7.3)tp=T_P;
    if(inEll(x+.5,y+.5,m.pools[0])){tp=T_W;blk[I(x,y)]=1}

   {id:"guild",x:13,y:13,w:5,h:4,H:76,wall:"#cdc6ee",trim:"#2c2250",roof:"#5a3fc0",label:"b_guild",flag:true},

  for(let i=3;i<N-3;i+=5)for(const [x,y] of [[i,22],[i,26],[22,i],[26,i]]){
    if(!inb(x,y)||blk[I(x,y)])continue;const tp=map[I(x,y)];if(tp!==T_G&&tp!==T_F)continue;
    blk[I(x,y)]=1;addS(m,{kind:"lamp",x,y,cx:x+.5,cy:y+.5,k:x+y+1,v:hash(x,y)});
  }
  {const used=[],near=(x,y,d)=>used.some(q=>Math.hypot(q[0]-x,q[1]-y)<d);
    const okT=(x,y)=>{const tp=map[I(x,y)];return inb(x,y)&&(tp===T_G||tp===T_F)&&!blk[I(x,y)]&&Math.hypot(x+.5-24.5,y+.5-24.5)>9.5&&TOWN_GATES.every(q=>Math.hypot(x-q[0],y-q[1])>5)&&x>2&&y>2&&x<N-3&&y<N-3};
    const put=(kind,x,y,s)=>{blk[I(x,y)]=1;used.push([x,y]);addS(m,{kind,x,y,cx:x+.5,cy:y+.5,k:x+y+1,v:hash(x*3,y*7),s});};
    for(let i=0;i<6;i++){const a=i*Math.PI/3+.4;let x=Math.round(24.5+Math.cos(a)*12.5),y=Math.round(24.5+Math.sin(a)*12.5);if(okT(x,y)&&!near(x,y,3))put("mono",x,y,1.05)}

  const pw={x:2,y:24,to:"geo",labelK:"geo_name"},ps={x:24,y:46,to:"ruins",labelK:"ruins_name"};
  m.portals.push(pw);addS(m,{kind:"portal",p:pw,cx:2.5,cy:24.5,k:27});

  for(const [x,y] of [[26,21],[31,18],[19,26],[28,27]])blk[I(x,y)]=1;
  plantTrees(m,(x,y,border,r)=>{
    if(TOWN_GATES.some(q=>Math.hypot(x-q[0],y-q[1])<4))return null;
    if(r<(border?.62:.05)){const hv=hash(y*7,x*11);return hv<.14?{kind:"shroom",v:hash(x,y*5),alt:hv<.07?2:0}:{kind:"tree",v:hv<.45?4:hv<.78?5:hv<.92?3:0}}
    return null;
  });
  return m;
}
function plantTrees(m,pick){
  const {map,blk}=m;
  for(let y=1;y<N-1;y++)for(let x=1;x<N-1;x++){
    if(blk[I(x,y)])continue;const tp=map[I(x,y)];if(tp!==T_G&&tp!==T_F)continue;
    const border=x<4||y<4||x>N-5||y>N-5;let ok=true;
    for(let j=-1;j<=1&&ok;j++)for(let i=-1;i<=1;i++){const nx=x+i,ny=y+j;if(!inb(nx,ny))continue;const nt=map[I(nx,ny)];
      if(nt===T_R||nt===T_P||nt===T_W||nt===T_D||(blk[I(nx,ny)]&&!(nx===0||ny===0||nx===N-1||ny===N-1))){ok=false;break}}
    if(!ok)continue;
    const o=pick(x,y,border,hash(x*3+1,y*5+2));
    if(o){blk[I(x,y)]=1;addS(m,Object.assign({x,y,cx:x+.5,cy:y+.5,k:x+y+1,s:.82+hash(x+5,y+9)*.38},o))}
  }
}

const gParse=id=>{const p=id.split("|");return {arch:p[1],slot:p[2],L:+p[3],r:+p[4],k:+(p[5]||0)}};

/* base stats of a piece (before its random roll) */
function gStats(arch,slot,L,r,ref){
  const m=(3+L*.8)*[1,1.4,2,2.8,4][r-1]*(1+.04*(ref||0));
  const o={atk:0,def:0,hardDef:0,hp:0,sp:0,hit:0,crit:0,flee:0,attr:{str:0,agi:0,vit:0,int:0,dex:0,luk:0}};
  switch(slot){
    case "weapon":o.atk=Math.round(m*2.2);break;
    case "armor":o.def=Math.round(m*.9);o.hp=Math.round(m*6);break;
    case "legs":o.def=Math.round(m*.6);o.hp=Math.round(m*3);break;
    case "offhand":o.def=Math.round(m*.7);o.hardDef=+(r*.01*(1+.04*(ref||0))).toFixed(3);break;
    case "necklace":o.hp=Math.round(m*10);o.sp=Math.round(m*2);break;
    case "ring":o.crit=+(m*.08).toFixed(2);o.hit=Math.round(m*.3);break;
    case "headTop":o.def=Math.round(m*.6);o.hp=Math.round(m*4);o.flee=Math.round(m*.3);break;
    case "headMid":o.hp=Math.round(m*4);o.sp=Math.round(m*2.5);break;
    case "headLow":o.def=Math.round(m*.4);o.sp=Math.round(m*3);break;
    case "garment":o.def=Math.round(m*.5);o.hp=Math.round(m*5);break;
    case "shoes":o.def=Math.round(m*.5);o.flee=Math.round(m*.6);break;
    case "shield":o.def=Math.round(m*.9);o.hardDef=+(r*.01*(1+.04*(ref||0))).toFixed(3);break;
    case "bracelet":o.crit=+(m*.1).toFixed(2);o.hp=Math.round(m*6);break;
  }
  o.attr[PRIMARY[arch]]=Math.round(m*.35);
  return o;
}

/* ---- random rolls: every piece gets its own stat roll and abilities ---- */
const AFF_ATTR=["str","agi","vit","int","dex","luk"];
const AFF_FLAT=["atk","def","hp","sp","hit","flee"];
const AFF_PCT=["atkPct","matkPct","defPct","hpPct"];
const ABIL=[
 {id:"ls",en:"Lifesteal",th:"ดูดเลือด",min:2,max:5,unit:"%"},
 {id:"th",en:"Thorns",th:"หนาม",min:5,max:15,unit:"%"},
 {id:"cd",en:"Crit damage",th:"ดาเมจคริติคอล",min:10,max:30,unit:"%"},
 {id:"cdr",en:"Cooldown",th:"คูลดาวน์",min:5,max:15,unit:"%"},
 {id:"red",en:"Damage reduction",th:"ลดดาเมจ",min:3,max:8,unit:"%"},
 {id:"ksp",en:"SP on kill",th:"SP เมื่อฆ่า",min:5,max:15,unit:""}
];
const RMUL=[1,1.3,1.7,2.2,2.8];
const RANDF=(a,b)=>a+(b-a)*Math.random();
function rollGear(arch,L,r,k,slot){
  const f=+RANDF(.85,1.15).toFixed(3);
  const naff=[1,1,2,2,3][r-1],nab=[0,Math.random()<.3?1:0,1,Math.random()<.5?2:1,2][r-1];
  const pool=[...AFF_ATTR,...AFF_FLAT,...AFF_PCT,"crit"],aff=[];
  for(let i=0;i<naff;i++){
    const key=pool.splice(Math.floor(Math.random()*pool.length),1)[0];let v;
    if(AFF_PCT.includes(key))v=+(RANDF(1.5,3)*(1+r*.25+L/60)/100).toFixed(4);
    else if(key==="crit")v=+(RANDF(.5,1.2)*RMUL[r-1]*(1+L/80)).toFixed(2);
    else if(AFF_ATTR.includes(key))v=Math.max(1,Math.round(RANDF(.6,1.2)*RMUL[r-1]*(2+L*.12)/2));
    else v=Math.max(1,Math.round(RANDF(.6,1.2)*RMUL[r-1]*(3+L*.9)));
    aff.push([key,v]);
  }
  const apool=[...ABIL],ab=[];
  for(let i=0;i<nab;i++){const a=apool.splice(Math.floor(Math.random()*apool.length),1)[0];
    const base=RANDF(a.min,a.max);ab.push([a.id,a.unit==="%"?+(base*(1+L/200)).toFixed(2):Math.round(base*(1+L/30))])}
  return {f,aff,ab};
}
const ABIL_BY_ID=Object.fromEntries(ABIL.map(a=>[a.id,a]));
/* a whole piece: id + ref + roll. Used for drops and for the starter gear. */
function newGearItem(arch,slot,L,r,k){return {id:gearId(arch,slot,L,r,k),ref:0,roll:rollGear(arch,L,r,k,slot)}}
/* a piece's full modifier list: base stats x roll, plus affixes and abilities */
const MOD_PCT=new Set(["atkPct","matkPct","defPct","hpPct","healPct","hardDef"]);
function mkMods(){return {atk:0,def:0,hardDef:0,hp:0,sp:0,hit:0,crit:0,flee:0,atkPct:0,matkPct:0,defPct:0,hpPct:0,healPct:0,spPct:0,attr:{str:0,agi:0,vit:0,int:0,dex:0,luk:0},ab:{}}}
function addMod(m,k,v){if(AFF_ATTR.includes(k))m.attr[k]+=v;else m[k]=(m[k]||0)+v}
function gFull(it){
  const p=gParse(it.id),ro=it.roll||{f:1,aff:[],ab:[]},b=gStats(p.arch,p.slot,p.L,p.r,it.ref||0),m=mkMods();
  for(const k of ["atk","def","hp","sp","hit","crit","flee"])m[k]=b[k]*ro.f;
  m.hardDef=b.hardDef;for(const k of AFF_ATTR)m.attr[k]=b.attr[k]*ro.f;
  for(const [k,v] of ro.aff)addMod(m,k,v);
  for(const [id,v] of ro.ab)m.ab[id]=(m.ab[id]||0)+v;
  return m;
}

function gCompareRows(newIt,oldIt){
  const a=newIt?gFull(newIt):mkMods(),b=oldIt?gFull(oldIt):mkMods(),rows=[];
  const pf=(k,v)=>MOD_PCT.has(k)||k.endsWith("Pct")?`${(v*100).toFixed(1).replace(/\.0$/,"")}%`:k==="crit"?(Math.round(v*10)/10).toFixed(1):`${Math.round(v)}`;
  const df=(k,d)=>{const sg=d>0?"+":"";return MOD_PCT.has(k)||k.endsWith("Pct")?`${sg}${(d*100).toFixed(1).replace(/\.0$/,"")}%`:k==="crit"?`${sg}${(Math.round(d*10)/10).toFixed(1)}`:`${sg}${Math.round(d)}`};
  const push=(label,k,av,bv)=>{if(av===0&&bv===0)return;const d=av-bv;if(Math.abs(d)<1e-9)return;rows.push({label,old:pf(k,bv),nw:pf(k,av),diff:df(k,d),cls:d>0?"up":"down"})};
  for(const k of ["atk","def","hp","sp","hit","flee","crit","hardDef"])push(MODLBL[k]?(lang==="th"?MODLBL[k][1]:MODLBL[k][0]):k,k,a[k],b[k]);
  for(const k of AFF_ATTR)push(k.toUpperCase(),k,a.attr[k],b.attr[k]);
  for(const k of ["atkPct","matkPct","defPct","hpPct","healPct"]){const l=MODLBL[k];push((lang==="th"?l[1]:l[0])+"%",k,a[k],b[k])}
  const ids=new Set([...Object.keys(a.ab),...Object.keys(b.ab)]);
  for(const id of ids){const ab=ABIL_BY_ID[id],av=a.ab[id]||0,bv=b.ab[id]||0;const f=v=>ab.unit==="%"?`${v.toFixed(1)}%`:`${Math.round(v)}`;
    if(av===bv)continue;rows.push({label:lang==="th"?ab.th:ab.en,old:bv?f(bv):"—",nw:av?f(av):"—",diff:av&&bv?`${av>bv?"+":""}${ab.unit==="%"?(av-bv).toFixed(1)+"%":Math.round(av-bv)}`:av?"NEW":"−",cls:av>=bv?"up":"down"})}
  return rows;
}

/* sort toggle: Name > Rarity (Equipment tab only) > Sell price. Each press switches the mode and sorts. */
function sortInventory(mode){
  mode=mode||"name";const loc=lang==="th"?"th":"en",rank=id=>isGear(id)?0:(ITEMDB[id]&&ITEMDB[id].q)?3:(ITEMDB[id]&&ITEMDB[id].t==="use")?1:2;
  const star=id=>isGear(id)?gParse(id).r:0,nm=(a,b)=>itemName(a.id).localeCompare(itemName(b.id),loc,{numeric:true}),sl=id=>isGear(id)?EQ_SLOTS.indexOf(equipSlotOf(id)):0;
  const cmp=(a,b)=>{
    if(rank(a.id)!==rank(b.id))return rank(a.id)-rank(b.id);
    if(mode==="rarity"){if(star(a.id)!==star(b.id))return star(b.id)-star(a.id);if(sl(a.id)!==sl(b.id))return sl(a.id)-sl(b.id);return nm(a,b)||itemPrice(b.id,b.ref)-itemPrice(a.id,a.ref)}

  const items={},share=kills/types.length;

/* Arrival = a walkable tile next to the destination map's portal that leads back to where we came from */
function walkableNear(m,x,y){
  for(let r=1;r<=6;r++){            // nearest ring first
    let best=null,bd=1e9;
    for(let yy=y-r;yy<=y+r;yy++)for(let xx=x-r;xx<=x+r;xx++){
      if(Math.max(Math.abs(xx-x),Math.abs(yy-y))!==r||!walkM(m,xx,yy))continue;
      const d=Math.hypot(xx-24.5,yy-24.5);if(d<bd){bd=d;best=[xx+.5,yy+.5]}   // within that ring, face the map center
    }
    if(best)return best;
  }
  return [24.5,24.5];
}
function arriveAt(to,from){
  const m=MAPS[to],p=m&&m.portals.find(q=>q.to===from);
  return p?walkableNear(m,p.x,p.y):[24.5,24.5];
}

  if(up){S.hp=hpMax();S.sp=spMax();fx.push({k:"pillar",x:player.x,y:player.y,t:0,d:1.4,c:"#ffd76a",follow:true});save()}}
function gainJob(n){if(S.jlv>=jcap()){S.jexp=0;return}S.jexp+=n;while(S.jlv<jcap()&&S.jexp>=jneed(S.jlv)){S.jexp-=jneed(S.jlv);S.jlv++;toast(fmt("jobUp",{n:S.jlv}),true);fx.push({k:"ring",x:player.x,y:player.y,t:0,d:.8,c:"#7cf0a8",r:70,follow:true})}

/* ================= combat (REOC formulas) ================= */
const rnd=Math.random;
const ELC={fire:"#ff7a3a",water:"#4fb8ff",wind:"#9cf06a",earth:"#c8964a",holy:"#ffe9a0",neutral:"#cccccc"};
const mprof=mo=>mo.elite?REOC.eliteOf(REOC.MONC[mo.type]):REOC.MONC[mo.type];
function nearestMon(max,noElite){let best=null,bd=max||99;for(const m of liveMon()){if(noElite&&(m.boss||(m.elite&&S.lv<mLv(m)+3)))continue;const d=dist(m,player);if(d<bd){bd=d;best=m}}return best}
function applyHit(mo,res,o){
  if(!mo||mo.dead||mo.dieT>0)return;AUD.sfx(res&&res.miss?"miss":(res&&res.crit)?"crit":"hit");
  player.combatT=0;if(!mo.aggro){mo.aggro=true;mo.speed=MON[mo.type].speed*1.6}
  const h=MON[mo.type].h*mSize(mo);
  if(res.miss){fx.push({k:"dmg",x:mo.x,y:mo.y,t:0,d:.8,txt:t("miss"),c:"#c8c8d8",ox:(rnd()-.5)*24,h});return}
  { const ab=pd().ab||{}; if(res.crit&&ab.cd)res.dmg=Math.round(res.dmg*(1+ab.cd/100)); mo.hp-=res.dmg; if(ab.ls)S.hp=Math.min(hpMax(),S.hp+res.dmg*ab.ls/100); }
  mo.hitT=.16;
  fx.push({k:"dmg",x:mo.x,y:mo.y,t:0,d:res.crit?1.15:.95,txt:num(res.dmg),c:res.crit?"#ffd84a":res.weak?"#8ff0ff":(o&&o.c)||"#ffffff",big:res.crit||res.weak,pop:true,crit:!!res.crit,ox:(rnd()-.5)*(res.crit?18:30),h});
  hitFx(mo,res,o,h);
  if(mo.hp<=0)killMon(mo);
}
function physAttack(mo,o){const d=pd();const res=REOC.physHit(d,mprof(mo),Object.assign({dist:d.ranged?dist(player,mo):0},o),rnd);applyHit(mo,res,o);return res}

const later=(ms,fn)=>setTimeout(fn,ms);
const alive=mo=>mo&&!mo.dead&&mo.dieT<=0;
function basicAttack(mo){
  const b=REOC.ARCH[S.arch].basic,d=pd(),x=player.x,y=player.y;
  if(b.kind==="phys"){
    if(d.ranged){fx.push({k:"proj",x,y,tx:mo.x,ty:mo.y,t:0,d:.2,c:"#f3e2b0"});later(190,()=>{if(alive(mo))physAttack(mo,{ratio:b.ratio})})}
    else{player.lunge=.2;const res=physAttack(mo,{ratio:b.ratio});if(S.arch==="fighter"&&!res.miss)addMomentum(1)}
  }else{fx.push({k:"proj",x,y,tx:mo.x,ty:mo.y,t:0,d:.24,c:ELC[b.elem]||"#c9b8ff"});later(220,()=>{if(alive(mo))magicAttack(mo,{ratio:b.ratio,elem:b.elem,c:b.elem==="holy"?"#ffe9a0":null})})}
}
function killMon(mo){
  const d=MON[mo.type],E=mo.elite,B=mo.boss;AUD.sfx(B?"bossdown":"kill");mo.hp=0;mo.dieT=.45;mo.aggro=false;mo.path=[];mo.stun=0;if(player.target===mo)player.target=null;

  S.sc+=sc;gainBase(be);gainJob(je);S.kills++;
  if(pd().ab&&pd().ab.ksp)S.sp=Math.min(spMax(),S.sp+pd().ab.ksp);
  const kind=B?"boss":E?"elite":"normal",dr=rollDrops(mo.type,kind,mLv(mo));

  for(const [id,q] of dr.items)if(gainItem(id,q)){got+=q;floatText(`+ ${itemName(id)}${q>1?" x"+q:""}`,itemColor(id))}
  for(const g of dr.gear)if(gainGear(g)){got++;floatText(`+ ${gName(g.id)}`,itemColor(g.id))}
  floatText(`+${num(be)} EXP`,"#ffd76a");floatText(`+${num(sc)} Sc`,"#e9d89a");
  const P0=MPAL[mo.type];fx.push({k:"burst",x:mo.x,y:mo.y,t:0,d:.6,c:d.sprite==="lumite"?P0.mid:d.sprite==="crawlix"?P0.c[0]:P0.i1,n:E?28:16,z:d.h*.5});
  if(E)fx.push({k:"ring",x:mo.x,y:mo.y,t:0,d:.8,c:"#ffd76a",r:90});
  if(B){fx.push({k:"pillar",x:mo.x,y:mo.y,t:0,d:1.6,c:"#bfe8ff"});fx.push({k:"ring",x:mo.x,y:mo.y,t:0,d:1.1,c:"#ffffff",r:170});fx.push({k:"ring",x:mo.x,y:mo.y,t:-.2,d:1.1,c:"#9fd8ff",r:130});toast(t("boss_down"),true);pushChat({ch:"sys",k:"sys_boss"})}
  if(S.idle){const s=S.sess;s.kills++;s.base+=be;s.job+=S.jlv<jcap()?je:0;s.sc+=sc;s.mats+=got;s.items=s.items||{};for(const [id,q] of dr.items)s.items[id]=(s.items[id]||0)+q;s.gear=(s.gear||0)+dr.gear.length}
  questEvent({t:"kill",mo});
}
function damagePlayer(dmg,tag){

function resetCombatState(){BF.regen=BF.herbAtk=BF.herbDef=BF.sage=0;BF.warCry=BF.blessing=BF.leap=0;BF.burn=BF.slow=BF.burnAcc=0;BF.leapShot=false;BF.shield=0;BF.momentum=0;BF.momT=0;BF.zone=null;for(const k in CD)CD[k]=0}
function addMomentum(n){BF.momentum=Math.min(5,BF.momentum+n);BF.momT=5}
function updateCombat(dt){
  player.atkCd=Math.max(0,player.atkCd-dt);player.lunge=Math.max(0,player.lunge-dt);player.combatT+=dt;
  for(const k of ["warCry","blessing","leap","regen","herbAtk","herbDef","sage"])if(BF[k]>0)BF[k]=Math.max(0,BF[k]-dt);
  if(BF.slow>0)BF.slow=Math.max(0,BF.slow-dt);player.speed=3.6*(BF.slow>0?.65:1);
  if(BF.burn>0&&!player.dead){BF.burn=Math.max(0,BF.burn-dt);BF.burnAcc+=dt;if(BF.burnAcc>=1){BF.burnAcc-=1;damagePlayer(Math.max(1,Math.round(BF.burnDps)),t("fx_burn"))}}
  if(BF.momT>0){BF.momT-=dt;if(BF.momT<=0)BF.momentum=0}
  for(const k in CD)if(CD[k]>0)CD[k]=Math.max(0,CD[k]-dt);
  if(BF.zone){const z=BF.zone,k=REOC.SK.sanctuary;z.t-=dt;
    if(z.map===cur.id){if(Math.hypot(player.x-z.x,player.y-z.y)<=k.radius)S.hp=Math.min(hpMax(),S.hp+hpMax()*k.healPct*dt);
      z.acc+=dt;if(z.acc>=.5){z.acc-=.5;for(const m of liveMon())if(Math.hypot(m.x-z.x,m.y-z.y)<=k.radius)magicAttack(m,{ratio:k.ratio*.5,elem:"holy",c:"#ffe9a0"})}}
    if(z.t<=0)BF.zone=null}
  if(player.casting){const c=player.casting;c.t-=dt;if(c.t<=0){player.casting=null;finishSkill(c.id,c.tg)}return}
  const tg=player.target;if(!tg)return;
  if(!alive(tg)){player.target=null;return}
  const d=dist(player,tg),R=pd().range;
  if(d>R){player.chaseT-=dt;if(player.chaseT<=0||!player.path.length){player.chaseT=.35;walkTo(player,Math.floor(tg.x),Math.floor(tg.y))}}
  else{player.path=[];player.moving=false;faceToward(player,tg.x,tg.y);if(player.atkCd<=0){player.atkCd=pd().interval;basicAttack(tg)}}
}
/* ---- v19 monster skills: a red circle on the ground (around the monster, or on the player) that lands after a short wind-up; some leave Burning or Slow ---- */
const MSK={

 undertow:{k:"ground",r:1.8,wind:1.0,mult:1.4,cd:[5,8],rng:8,nameK:"msk_undertow",deb:{slow:4}},
 crust:{k:"self",r:3.6,wind:1.3,mult:1.9,cd:[8,11],rng:3.6,nameK:"msk_crust"},
 debris:{k:"ground",r:2.2,wind:1.1,mult:1.5,cd:[7,10],rng:7,nameK:"msk_debris"},
 emberburst:{k:"ground",r:1.7,wind:.8,mult:1.2,cd:[4.5,7],rng:7,nameK:"msk_emberburst",deb:{burn:5}},
 lavaspit:{k:"ground",r:2.1,wind:1.0,mult:1.5,cd:[6,9],rng:8,nameK:"msk_lavaspit",deb:{burn:4}},
 inferno:{k:"ground",r:2.8,wind:1.3,mult:1.9,cd:[8,11],rng:8,nameK:"msk_inferno",deb:{burn:6}},
 ashwave:{k:"self",r:4.2,wind:1.4,mult:1.7,cd:[10,14],rng:4.2,nameK:"msk_ashwave"}
};
function castMonSkill(mo,id){
  const s=MSK[id],self=s.k==="self";
  mo.tele={t:s.wind,total:s.wind,x:self?mo.x:player.x,y:self?mo.y:player.y,r:s.r,mult:s.mult,deb:s.deb||null,nameK:s.nameK};
  mo.path=[];mo.moving=false;faceToward(mo,player.x,player.y);
  fx.push({k:"dmg",x:mo.x,y:mo.y,t:0,d:.9,txt:t(s.nameK),c:"#ffb08a",ox:0,h:MON[mo.type].h*mSize(mo)+16});
  AUD.sfx("warn");
}
function monSkillTick(mo,d,dt){
  const ds=MON[mo.type].skills;if(!ds||mo.tele)return false;
  mo.skCd=mo.skCd||[];
  for(let i=0;i<ds.length;i++){const s=MSK[ds[i]];
    if(mo.skCd[i]==null)mo.skCd[i]=s.cd[0]*(.35+rnd()*.5);
    mo.skCd[i]-=dt;
    if(mo.skCd[i]<=0&&d<=s.rng){mo.skCd[i]=s.cd[0]+rnd()*(s.cd[1]-s.cd[0]);castMonSkill(mo,ds[i]);return true}}
  return false;
}
function applyDeb(deb,mo){   // Burning: 10% of the monster's ATK per second
  if(deb.burn){BF.burn=Math.max(BF.burn,deb.burn);BF.burnDps=Math.max(BF.burnDps||0,mprof(mo).atk*.1)}
  if(deb.slow)BF.slow=Math.max(BF.slow,deb.slow);
}
function updateMon(mo,dt){
  if(mo.dead){mo.respawn-=dt;if(mo.respawn<=0)respawnMon(mo);return}
  if(mo.dieT>0){mo.dieT-=dt;if(mo.dieT<=0){mo.dead=true;mo.tele=null;mo.respawn=mo.boss?120:mo.elite?45+Math.random()*15:8+Math.random()*7}return}
  mo.hitT=Math.max(0,mo.hitT-dt);mo.atkCd=Math.max(0,mo.atkCd-dt);
  if(mo.boss&&mo.stun>0){mo.stun=0;fx.push({k:"dmg",x:mo.x,y:mo.y,t:0,d:.8,txt:t("immune"),c:"#bfe8ff",ox:0,h:MON[mo.type].h*mSize(mo)})}
  if(mo.stun>0){mo.stun-=dt;mo.path=[];mo.moving=false;return}
  if(mo.hp<mo.maxHp&&!mo.aggro)mo.hp=Math.min(mo.maxHp,mo.hp+mo.maxHp*(mo.boss?.02:.05)*dt);
  if(mo.boss&&mo.aggro&&!player.dead){mo.slamT-=dt;if(!mo.tele&&mo.slamT<=0){mo.tele={t:1.4,total:1.4,x:mo.x,y:mo.y,r:3.4};AUD.sfx("warn");mo.slamT=9+Math.random()*3;mo.path=[]}}
  if(mo.tele){mo.tele.t-=dt;if(mo.tele.t<=0){const tl=mo.tele;mo.tele=null;
    AUD.sfx("slam");fx.push({k:"ring",x:tl.x,y:tl.y,t:0,d:.6,c:"#ff9a7a",r:tl.r*55});fx.push({k:"burst",x:tl.x,y:tl.y,t:0,d:.6,c:"#ffd0b0",n:26,z:10});
    if(!player.dead&&Math.hypot(player.x-tl.x,player.y-tl.y)<=tl.r){const raw=mprof(mo).atk*(tl.mult||1.8)*(.9+rnd()*.2);damagePlayer(Math.max(1,Math.round(raw*(1-pd().hardDef)-pd().softDef)),t(tl.nameK||"slam"));if(tl.deb&&!player.dead)applyDeb(tl.deb,mo)}}}
  {const dd=MON[mo.type];   // aggressive monsters (v19) attack first when you come close
    if(!mo.aggro&&dd.aggr&&!mo.boss&&aggroGrace<=0&&!player.dead&&dist(mo,player)<=dd.aggr+(mo.elite?1:0)){mo.aggro=true;mo.speed=dd.speed*1.6;mo.path=[];mo.repath=0;fx.push({k:"dmg",x:mo.x,y:mo.y,t:0,d:.8,txt:"!",c:"#ff5a6a",big:true,ox:0,h:dd.h*mSize(mo)+10})}}
  if(mo.aggro&&!player.dead){
    const d=dist(mo,player);
    if(mo.tele){mo.path=[];mo.moving=false}
    else if(d<=16&&monSkillTick(mo,d,dt)){}
    else if(d>16){mo.aggro=false;mo.speed=MON[mo.type].speed;walkTo(mo,Math.floor(mo.home[0]),Math.floor(mo.home[1]))}
    else if(d>1.25){mo.repath-=dt;if(mo.repath<=0||!mo.path.length){mo.repath=.5;walkTo(mo,Math.floor(player.x),Math.floor(player.y))}}
    else{mo.path=[];mo.moving=false;faceToward(mo,player.x,player.y);if(mo.atkCd<=0){mo.atkCd=MON[mo.type].aspd;monHit(mo)}}
  }else{
    mo.wait-=dt;
    if(!mo.path.length&&mo.wait<=0){const wr=mo.boss?3:8,tx=Math.floor(mo.home[0]+(Math.random()-.5)*wr),ty=Math.floor(mo.home[1]+(Math.random()-.5)*wr);if(walk(tx,ty))walkTo(mo,tx,ty);mo.wait=(mo.boss?6:2)+Math.random()*5}
  }
  moveChar(mo,dt);
}

function skillTargetRange(k,d){return k.ranged?d.range:(k.range||d.range)}
function useSkill(id,auto){
  const k=REOC.SK[id],d=pd();if(!k||player.dead)return false;
  if(CD[id]>0||player.casting)return false;
  const cost=Math.ceil(k.sp*d.spCost);if(S.sp<cost){if(!auto)toast(t("noSp"));return false}
  let tg=null;
  const needsTarget=(k.kind==="phys"||k.kind==="magic")&&!(k.aoe&&k.at==="self");
  if(needsTarget){
    if(!isField()){if(!auto)toast(t("noTarget"));return false}
    const R=skillTargetRange(k,d)+.3;
    tg=alive(player.target)?player.target:null;
    if(!tg||dist(tg,player)>R)tg=nearestMon(R);
    if(!tg){if(!auto)toast(t("noTarget"));return false}
    player.target=tg;faceToward(player,tg.x,tg.y);
  }
  if((k.kind==="phys"||k.kind==="magic")&&k.aoe&&k.at==="self"&&!isField()){if(!auto)toast(t("noTarget"));return false}

function leapAway(n){
  const m=nearestMon(30);let dx=-player.dir,dy=player.dir;

function moveChar(c,dt){
  if(!c.path.length){c.moving=false;return}
  const [tx,ty]=c.path[0],dx=tx-c.x,dy=ty-c.y,d=Math.hypot(dx,dy),st=c.speed*dt;
  const sdx=dx-dy,sdy=dx+dy;if(Math.abs(sdx)+Math.abs(sdy)>.01){c.dir=sdx>=0?1:-1;c.back=sdy<-.3*Math.abs(sdx)}
  if(d<=st){c.x=tx;c.y=ty;c.path.shift();if(!c.path.length){c.moving=false;const f=c.onArrive;c.onArrive=null;if(f)f();return}}
  else{c.x+=dx/d*st;c.y+=dy/d*st}
  c.moving=true;c.phase+=dt*c.speed*3.2;
}

function winClick(e){const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act;
  if(a==="uimode"){S.uiMode=b.dataset.v;applyUiMode();renderWin();save()}
  else if(a==="nav")navTo(b.dataset.w);
  else if(a==="invpage"){invPage[invTab]=Math.max(0,(invPage[invTab]|0)+ +b.dataset.d);renderWin()}
  else if(a==="invsort"){const order=invTab==="gear"?["name","rarity","price"]:["name","price"];const i=order.indexOf(invSortMode);invSortMode=order[(i+1)%order.length];sortInventory(invSortMode);renderWin();save()}
  else if(a==="invexp"){shopTab="cash";openWin("shop")}
  else if(a==="shoptab"){shopTab=b.dataset.v;renderWin()}
  else if(a==="buyPack")buyPack(b.dataset.c)
  else if(a==="settab"){setTab=b.dataset.v;renderWin()}
  else if(a==="idleAgain"){closeWin();$("#idleBtn").click()}
  else if(a==="idleClose")closeWin()
  else if(a==="wmsel"){mapSel=b.dataset.m;mapTab="info";winSide="mapinfo";renderWin()}
  else if(a==="maptab"){mapTab=b.dataset.v;renderWin()}
  else if(a==="tp")doTeleport(b.dataset.m)
  else if(a==="title")toast(t("title_soon_t"))
  else if(a==="gm"){S.gm=!S.gm;renderWin()}
  else if(a==="annSend"){const v=($("#annIn")||{}).value;if(v&&v.trim()){announce({from:"gm",name:AUTH.session?AUTH.session.name:"",raw:v.trim()});toast(t("ann_sent"),true);$("#annIn").value=""}}
  else if(a==="annPrev")announce({from:"sys",k:ANN_AUTO[annIdx++%ANN_AUTO.length]})
  else if(a==="lang")setLang(b.dataset.v);
  else if(a==="lay")setLayout(b.dataset.v);
  else if(a==="gfx"){S.gfx=b.dataset.v;layout();renderWin()}
  else if(a==="snd"){S.sound=!S.sound;AUD.apply();AUD.sfx("click");renderWin()}else if(a==="mus"){S.music=!S.music;AUD.apply();renderWin()}
  else if(a==="mock")toast(t("mock"));
  else if(a==="cview"){charView=b.dataset.v;eqSel=null;renderWin()}
  else if(a==="logout"){onLeave();AUTH.logout()}
  else if(a==="accUpgrade"){onLeave();AUTH.goRegister()}
  else if(a==="accDelete"){if(!accArm){accArm=true;renderWin();return}resetDone=true;AUTH.deleteAccount()}
  else if(a==="invtab"){invTab=b.dataset.v;if(invSortMode==="rarity"&&invTab!=="gear")invSortMode="name";invSel=null;invArm=null;winDet=null;renderWin()}
  else if(a==="invsel"){if(invMulti){invPick.has(b.dataset.k)?invPick.delete(b.dataset.k):invPick.add(b.dataset.k);renderWin()}else if(invSel===b.dataset.k&&winDet){invSel=null;winDet=null;renderWin()}else{invSel=b.dataset.k;eqSel=null;invQ=1;invArm=null;winDet="itemdet";renderWin()}}

   <div class="au-f"><label for="lp">${T("pass")}</label>${pw("lp","lp","current-password")}</div>
   <label class="au-chk"><input id="keep" type="checkbox" ${st.v.keep?"checked":""}><span>${T("keep")}</span></label>
   <button class="au-go" data-a="login" ${st.busy?"disabled":""}>${st.busy?T("busy"):T("b_login")}</button>
   <div class="au-links"><button class="au-link" data-a="tab" data-t="register">${T("to_reg")}</button><button class="au-link" data-a="tab" data-t="guest">${T("to_guest")}</button></div>`;
  if(st.tab==="register"){const gs=guestSave(),sc=strength(st.v.rp),lab=["","s_weak","s_ok","s_good","s_strong"][sc];
    return `
   <div class="au-f"><label for="ru">${T("user")}</label><input id="ru" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" value="${esc(st.v.ru)}" maxlength="16"><small>${T("h_user")}</small></div>
   <div class="au-f"><label for="rn">${T("cname")}</label><input id="rn" type="text" autocomplete="nickname" value="${esc(st.v.rn)}" maxlength="12"><small>${T("h_cname")}</small></div>
   <div class="au-f"><label for="rp">${T("pass")}</label>${pw("rp","rp","new-password")}<div class="au-str s${sc}"><i></i><i></i><i></i><i></i><span>${sc?T(lab):T("h_pass")}</span></div></div>
   <div class="au-f"><label for="rc">${T("pass2")}</label>${pw("rc","rc","new-password")}</div>
   ${gs?`<label class="au-chk"><input id="rmove" type="checkbox" ${st.v.rmove?"checked":""}><span>${T("move")}<br><small>${T("found",{l:gs.gameState.lv||1})}</small></span></label>`:""}
   <button class="au-go" data-a="register" ${st.busy?"disabled":""}>${st.busy?T("busy"):T("b_register")}</button>
   <div class="au-links"><button class="au-link" data-a="tab" data-t="login">${T("to_login")}</button></div>`}
  const gs=guestSave();
  return `
   <p class="au-text">${T("g_text")}</p>
   ${gs?`<p class="au-found">${T("found",{l:gs.gameState.lv||1})}</p>`:""}
   <div class="au-f"><label for="gn">${T("nick")}</label><input id="gn" type="text" value="${esc(st.v.gn)}" placeholder="${esc(get(ls,K.guest)||"Guest1234")}" maxlength="12" autocomplete="off"></div>
   <button class="au-go alt" data-a="guest">${T("b_guest")}</button>
   <div class="au-links"><button class="au-link" data-a="tab" data-t="login">${T("to_login")}</button></div>`;
}
function render(focus){
  const r=root();if(!r)return;r.classList.remove("hidden");r.lang=lang;
  const storageBad=!ls;
  r.innerHTML=`<div class="au-bg" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <div class="au-wrap">
   <div class="au-top"><div class="au-lang" role="group" aria-label="Language"><button data-a="lang" data-l="th" class="${lang==="th"?"on":""}">ไทย</button><button data-a="lang" data-l="en" class="${lang==="en"?"on":""}">EN</button></div></div>
   <div class="au-brand"><svg viewBox="0 0 64 80" class="au-gem" aria-hidden="true"><defs><linearGradient id="gA" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#b6a8ff"/></linearGradient></defs><polygon points="32,2 54,28 32,78 10,28" fill="url(#gA)" stroke="#fff" stroke-opacity=".7"/><polygon points="32,2 54,28 32,34" fill="#8f7ef0"/><polygon points="32,34 54,28 32,78" fill="#5a46c0"/><polygon points="32,34 10,28 32,78" fill="#7d68e0"/></svg>
    <h1>Rare Earth Online</h1><p>${T("sub")}</p><small>${T("town")}</small></div>
   <div class="au-card">
    <div class="au-tabs" role="tablist">${["login","register","guest"].map(t=>`<button role="tab" aria-selected="${st.tab===t}" class="${st.tab===t?"on":""}" data-a="tab" data-t="${t}">${T("tab_"+t)}</button>`).join("")}</div>
    ${storageBad?`<div class="au-err" role="alert">${T("e_storage")}</div>`:""}
    <div class="au-panel" id="auPanel">${panel()}</div>
    <div class="au-err" id="auErr" role="alert" aria-live="assertive">${st.err?esc(st.err):""}</div>
   </div>
   <p class="au-note">${T("note")}</p>
  </div>`;
  const f=focus||(st.tab==="login"?(st.v.lu?"lp":"lu"):st.tab==="register"?"ru":"gn");
  const el=document.getElementById(f);if(el&&!("ontouchstart" in window))el.focus();
}
function setErr(m){st.err=m||"";const e=document.getElementById("auErr");if(e)e.textContent=st.err}
function readInputs(){
  const g=id=>{const e=document.getElementById(id);return e?e.value:null};
  const m={lu:"lu",lp:"lp",ru:"ru",rn:"rn",rp:"rp",rc:"rc",gn:"gn"};
  for(const k in m){const v=g(m[k]);if(v!==null)st.v[k]=v}
  const kp=document.getElementById("keep");if(kp)st.v.keep=kp.checked;
  const mv=document.getElementById("rmove");if(mv)st.v.rmove=mv.checked;
}
async function doLogin(){
  readInputs();const u=st.v.lu.trim(),p=st.v.lp;
  if(!u||!p){setErr(T("e_empty"));return}
  if(!ls){setErr(T("e_storage"));return}
  const key=u.toLowerCase(),lk=lockLeft(key);if(lk){setErr(T("e_lock",{s:lk}));return}
  st.busy=true;render("lp");
  try{
    const acc=accLoad(),rec=acc.users[key];
    // unknown users still pay the hashing cost, so timing does not reveal whether a name exists
    const h=await hashPw(p,rec?rec.salt:"00112233445566778899aabbccddeeff",rec?rec.algo:ALGO);
    if(rec&&same(h,rec.hash)){
      cleared(key);set(ls,K.last,rec.name);
      begin({type:"user",uid:rec.id,name:rec.name,charName:rec.charName},st.v.keep);return;
    }
    failed(key);st.busy=false;st.v.lp="";render("lp");const l2=lockLeft(key);setErr(l2?T("e_lock",{s:l2}):T("e_bad"));
  }catch(e){st.busy=false;render("lp");setErr(String(e&&e.message)==="nosubtle"?T("e_crypto"):T("e_bad"))}
}
async function doRegister(){
  readInputs();const u=st.v.ru.trim(),cn=cleanName(st.v.rn),p=st.v.rp,c=st.v.rc;
  if(!u||!cn||!p||!c){setErr(T("e_empty"));return}
  if(!ls){setErr(T("e_storage"));return}
  if(!userOK(u)){setErr(T("e_user"));return}
  if(RESERVED.includes(u.toLowerCase())||RESERVED.includes(cn.toLowerCase())){setErr(T("e_reserved"));return}
  if(!nameOK(cn)){setErr(T("e_cname"));return}
  if(p.length<6){setErr(T("e_pass"));return}
  if(p!==c){setErr(T("e_match"));return}
  const acc=accLoad(),key=u.toLowerCase();
  if(acc.users[key]){setErr(T("e_taken"));return}
  st.busy=true;render("ru");
  try{
    const salt=hex(rnd(16)),hash=await hashPw(p,salt,ALGO),id="u_"+hex(rnd(8));
    const acc2=accLoad();if(acc2.users[key]){st.busy=false;render("ru");setErr(T("e_taken"));return}
    acc2.users[key]={id,name:u,charName:cn,salt,hash,algo:ALGO,created:Date.now()};
    if(!accSave(acc2)){st.busy=false;render("ru");setErr(T("e_storage"));return}
    if(st.v.rmove&&guestSave()){   // move: copy first, delete the guest copy only after the copy is verified
      const raw=get(ls,K.legacy);set(ls,saveKeyFor({type:"user",uid:id}),raw);
      if(get(ls,saveKeyFor({type:"user",uid:id}))===raw)del(ls,K.legacy);
    }
    set(ls,K.last,u);
    begin({type:"user",uid:id,name:u,charName:cn},true);
  }catch(e){st.busy=false;render("ru");setErr(String(e&&e.message)==="nosubtle"?T("e_crypto"):T("e_bad"))}
}
function doGuest(){
  readInputs();let n=cleanName(st.v.gn||"");
  if(n&&!nameOK(n)){setErr(T("e_cname"));return}
  if(n&&RESERVED.includes(n.toLowerCase())){setErr(T("e_reserved"));return}
  if(n)set(ls,K.guest,n);else n=guestName();
  begin({type:"guest",uid:"guest",name:n,charName:n},true);
}
function onClick(e){
  const b=e.target.closest("[data-a]");if(!b||st.busy)return;
  const a=b.dataset.a;
  if(a==="tab"){readInputs();st.tab=b.dataset.t;st.err="";render()}
  else if(a==="lang"){readInputs();lang=b.dataset.l;API.lang=lang;set(ls,K.lang,lang);render()}
  else if(a==="eye"){readInputs();st.showPw=!st.showPw;render(document.activeElement&&document.activeElement.id)}
  else if(a==="login")doLogin();
  else if(a==="register")doRegister();
  else if(a==="guest")doGuest();
}
function onKey(e){
  if(e.key!=="Enter"||st.busy)return;const t=e.target;if(!t||t.tagName!=="INPUT"||t.type==="checkbox")return;
  e.preventDefault();if(st.tab==="login")doLogin();else if(st.tab==="register")doRegister();else doGuest();
}
function onInput(e){
  if(e.target.id==="rp"){readInputs();const sc=strength(st.v.rp),box=document.querySelector(".au-str");
    if(box){box.className="au-str s"+sc;box.querySelector("span").textContent=sc?T(["","s_weak","s_ok","s_good","s_strong"][sc]):T("h_pass")}}
  if(st.err)setErr("");
}
function boot(){
  const r=root();if(!r)return;
  r.addEventListener("click",onClick);r.addEventListener("keydown",onKey);r.addEventListener("input",onInput);
  let s=readSession();
  if(s){
    if(s.type==="user"){const a=accLoad();const ok=Object.values(a.users).some(u=>u.id===s.uid);if(!ok)s=null}
  }
  if(s){apply(s);startGame();return}
  const intent=get(ss,K.intent);del(ss,K.intent);
  if(intent==="register"){st.tab="register";st.v.rmove=!!guestSave()}
  else if(!ls||Object.keys(accLoad().users).length===0)st.tab=guestSave()?"guest":"register";
  render();
}
API._sha256=sha256;API._hash=hashPw;API.algo=ALGO;
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",boot);else boot();
})();

</script>
