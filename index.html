<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rare Earth Online — Gadolinium</title>
<meta name="reo-version" content="18.3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#c7cfdf; --panel:rgba(250,248,244,.9); --panel2:rgba(238,234,226,.95);
  --line:rgba(90,78,130,.22); --ink:#1f1c2e; --ink2:#615b78; --gold:#9a6e18; --gold2:#e9c46a;
  --accent:#6e58e8; --accent2:#a99cff; --shadow:0 8px 26px rgba(30,24,70,.2);
  --slot:#ece8f4; --slotb:rgba(90,78,130,.28);
  --sys:#23866a; --party:#2f6fc8; --guild:#9a4fc8;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#06080f; --panel:rgba(18,20,38,.82); --panel2:rgba(28,31,56,.92);
    --line:rgba(176,166,255,.2); --ink:#eef0fb; --ink2:#a5aac8; --gold:#e9c46a; --gold2:#ffe39a;
    --accent:#8a78ff; --accent2:#c3b8ff; --shadow:0 10px 30px rgba(0,0,0,.45);
    --slot:#1d2142; --slotb:rgba(176,166,255,.24);
    --sys:#6fe0b4; --party:#8ec0ff; --guild:#d7a3ff;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#06080f; --panel:rgba(18,20,38,.82); --panel2:rgba(28,31,56,.92);
  --line:rgba(176,166,255,.2); --ink:#eef0fb; --ink2:#a5aac8; --gold:#e9c46a; --gold2:#ffe39a;
  --accent:#8a78ff; --accent2:#c3b8ff; --shadow:0 10px 30px rgba(0,0,0,.45);
  --slot:#1d2142; --slotb:rgba(176,166,255,.24);
  --sys:#6fe0b4; --party:#8ec0ff; --guild:#d7a3ff;
  color-scheme:dark;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:Kanit,"Noto Sans Thai",Tahoma,system-ui,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
*,*::before,*::after{box-sizing:border-box}
button{font:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
#app{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(120% 90% at 50% 0%,rgba(110,88,232,.25),transparent 60%),var(--bg)}
#stage{position:relative;overflow:hidden;background:#10241c;flex:none}
#stage.framed{border-radius:30px;box-shadow:0 0 0 9px #13141a,0 0 0 10px #3b3d4a,0 30px 80px rgba(0,0,0,.45)}
#stage.framed.L{border-radius:20px}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:pointer}
#ui{position:absolute;inset:0;pointer-events:none;font-size:14px}
#ui>div{position:absolute}
.panel,#ui button,#ui input,.seg,#hotbar,#menu{pointer-events:auto}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);-webkit-backdrop-filter:blur(10px) saturate(1.2);backdrop-filter:blur(10px) saturate(1.2)}

/* player card */
#topL{top:12px;left:12px;width:300px;display:flex;flex-direction:column;gap:10px}
#pc{display:flex;gap:11px;padding:10px 12px 10px 10px}
.pc-av{position:relative;width:64px;height:64px;flex:none}
.pc-av canvas{width:100%;height:100%;border-radius:50%;border:2px solid var(--gold2);background:radial-gradient(circle at 40% 30%,#e3dcff,#5a49b8);display:block}
.lvbadge{position:absolute;bottom:-5px;left:50%;transform:translateX(-50%);background:linear-gradient(#f6dc8c,#c6912f);color:#3a2508;font-size:11px;font-weight:600;padding:0 8px;border-radius:10px;white-space:nowrap;border:1px solid rgba(80,50,10,.35)}
.pc-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.pc-name{display:flex;align-items:baseline;gap:7px;font-weight:600;font-size:15px;line-height:1.2}
.job{font-size:12px;font-weight:400;color:var(--ink2)}
.bar{position:relative;height:13px;border-radius:7px;background:rgba(10,10,30,.28);overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;width:100%;border-radius:7px;transition:width .35s}
.bar.hp i{background:linear-gradient(#ff95a0,#d3304a)}
.bar.sp i{background:linear-gradient(#95c8ff,#2f6fd8)}
.bar.exp i{background:linear-gradient(#ffe39a,#d39a2a)}
.bar span{position:relative;display:flex;justify-content:space-between;font-size:10px;line-height:13px;padding:0 6px;color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.65);font-weight:500}
.bar b{font-weight:500;font-variant-numeric:tabular-nums}
.pc-gold{font-size:12px;color:var(--ink2);display:flex;align-items:center;gap:5px}
.pc-gold b{color:var(--gold);font-weight:600;font-variant-numeric:tabular-nums}
.coin{width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3b5,#e0a630 60%,#9b6a12)}

/* idle */
#idle{padding:10px 12px}
.idle-h{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:600;font-size:13.5px}
.idle-t{display:flex;align-items:center;gap:7px}
.idle-t::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ink2);opacity:.5}
#idle.on .idle-t::before{background:#3fd6a8;opacity:1;box-shadow:0 0 0 4px rgba(63,214,168,.25)}
.tog{width:44px;height:24px;border-radius:12px;border:none;background:rgba(120,120,150,.45);position:relative;cursor:pointer;transition:background .2s;flex:none}
.tog i{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.tog.on{background:linear-gradient(90deg,var(--accent),#3fc6a8)}
.tog.on i{left:23px}
.idle-rows{display:grid;grid-template-columns:1fr 1fr;gap:3px 14px;margin:8px 0;font-size:12px;color:var(--ink2)}
.idle-rows div{display:flex;justify-content:space-between;gap:6px}
.idle-rows b{color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:9px;padding:6px 14px;font-size:13px;cursor:pointer}
.btn.pri{background:var(--accent);color:#fff;border-color:transparent}
.btn.gold{width:100%;background:linear-gradient(#f6dc8c,#d1a03e);color:#3a2508;border:1px solid rgba(90,60,10,.3);font-size:12.5px;font-weight:600}
.btn:disabled{opacity:.45;cursor:default}

/* banner */
#topC{top:12px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
#banner{text-align:center;padding:5px 44px 7px;background:linear-gradient(90deg,transparent,rgba(12,14,32,.62) 20%,rgba(12,14,32,.62) 80%,transparent);color:#fff}
.b-sub{font-size:12px;letter-spacing:.06em;color:#ead8a4}
.b-name{font-size:26px;font-weight:600;letter-spacing:.04em;line-height:1.15;color:#f3f0ff;text-shadow:0 0 18px rgba(170,150,255,.65),0 2px 4px rgba(0,0,0,.5)}
.b-meta{font-size:11.5px;color:#d3d6ee;display:flex;gap:12px;justify-content:center;font-variant-numeric:tabular-nums}
#hint{font-size:12.5px;padding:5px 14px;border-radius:20px;background:rgba(12,14,32,.6);color:#fff;transition:opacity .8s}
#hint.gone{opacity:0}

/* right column */
#topR{top:12px;right:12px;width:250px;display:flex;flex-direction:column;gap:10px}
#tools{display:flex;gap:6px;justify-content:flex-end;flex-wrap:nowrap}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:2px;box-shadow:var(--shadow)}
.seg button{border:0;background:none;font-size:12.5px;font-weight:500;color:var(--ink2);padding:3px 10px;border-radius:8px;cursor:pointer}
.seg button.on{background:var(--accent);color:#fff}
.ibtn{height:30px;min-width:30px;padding:0 8px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:5px;font-size:12px;cursor:pointer;box-shadow:var(--shadow)}
.ibtn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
#mmWrap{padding:6px;position:relative}
#mm{display:block;width:100%;height:122px;border-radius:9px;background:#132a23;cursor:crosshair;touch-action:none}
.mm-name{position:absolute;left:13px;top:10px;font-size:11px;color:#fff;text-shadow:0 1px 2px #000;pointer-events:none}
#quest{padding:9px 12px 10px;font-size:12.5px}
.q-h{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--gold);font-weight:600;margin-bottom:3px}
.q-go{border:0;background:var(--accent);color:#fff;font-size:11px;border-radius:7px;padding:1px 9px;cursor:pointer}
.q-title{font-weight:600}
.q-obj{color:var(--ink2);display:flex;gap:7px;align-items:flex-start;line-height:1.4}
.q-obj::before{content:"";width:7px;height:7px;margin-top:6px;border-radius:2px;transform:rotate(45deg);background:var(--gold2);flex:none}

/* chat */
.c-tabs button{border:0;background:none;font-size:12px;color:var(--ink2);padding:3px 10px;border-radius:7px 7px 0 0;cursor:pointer}
.c-tabs button.on{background:var(--panel2);color:var(--ink);font-weight:500}
#clog{flex:1;overflow-y:auto;padding:6px 10px;font-size:12.5px;line-height:1.5;background:var(--panel2);margin:0 6px;border-radius:0 8px 8px 8px;-webkit-user-select:text;user-select:text}
.m-sys{color:var(--sys)} .m-party{color:var(--party)} .m-guild{color:var(--guild)}
.m-n{font-weight:500;color:var(--accent)}
.m-me .m-n{color:var(--gold)}
.c-in{display:flex;gap:6px;padding:6px}
.c-in input{flex:1;min-width:0;border:1px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:8px;padding:5px 10px;font:inherit;font-size:12.5px}

/* hotbar */
#botC{bottom:12px;left:50%;transform:translateX(-50%)}
#hotbar{display:flex;gap:5px;padding:7px;border-radius:14px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.slot{position:relative;width:46px;height:46px;border-radius:10px;border:1px solid var(--slotb);background:var(--slot);display:grid;place-items:center;cursor:pointer;overflow:hidden;padding:0;transition:transform .08s}
.slot .ic{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;background:var(--c);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 -3px 6px rgba(0,0,0,.22)}
.slot svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 1px 1px rgba(0,0,0,.35))}
.slot .k{position:absolute;top:1px;left:4px;font-size:9.5px;color:var(--ink2);font-weight:500;z-index:2}
.slot .n{position:absolute;bottom:0;right:4px;font-size:10px;color:var(--ink);font-weight:600;z-index:2;text-shadow:0 0 3px var(--slot)}
.slot::after{content:"";position:absolute;inset:0;background:conic-gradient(rgba(8,8,22,.62) calc(var(--cd,0)*1turn),transparent 0);pointer-events:none}
.slot:active{transform:scale(.93)}
.slot.flash .ic{filter:brightness(1.45)}

/* menu */
#botR{right:12px;bottom:12px}
#menu{display:grid;grid-template-columns:repeat(4,48px);gap:6px;padding:7px;border-radius:14px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.mb{width:48px;height:48px;border-radius:12px;border:1px solid var(--slotb);background:var(--slot);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;padding:0}
.mb svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mb span{font-size:9.5px;line-height:1.1;max-width:46px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mb:hover{border-color:var(--accent);color:var(--accent)}

/* dialog + window */
#dlg{left:50%;transform:translateX(-50%);bottom:86px;width:min(580px,calc(100% - 24px));padding:14px 16px 12px;display:flex;gap:14px;align-items:flex-start}
.hidden{display:none !important}
.d-por{width:76px;height:76px;flex:none;border-radius:16px;border:2px solid var(--gold2);display:block;background:radial-gradient(circle at 40% 30%,#f2eeff,#7a68d8)}
.d-body{flex:1;min-width:0}
.d-name{font-weight:600;color:var(--gold);margin-bottom:2px}
.d-text{font-size:14.5px;line-height:1.6;min-height:46px}
.d-act{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}
.win{left:50%;top:50%;transform:translate(-50%,-50%);width:min(540px,calc(100% - 24px));max-height:min(80%,580px);display:flex;flex-direction:column;overflow:hidden;z-index:5}
.win-h{display:flex;align-items:center;justify-content:space-between;padding:10px 12px 10px 16px;border-bottom:1px solid var(--line);font-weight:600;font-size:15px;cursor:move;touch-action:none}
.win-x{border:0;background:none;font-size:24px;color:var(--ink2);cursor:pointer;line-height:1;width:32px;height:32px;border-radius:8px}
.win-x:hover{background:var(--panel2)}
.win-b{padding:12px 16px 16px;overflow:auto;font-size:13.5px}
.w-sec{font-weight:600;color:var(--gold);margin:10px 0 6px;font-size:13px}
.w-sec:first-child{margin-top:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.stat{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;border-radius:9px;background:var(--panel2);border:1px solid var(--line)}
.stat b{font-variant-numeric:tabular-nums}
.rows{display:flex;flex-direction:column;gap:6px}
.row{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:10px;background:var(--panel2);border:1px solid var(--line)}
.row .grow{flex:1;min-width:0}
.row small{color:var(--ink2);display:block;font-size:11.5px}
.dot{width:30px;height:30px;border-radius:8px;flex:none;display:grid;place-items:center;background:var(--c,#888)}
.dot svg{width:17px;height:17px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.inv{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:6px}
.it{aspect-ratio:1;border-radius:10px;background:var(--slot);border:1px solid var(--slotb);position:relative;display:grid;place-items:center}
.it i{width:58%;height:58%;border-radius:50%;background:var(--c);box-shadow:inset -3px -4px 6px rgba(0,0,0,.25),inset 2px 3px 4px rgba(255,255,255,.5)}
.it b{position:absolute;right:5px;bottom:2px;font-size:10.5px;font-weight:600}
.it[title]:hover{border-color:var(--accent)}
.wt{margin-top:10px;font-size:12px;color:var(--ink2)}
.wt .bar{margin-top:4px}
.chk{color:var(--sys)}
.muted{color:var(--ink2);font-size:12.5px}

/* toasts */
#toasts{top:34%;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:9}
.toast{padding:7px 18px;border-radius:20px;background:rgba(12,14,32,.8);color:#fff;font-size:13px;animation:tin .3s ease both,tout .5s ease 2.4s forwards;white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis}
.toast.gold{background:linear-gradient(90deg,#c6912f,#f6dc8c,#c6912f);color:#3a2508;font-weight:600}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
@keyframes tout{to{opacity:0;transform:translateY(-10px)}}

/* compact landscape */
.L.cmp .slot{width:42px;height:42px}
.L.cmp .slot .ic{width:31px;height:31px}
.L.cmp #menu{grid-template-columns:repeat(3,42px)}
.L.cmp .mb{width:42px;height:42px}
.L.cmp .mb span{display:none}

/* portrait */
.P #ui{font-size:13px}
.P #topL{top:8px;left:8px;right:146px;width:auto;gap:6px}
.P #pc{padding:7px 9px 7px 7px;gap:9px}
.P .pc-av{width:50px;height:50px}
.P .pc-name{font-size:14px}
.P .bar{height:11px}
.P .bar span{font-size:9px;line-height:11px}
.P .pc-gold{font-size:11px}
.P #idle{padding:6px 10px}
.P .idle-h{font-size:12px}
.P .tog{width:38px;height:21px}
.P .tog i{width:15px;height:15px}
.P .tog.on i{left:20px}
.P #topR{top:8px;right:8px;width:130px;gap:6px}
.P #tools{gap:4px;flex-wrap:wrap}
.P .ibtn{height:28px;min-width:28px;padding:0 6px}
.P #layoutLbl{display:none}
.P .seg button{padding:3px 8px}
.P #mm{height:76px}
.P #quest{padding:7px 9px;font-size:11.5px}
.P #banner{padding:3px 26px 5px 10px;text-align:left;background:linear-gradient(90deg,rgba(12,14,32,.62) 65%,transparent);border-radius:9px 0 0 9px}
.P .b-name{font-size:19px}
.P .b-sub{font-size:11px}
.P .b-meta{justify-content:flex-start;font-size:10.5px}
.P #hint{font-size:11.5px}
.P #botR{left:0;right:0;bottom:0}
.P #menu{grid-template-columns:repeat(8,1fr);border-radius:16px 16px 0 0;padding:4px 4px 6px;gap:0;border-bottom:0}
.P .mb{width:auto;height:52px;background:none;border:0}
.P .mb span{font-size:9.5px;max-width:100%}
.P #botC{bottom:70px}
.P #hotbar{display:grid;grid-template-columns:repeat(5,44px);gap:5px;padding:6px}
.P .slot{width:44px;height:44px}
.P .slot .ic{width:32px;height:32px}
.P .c-in input{font-size:16px}
.P #dlg{bottom:186px}
.dlg-open #botL{opacity:0;pointer-events:none}
.dlg-open #botL *{pointer-events:none}
@media (prefers-reduced-motion:reduce){.toast{animation:none}}
/* ---- v2 additions ---- */
.pc-name .tier{font-size:10px;font-weight:600;padding:0 6px;border-radius:6px;background:var(--accent);color:#fff;line-height:16px}
.bar.jexp i{background:linear-gradient(#a6f0c6,#2a9e63)}
.bar span em{font-style:normal}
.wallet{display:flex;align-items:center;gap:10px;font-size:11.5px;color:var(--ink2);flex-wrap:wrap;margin-top:1px}
.cur{display:flex;align-items:center;gap:4px}
.cur i{width:11px;height:11px;border-radius:50%;flex:none}
.cur b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.cur.sc i{background:radial-gradient(circle at 35% 35%,#fff6d0,#d9c27a 60%,#8a7330)}
.cur.y i{background:radial-gradient(circle at 35% 35%,#d9fff4,#3fc6a8 60%,#1d6e5c)}
.cur.la i{background:radial-gradient(circle at 35% 35%,#efe9ff,#8a78ff 60%,#4a36b0)}
.cp{margin-left:auto;font-weight:500}
.cp b{color:var(--gold);font-weight:600;font-variant-numeric:tabular-nums}
.idle-status{display:flex;align-items:center;gap:7px;margin-top:7px;padding:5px 9px;border-radius:9px;background:var(--panel2);font-size:12px;line-height:1.35}
.idle-status::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ink2);flex:none}
#idle.on .idle-status{color:var(--sys)}
#idle.on .idle-status::before{background:#3fd6a8;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 5px rgba(63,214,168,.15)}}
.idle-rate{font-size:11.5px;color:var(--ink2);margin-bottom:8px}
#claimBtn{display:none}
#claimBtn.has{display:block}
.P .idle-rows,.P .idle-rate{display:none}
.P #claimBtn.has{margin-top:6px;padding:4px 8px;font-size:11.5px}
.P #topC{top:200px;left:8px;transform:none;align-items:flex-start;max-width:calc(100% - 154px)}
.P .wallet{font-size:10.5px;gap:7px}
.P .bar{height:10px}
.P .bar span{line-height:10px;font-size:8.5px}
#banner{transition:opacity .8s}
.P #banner.away{opacity:0}
/* chat */
#botL{left:12px;bottom:12px;width:360px}
#botL.cm-min{width:auto}
#botL.cm-min #chat{display:none}
#botL:not(.cm-min) #chatPill{display:none}

#chat{display:flex;flex-direction:column;height:232px;overflow:hidden}
.c-head{display:flex;align-items:flex-end;padding:6px 6px 0;gap:4px}

.c-btns{display:flex;gap:2px;padding-bottom:3px}
.cbtn{width:30px;height:26px;border:0;border-radius:7px;background:none;color:var(--ink2);cursor:pointer;display:grid;place-items:center;padding:0}

#botL.cm-full{top:12px;right:12px;bottom:12px;left:12px;width:auto;z-index:30}

.P .chat-pill span{display:none}

/* overlays */
#fade{inset:0;background:#05060d;opacity:0;transition:opacity .35s;pointer-events:none;z-index:40}
#fade.on{opacity:1}
#deathOv{inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:radial-gradient(ellipse at center,rgba(60,0,10,.25),rgba(40,0,8,.75));color:#fff;z-index:35;text-shadow:0 2px 8px rgba(0,0,0,.6);pointer-events:auto}
#deathOv .d1{font-size:30px;font-weight:600;color:#ffb3bd}
#deathOv .d2{font-size:14px;color:#f1d6da}
.w-dev{display:flex;flex-wrap:wrap;gap:6px}
.w-dev .btn{font-size:12.5px}
.btn.danger{color:#d3304a;border-color:rgba(211,48,74,.4)}
/* ---- v3 ---- */
#idle{display:flex;flex-direction:column;gap:8px}
.idle-btn{display:flex;align-items:center;justify-content:center;gap:9px;height:46px;border:0;border-radius:14px;cursor:pointer;color:#fff;font-size:15px;font-weight:600;letter-spacing:.02em;
 background:linear-gradient(110deg,#6e58e8,#3fc6a8);box-shadow:0 8px 22px rgba(80,60,220,.35),inset 0 1px 0 rgba(255,255,255,.35);position:relative;overflow:hidden}
.idle-btn::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);transform:translateX(-100%);animation:shine 2.8s ease-in-out infinite}
@keyframes shine{60%,100%{transform:translateX(100%)}}
.idle-btn:hover{filter:brightness(1.08)}
.idle-btn .ib-play{width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.25);display:grid;place-items:center;font-size:11px}
#idle.town .idle-btn{background:linear-gradient(110deg,#5a5f78,#7b6fb0);box-shadow:var(--shadow);font-size:13.5px}
#idle.town .idle-btn::after{display:none}
#idle.on .idle-btn{cursor:default;background:linear-gradient(110deg,#1f8a6e,#3fc6a8);height:38px;font-size:13.5px}
.ib-dot{width:9px;height:9px;border-radius:50%;background:#d9fff2;animation:pulse 1.2s ease-in-out infinite}
#idlePanel{display:none;padding:9px 12px}
#idle.on #idlePanel{display:block;animation:tin .25s ease}
#idlePanel .idle-status{margin-top:0}
.idle-vip{font-size:11.5px;color:var(--ink2);line-height:1.4;padding:6px 8px;border-radius:8px;border:1px dashed var(--line);margin-top:2px}

.idle-vip.vip::before{content:"VIP ";font-weight:700}
.idle-rule{font-size:10.5px;color:var(--ink2);margin-top:5px;opacity:.8}
.idle-rate:empty{display:none}
.P .idle-btn{height:40px;font-size:13.5px}
.P #idle.on .idle-btn{height:32px}
.P .idle-vip,.P .idle-rule{display:none}
.P #idlePanel{padding:6px 9px}
#mmWrap{padding:0;overflow:hidden}
.mm-head,.q-h{display:flex;align-items:center;justify-content:space-between;gap:6px}
.mm-head{padding:6px 6px 4px 11px}
.mm-name{position:static;font-size:12px;font-weight:600;color:var(--ink);text-shadow:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mm-body{position:relative;padding:0 6px 6px}
#mm{height:128px}
.mmb{width:26px;height:24px;border-radius:7px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0;font-size:15px;line-height:1;flex:none}
.mmb svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
.mmb:disabled{opacity:.4;cursor:default}
#mmWrap.closed .mm-body{display:none}

.mm-home{position:absolute;left:12px;bottom:12px;width:30px;height:30px;background:rgba(18,20,40,.75);color:#fff;border-color:rgba(255,255,255,.25)}
.mm-zoom{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;align-items:center;gap:3px}
.mm-zoom .mmb{width:28px;height:26px;background:rgba(18,20,40,.75);color:#fff;border-color:rgba(255,255,255,.25)}

#quest{padding:8px 9px 9px}

#quest.closed #qBody{display:none}

#qCount{color:var(--ink2);font-weight:500}
#qBody{display:flex;flex-direction:column;gap:5px;max-height:260px;overflow-y:auto}
.ql{display:block;text-align:left;width:100%;border:1px solid var(--line);border-left:3px solid var(--qc);border-radius:8px;background:var(--panel2);color:var(--ink);padding:5px 8px;cursor:pointer;font-size:12px;line-height:1.35}
.ql:hover{border-color:var(--qc)}

.ql .qn{font-weight:600}
.ql .qo{display:block;color:var(--ink2);font-size:11.5px}
.ql.nav{box-shadow:0 0 0 2px var(--qc) inset}
.ql.nav .qn::after{content:" ▶";color:var(--qc);animation:pulse 1.2s infinite}
.qrow{border-left:3px solid var(--qc)}
.btn.sm{padding:4px 9px;font-size:12px}
.P #mm{height:80px}
.P #topR{width:150px}
.P #topL{right:166px}
.P #topC{max-width:calc(100% - 174px)}
.P .mm-zoom span{display:none}
.P .mm-zoom{flex-direction:row;right:10px;bottom:10px}
.P .mm-zoom .mmb,.P .mm-home{width:24px;height:22px}
.P .mm-home{left:10px;bottom:10px}
.P .ql{font-size:11px;padding:4px 6px}
.P .ql .qo{font-size:10.5px}
.P #qBody{max-height:150px}
#idle,.P #idle{padding:0}
.P #topC{top:252px}
/* ---- v3.1 mobile stability ---- */
#errBox{left:50%;top:12px;transform:translateX(-50%);width:min(420px,calc(100% - 24px));padding:10px 12px;display:flex;flex-direction:column;gap:6px;font-size:12.5px;z-index:60}

#errBox div{display:flex;gap:6px;justify-content:flex-end}

}

.idle-btn::after{will-change:transform}

#loader{position:absolute;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(24,16,58,.84),rgba(4,6,16,.95));pointer-events:auto}

.ld-box{width:min(360px,80%);text-align:center;color:#eef0fb}
.ld-title{font-size:18px;font-weight:600;margin-bottom:14px;color:#f3f0ff}

.P .net{font-size:10px;gap:3px 6px;padding:5px 6px}

.ii{position:relative;aspect-ratio:1;border-radius:9px;border:2px solid var(--rc,var(--line));background:var(--slot);display:grid;place-items:center;cursor:pointer;padding:0;color:var(--ink)}

.det-desc{margin:6px 0;color:var(--ink)}
.det-stats{display:flex;flex-direction:column;gap:2px;padding:6px 8px;border-radius:8px;background:rgba(0,0,0,.18);border:1px solid var(--line)}

.det-req{margin:6px 0;display:flex;flex-direction:column;gap:2px;font-size:12px}
.det-req .ok{color:#7af0a0}
.det-req .no{color:#ff8a8a}

.qty{display:flex;align-items:center;gap:6px;margin:6px 0}
.qty button{min-width:30px;height:28px;padding:0 8px;border-radius:7px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);cursor:pointer;font:inherit}
.qty b{min-width:34px;text-align:center}
.det-btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.det-btns .btn.danger{color:#d3304a}
.eq-btns{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.P .inv-body{grid-template-columns:1fr}
.P .inv-grid{grid-template-columns:repeat(6,1fr);max-height:240px}
/* theme-aware "good" text colour for stat lines */
:root{--good:#1f8f55;--ny:#b57a00;--nr:#cf3550}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--good:#7af0a0;--ny:#f2c455;--nr:#ff8a9c}}
:root[data-theme="dark"]{--good:#7af0a0;--ny:#f2c455;--nr:#ff8a9c}
.det-stats{background:rgba(120,120,160,.12)}
.det-stats div,.det-req .ok,.eq-detail span[style*="7af0a0"]{color:var(--good) !important}
.det-req .no{color:#c0364a}
.ii-st{font-size:8.5px}
.eqs .cs{font-size:7.5px;left:2px;right:auto;top:auto;bottom:2px;color:#fff;text-shadow:0 1px 1px #000;width:auto;height:auto;background:none;border:0;letter-spacing:-.5px}
/* ---- v8 item artwork ---- */

.det-top{display:flex;gap:10px;align-items:center;margin-bottom:4px}

.ic svg{width:30px;height:30px}

.dot.art svg{width:32px;height:32px;display:block}
/* ---- v9 tiers + bare stars ---- */
.ii-st{position:absolute;left:0;right:0;top:auto;bottom:0;text-align:center;font-size:14px;line-height:1;letter-spacing:0;color:var(--sc,#fff);text-shadow:0 0 2px #000,0 0 3px #000,0 1px 0 #000;font-weight:700;pointer-events:none}
.det-meta .stars{font-size:17px;letter-spacing:2px;text-shadow:0 0 2px #000,0 1px 0 #000}
.eqs .cs{font-size:13px;color:var(--sc,#fff);text-shadow:0 0 2px #000,0 1px 0 #000;letter-spacing:0;font-weight:700;left:50%;transform:translateX(-50%);bottom:1px;line-height:1}
.eqs .cs{width:auto}
.eqs .lvt{font-size:10px}
/* ---- v10 rolls, sets, abilities ---- */
.det-stats div.ab{color:#c9a0ff}
.det-set{margin-top:6px;font-size:12px;color:var(--ink2);line-height:1.45}
.det-set b{color:var(--gold2)}
/* ---- v11 compare + multi-select ---- */
.cmp{margin-top:8px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:rgba(120,120,160,.10)}
.cmp-h{font-weight:600;font-size:12.5px;color:var(--gold2);margin-bottom:2px}
.cmp-with{font-size:11.5px;margin-bottom:4px}
.cmp-row{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:baseline;padding:2px 0;font-size:12px;font-variant-numeric:tabular-nums}
.cmp-row .cv{color:var(--ink2)}
.cmp-row b{min-width:58px;text-align:right}
.cmp-row.up b{color:#1f8f55}
.cmp-row.down b{color:#c0364a}
:root:not([data-theme="light"]) .cmp-row.up b{color:#7af0a0}
.ii.pick{box-shadow:0 0 0 3px #2fbf8a inset,0 0 0 1px #0a3d2a}
.ii.pick::after{content:"✓";position:absolute;left:2px;top:1px;width:17px;height:17px;border-radius:50%;background:#2fbf8a;color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;line-height:1;text-shadow:none}
.inv-multi{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 8px;padding:8px 10px;border-radius:10px;background:rgba(47,191,138,.14);border:1px solid rgba(47,191,138,.45);font-size:12.5px}
/* ---- v12: refine +N moves to the top-right corner, away from the stars ---- */
.ii-rf{left:auto;right:3px;top:2px;bottom:auto;text-align:right}
.eqs .rf{left:auto;right:3px;top:2px;bottom:auto}
.auto-left{margin:4px 0 2px;font-size:11.5px}
/* ---- v14 login / register / guest ---- */
#auth{position:fixed;inset:0;z-index:300;overflow:auto;display:flex;
 padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));
 background:radial-gradient(120% 90% at 50% -10%,#2f2480 0%,#171c4a 42%,#070a1c 100%);color:#eef0fb;
 font-family:Kanit,"Noto Sans Thai",Tahoma,system-ui,sans-serif;-webkit-user-select:text;user-select:text}
#auth.hidden{display:none !important}
.au-bg{position:fixed;inset:0;overflow:hidden;pointer-events:none}
.au-bg i{position:absolute;width:var(--s,60px);height:calc(var(--s,60px)*1.5);left:var(--x);top:var(--y);opacity:.5;
 background:linear-gradient(150deg,rgba(255,255,255,.75),rgba(150,130,255,.35) 45%,rgba(70,50,170,.5));
 clip-path:polygon(50% 0,100% 30%,50% 100%,0 30%);animation:auFloat var(--d,9s) ease-in-out infinite;animation-delay:var(--t,0s)}
.au-bg i:nth-child(1){--x:6%;--y:12%;--s:46px;--d:8s}
.au-bg i:nth-child(2){--x:88%;--y:18%;--s:70px;--d:11s;--t:-3s}
.au-bg i:nth-child(3){--x:14%;--y:70%;--s:84px;--d:12s;--t:-5s;opacity:.32}
.au-bg i:nth-child(4){--x:80%;--y:74%;--s:52px;--d:9s;--t:-2s}
.au-bg i:nth-child(5){--x:46%;--y:4%;--s:30px;--d:7s;--t:-4s;opacity:.35}
.au-bg i:nth-child(6){--x:74%;--y:82%;--s:38px;--d:10s;--t:-6s;opacity:.4}
@keyframes auFloat{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-22px) rotate(7deg)}}
.au-wrap{position:relative;width:min(440px,100%);display:flex;flex-direction:column;gap:12px;margin:auto}
.au-top{display:flex;justify-content:flex-end}
.au-lang{display:flex;background:rgba(0,0,0,.35);border:1px solid rgba(170,160,255,.25);border-radius:10px;padding:2px}
.au-lang button{border:0;background:none;color:#b8bde0;font:inherit;font-size:13px;font-weight:500;padding:4px 12px;border-radius:8px;cursor:pointer;min-height:30px}

.au-brand{text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px}

@keyframes auPulse{50%{filter:drop-shadow(0 0 26px rgba(190,170,255,1));transform:translateY(-3px)}}

.au-brand small{font-size:12px;color:#e9c46a;letter-spacing:.03em}

.au-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:rgba(0,0,0,.32);padding:4px;border-radius:13px;margin-bottom:4px}
.au-tabs button{border:0;background:none;color:#b8bde0;font:inherit;font-size:14px;font-weight:500;min-height:42px;border-radius:10px;cursor:pointer}
.au-tabs button.on{background:linear-gradient(120deg,#6e58e8,#4a7ae0);color:#fff;box-shadow:0 4px 14px rgba(90,80,230,.45)}
.au-f{display:flex;flex-direction:column;gap:5px;margin-top:12px}
.au-f label{font-size:13px;color:#cfd3f4;font-weight:500}
.au-f small{font-size:11.5px;color:#9aa0cc}
#auth input[type=text],#auth input[type=password]{width:100%;box-sizing:border-box;height:46px;border-radius:11px;border:1px solid rgba(170,160,255,.35);background:#0d1130;color:#fff;font:inherit;font-size:16px;padding:0 13px;outline:none}
#auth input:focus{border-color:#8f7ef0;box-shadow:0 0 0 3px rgba(143,126,240,.28)}
.au-pw{position:relative}
.au-pw input{padding-right:70px !important}
.au-eye{position:absolute;right:5px;top:5px;height:36px;min-width:58px;border:0;border-radius:8px;background:rgba(255,255,255,.08);color:#cfd3f4;font:inherit;font-size:12.5px;cursor:pointer}
.au-str{display:grid;grid-template-columns:repeat(4,1fr) auto;gap:4px;align-items:center;margin-top:2px}
.au-str i{height:5px;border-radius:3px;background:rgba(255,255,255,.14)}

.au-str.s1 i:nth-child(-n+1){background:#e8475f}.au-str.s2 i:nth-child(-n+2){background:#f0a030}
.au-str.s3 i:nth-child(-n+3){background:#6fd37a}.au-str.s4 i:nth-child(-n+4){background:#3fc6a8}
.au-chk{display:flex;gap:10px;align-items:flex-start;margin-top:13px;font-size:13.5px;color:#dfe2fa;cursor:pointer}
.au-chk input{width:20px;height:20px;margin:1px 0 0;accent-color:#6e58e8;flex:none}
.au-chk small{color:#e9c46a;font-size:11.5px}
.au-go{width:100%;height:50px;margin-top:16px;border:0;border-radius:13px;cursor:pointer;color:#fff;font:inherit;font-size:16px;font-weight:600;
 background:linear-gradient(110deg,#6e58e8,#3fc6a8);box-shadow:0 8px 22px rgba(80,70,230,.4),inset 0 1px 0 rgba(255,255,255,.3)}
.au-go.alt{background:linear-gradient(110deg,#c98a2a,#e9c46a);color:#2f1d02;box-shadow:0 8px 22px rgba(200,150,40,.35),inset 0 1px 0 rgba(255,255,255,.4)}
.au-go:hover{filter:brightness(1.08)}.au-go:disabled{opacity:.6;cursor:wait}

.au-text{margin:12px 0 0;font-size:13.5px;line-height:1.55;color:#dfe2fa}
.au-found{margin:10px 0 0;padding:8px 10px;border-radius:9px;background:rgba(233,196,106,.12);border:1px dashed rgba(233,196,106,.55);font-size:12.5px;color:#f3dca0}
.au-err{margin-top:12px;padding:9px 11px;border-radius:10px;background:rgba(232,71,95,.16);border:1px solid rgba(232,71,95,.5);color:#ffc2cb;font-size:13px;line-height:1.45}

@media (max-width:420px){.au-brand h1{font-size:24px}.au-card{padding:14px 13px 16px}}

/* ================= v15 window system: navy frame + periwinkle (after the character-info reference) =================
   Surfaces:  --nv1 frame/body  --nv2 raised  --nv3 buttons-dark   Accent: --pv periwinkle (active)   Neutral: --wh off-white (idle)
   Muted accents by job: gold = level/reward, mint = gain, rose = loss. Always dark, whatever the page theme. */
.win,#dlg{--nv0:#0a0f3a;--nv1:#101a5c;--nv2:#1a2780;--nv3:#2b3a9a;--pv:#7c88d8;--pv2:#aab4f0;--wh:#f2f4ff;--navy-ink:#13206f;
 --panel:#111a5e;--panel2:rgba(96,112,214,.24);--ink:#eef0ff;--ink2:#aab4ea;--line:rgba(150,165,240,.3);--slot:#16217a;--slotb:rgba(150,165,240,.4);
 --accent:#7c88d8;--gold:#e8cb78;--gold2:#f6e1a0;--sys:#7ae6ac;--good:#7ae6ac;--bad:#f2909c;color:var(--ink)}
.win{width:min(480px,calc(100% - 20px));max-height:min(94%,760px);padding:10px;border-radius:20px;border:2px solid rgba(124,136,216,.6);
 background:linear-gradient(180deg,#16227a 0%,#0f1860 55%,#0a1042 100%);box-shadow:0 18px 50px rgba(0,0,22,.62),inset 0 0 0 1px rgba(255,255,255,.07);
 -webkit-backdrop-filter:none;backdrop-filter:none}
.win.invwin{width:min(780px,calc(100% - 20px))}
.win-h{margin:0 0 10px;padding:6px 8px 6px 16px;border:0;border-radius:14px;background:linear-gradient(180deg,#8a95e2,#7480d0);color:#fff;font-size:21px;font-weight:700;letter-spacing:.01em;
 text-shadow:0 1px 0 rgba(20,30,120,.4);box-shadow:0 2px 0 rgba(8,12,64,.5),inset 0 1px 0 rgba(255,255,255,.35)}
.win-x{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.24);color:#fff;font-size:22px;display:grid;place-items:center;padding:0}
.win-x:hover{background:rgba(255,255,255,.38)}
.win-b{padding:12px;border-radius:16px;background:rgba(6,10,52,.55);border:1px solid rgba(124,136,216,.32);flex:1 1 auto;min-height:0}
.win-nav{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px;flex:none}
.win-nav.hidden{display:none !important}
.wn{display:flex;align-items:center;justify-content:center;gap:7px;height:50px;border:0;border-radius:14px;background:linear-gradient(180deg,#34449f,#26358f);color:#fff;font:inherit;font-size:16px;font-weight:700;
 letter-spacing:.03em;text-transform:uppercase;cursor:pointer;box-shadow:0 2px 0 rgba(8,12,64,.55),inset 0 1px 0 rgba(255,255,255,.16)}
.wn:hover{filter:brightness(1.1)}
.wn.on{background:linear-gradient(180deg,#8a95e2,#6f7bd0)}
.wni svg{width:24px;height:24px;display:block;stroke:currentColor;fill:none;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.wn-status .wni{color:#7ee0a8}.wn-skill .wni{color:#f09ac0}.wn-inv .wni{color:#b9c1ff}.wn.on .wni{color:#fff}
/* buttons: periwinkle = main, off-white = neutral */
.win .btn{border:0;border-radius:12px;background:var(--wh);color:var(--navy-ink);font-weight:600;padding:7px 14px;box-shadow:0 2px 0 rgba(8,12,64,.5)}
.win .btn:hover{filter:brightness(1.06)}
.win .btn.pri{background:var(--pv);color:#fff;text-shadow:0 1px 0 rgba(20,30,120,.3)}
.win .btn.gold,.win .btn.gold.sm{background:linear-gradient(#f3dd98,#d9b04a);color:#3a2a06}
.win .btn.danger{background:#f7d9de;color:#8a1d2e}
.win .btn:disabled{opacity:.45;box-shadow:none}
.win .btn.sm{padding:5px 11px;font-size:12px}
.win .seg{background:none;border:0;box-shadow:none;padding:0;gap:6px;flex-wrap:wrap}
.win .seg button{border-radius:12px;background:var(--wh);color:var(--navy-ink);padding:6px 14px;font-weight:600;font-size:13px;box-shadow:0 2px 0 rgba(8,12,64,.5)}
.win .seg button.on{background:var(--pv);color:#fff}
.win .tog{background:rgba(255,255,255,.22)}
.win .tog.on{background:linear-gradient(90deg,#7c88d8,#5fcfae)}
/* section bars, rows, tiles */
.win .w-sec{display:block;margin:14px 0 8px;padding:5px 12px;border-radius:11px;background:linear-gradient(90deg,#7c88d8,rgba(124,136,216,.22));color:#fff;font-size:13.5px;font-weight:600;border-top:0}
.win .w-sec:first-child{margin-top:0}
.win .w-sec .muted{color:rgba(255,255,255,.82)}
.win .w-sec.sub{padding-top:5px;background:linear-gradient(90deg,#3a4cb0,rgba(58,76,176,.2));color:#fff}
.win .row{background:rgba(96,112,214,.2);border:1px solid rgba(150,165,240,.3);border-radius:12px}
.win .stat{background:rgba(96,112,214,.22);border-color:rgba(150,165,240,.3)}
.win .muted{color:var(--ink2)}
.win .det-stats div,.win .det-req .ok,.win .eq-good,.win .cmp-row.up b{color:var(--good) !important}
.win .det-req .no,.win .cmp-row.down b{color:var(--bad) !important}
.win .det-stats div.ab{color:#c9b6ff !important}
.win .det-stats{background:rgba(255,255,255,.06)}
.win .cmp{background:rgba(255,255,255,.05)}
.win .inv-multi{background:rgba(95,207,174,.14);border-color:rgba(95,207,174,.45)}
/* ---- character info ---- */
.chr-name{display:flex;align-items:center;gap:10px;padding:6px 10px;margin-bottom:10px;border-radius:14px;background:linear-gradient(180deg,#3d4fb2,#2c3b9c);box-shadow:0 2px 0 rgba(8,12,64,.5),inset 0 1px 0 rgba(255,255,255,.18)}

.ptrs{display:flex;gap:5px;flex:none}
.ptrs .ptr{width:34px;height:34px;border-radius:50%;border-width:2px}
.ptrs .ptr.lock svg{width:15px;height:15px}
.ptrs .ptr .phb{display:none}
.chr-tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.chr-tabs button{height:44px;border:0;border-radius:14px;font:inherit;font-size:20px;font-weight:700;cursor:pointer;background:var(--wh);color:var(--navy-ink);box-shadow:0 2px 0 rgba(8,12,64,.5)}
.chr-tabs button.on{background:var(--pv);color:#fff;text-shadow:0 1px 0 rgba(20,30,120,.3)}
.chr-panel{padding:10px;border-radius:16px;background:rgba(5,9,48,.55);border:1px solid rgba(124,136,216,.3)}
.eq-board{display:grid;grid-template-columns:72px minmax(0,1fr) 72px;grid-template-rows:repeat(5,72px);gap:8px}
.eq-board .eqs{width:auto;height:auto;border-radius:12px;box-shadow:0 2px 0 rgba(8,12,64,.5)}
.eqs.empty{background:linear-gradient(180deg,#8b96e3,#7480d0);border:0;color:var(--navy-ink)}
.eqs.empty .eql{font-size:12.5px;font-weight:600;line-height:1.2;text-align:center;padding:0 4px}
.eqs.empty:hover{filter:brightness(1.07)}
.eqs.sel{box-shadow:0 0 0 3px #fff,0 0 14px rgba(190,200,255,.7)}
.eqs .rf{left:auto;right:4px;top:2px;bottom:auto;color:#ffe9a0}
.eqs .cs{position:absolute;left:0;right:0;bottom:1px;top:auto;transform:none;text-align:center;font-size:12px;line-height:1;color:var(--sc,#fff);text-shadow:0 0 2px #000,0 1px 0 #000;background:none;border:0;width:auto;height:auto;letter-spacing:0;font-weight:700}
.eq-doll{position:relative;display:grid;place-items:center;min-width:0}
.eq-doll canvas{width:100%;max-width:240px;max-height:100%;aspect-ratio:260/340;display:block}
.style-btn{left:auto;right:2px;bottom:4px;transform:none;width:38px;height:38px;border:0;background:var(--wh);color:var(--navy-ink);box-shadow:0 2px 0 rgba(8,12,64,.5)}
.eq-cpbox{display:flex;flex-direction:column;min-width:0;border-radius:10px;overflow:hidden;box-shadow:0 2px 0 rgba(8,12,64,.5)}
.cp-l{background:var(--nv3);color:#fff;font-size:12px;font-weight:600;text-align:center;padding:3px 4px;white-space:nowrap}
.cp-v{flex:1;display:grid;place-items:center;background:#fff;color:#a8161f;font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.eq-row.quick{display:flex;justify-content:flex-start;gap:8px;margin-top:10px}
.qk{width:46px;height:46px;border-radius:11px;background:rgba(120,134,222,.26);border:1px solid rgba(150,165,240,.35)}
.eq-detail{margin-top:8px;padding:8px 10px;min-height:56px;border-radius:11px;background:rgba(255,255,255,.06);border:1px solid rgba(150,165,240,.28);font-size:12.5px;line-height:1.5}
.cos{display:flex;flex-direction:column;align-items:center;gap:10px}
.cos .eq-doll{width:100%;height:330px}
.cos-soon{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 14px;border-radius:12px;background:rgba(255,255,255,.07);text-align:center}
.cos-soon svg{width:22px;height:22px;stroke:var(--pv2);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cos-soon span{color:var(--ink2);font-size:12.5px}
.st-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.st-top>b{flex:1;text-align:center;font-size:18px;letter-spacing:.03em;text-transform:uppercase;color:#fff}
.st-panel .rec-row{border-bottom-color:rgba(150,165,240,.3)}
.st-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 8px}
.st-grid .stile{background:linear-gradient(#4b5cc0,#3646a8);border:0;box-shadow:0 2px 0 rgba(8,12,64,.5)}
.st-grid .stile.tot{grid-column:1/-1;background:linear-gradient(#4a4f86,#363a70);display:flex;justify-content:space-between;align-items:center;text-align:left;padding:6px 12px}
.st-grid .stile.tot .sn{display:inline}
.xp{background:#050830;border-color:rgba(150,165,240,.3)}
.xp i{background:linear-gradient(#f0d98e,#cfa64a)}
.xp.job i{background:linear-gradient(#9fe3c0,#3fa57c)}
.cls-name em,.cls-head svg{color:var(--gold2)}
.cls-head svg{color:#b9c1ff}
/* NPC dialog follows the same frame */
#dlg.panel{background:linear-gradient(180deg,#16227a,#0e1658);border:2px solid rgba(124,136,216,.6);border-radius:18px;-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:0 14px 40px rgba(0,0,22,.55)}
#dlg .d-name{display:inline-block;margin-bottom:5px;padding:2px 14px;border-radius:10px;background:var(--pv);color:#fff;font-weight:700}
#dlg .d-text{color:var(--ink)}
#dlg .btn{border:0;border-radius:12px;background:var(--pv);color:#fff;box-shadow:0 2px 0 rgba(8,12,64,.5)}
.d-por{border-color:var(--pv2)}
/* phones */
.P .win{width:calc(100% - 12px);max-height:94%;padding:8px}
.P .win-h{font-size:19px;margin-bottom:8px}
.P .win-b{padding:9px}
.P .chr-name>b{font-size:16px}
.P .chr-tabs button{height:40px;font-size:17px}
.P .eq-board{grid-template-columns:62px minmax(0,1fr) 62px;grid-template-rows:repeat(5,62px);gap:6px}
.P .eqs.empty .eql{font-size:11px}
.P .cp-v{font-size:24px}
.P .wn{height:46px;font-size:14px}
.P .wni svg{width:21px;height:21px}
.P .eq-doll canvas{max-width:190px}
/* v15 spacing pass */
.win{max-height:min(96%,800px)}
.eq-board{grid-template-rows:repeat(5,66px);grid-template-columns:68px minmax(0,1fr) 68px}
.eq-row.quick{margin-top:8px}
.qk{width:40px;height:40px}
.qk .eqi.art svg{width:30px;height:30px}
.eq-detail{min-height:48px;margin-top:6px;padding:7px 10px}
.P .eq-board{grid-template-rows:repeat(5,58px);grid-template-columns:58px minmax(0,1fr) 58px;gap:5px}
/* v15 tighter vertical rhythm */
.win-h{margin-bottom:8px}
.chr-name{margin-bottom:8px;padding:5px 10px}
.chr-tabs{margin-bottom:8px}
.chr-tabs button{height:40px;font-size:19px}
.chr-panel{padding:8px}
.eq-board{grid-template-rows:repeat(5,64px)}

/* ================= v17: windows (3 at once, fixed sizes), HUD islands, monster panel, idle toggle ================= */
#wins{position:absolute;inset:0;display:flex;justify-content:center;align-items:center;gap:12px;padding:10px;pointer-events:none;z-index:6}
#wins.hidden{display:none !important}
#wins .win{pointer-events:auto;position:relative;left:auto;top:auto;transform:none;flex:0 1 auto;min-width:300px;display:flex;flex-direction:column;min-height:0;max-height:100%;
 width:var(--wiw,480px);height:var(--wih,auto);padding:8px;overflow:hidden;border-radius:18px;z-index:1}
#wins .win.hidden{display:none !important}
#wins .win[data-w=itemdet]{z-index:3}
#wins .win-h{margin:0 0 8px;flex:none;cursor:move}
#wins .win-b{flex:1 1 auto;min-height:0;overflow:auto;overscroll-behavior:contain}
#wins .win-nav{flex:none;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;margin-top:8px}
#wins .win-nav.hidden{display:none !important}
#wins .wn{flex-direction:column;height:44px;gap:1px;font-size:10.5px;letter-spacing:.02em;padding:0 2px;min-width:0}
#wins .wn b{font-weight:700;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#wins .wni svg{width:19px;height:19px}
.wn-ic{}
.win[data-w=char]{--wiw:480px;--wih:700px;zoom:.8}   /* 20% smaller than before */
.win[data-w=status]{--wiw:480px;--wih:560px}
.win[data-w=inv]{--wiw:640px;--wih:520px}
.win[data-w=itemdet]{--wiw:320px;--wih:520px}
.win[data-w=skill],.win[data-w=quest],.win[data-w=archpick]{--wiw:480px;--wih:560px}
.win[data-w=party],.win[data-w=guild]{--wiw:440px;--wih:420px}
.win[data-w=shop]{--wiw:460px;--wih:480px}
.win[data-w=set]{--wiw:520px;--wih:540px}
.win[data-w=worldmap]{--wiw:640px;--wih:500px}
.win[data-w=mapinfo]{--wiw:420px;--wih:500px}
.win[data-w=idlesum]{--wiw:400px;--wih:480px}
.win[data-w=idleset]{--wiw:450px;--wih:520px}
.win[data-w=idlerew]{--wiw:440px;--wih:460px}
.cmp #wins.three .win[data-w=itemdet]{position:absolute;right:10px;top:50%;transform:translateY(-50%)}   /* only on narrow screens the detail floats over the right edge */
/* phones: windows stack in one scrolling column, always above the menu bar */
.P #wins{inset:6px 6px 70px 6px;flex-direction:column;justify-content:flex-start;align-items:stretch;overflow-y:auto;overflow-x:hidden;gap:8px;padding:0;-webkit-overflow-scrolling:touch}
.P #wins .win{width:100%;height:min(var(--wih,auto),calc(var(--sh,800px) - 84px));max-height:none;padding:7px}
.P #wins.pair .win{height:auto;min-height:0}
.P #wins .win[data-w=char]{height:auto}
.P #wins .win-h{cursor:default}
.P #wins .win[data-w=itemdet]{position:fixed;left:50%;top:46%;transform:translate(-50%,-50%);width:min(340px,calc(100% - 20px));height:min(62vh,470px);z-index:9;box-shadow:0 0 0 100vmax rgba(4,6,30,.55),0 18px 50px rgba(0,0,22,.6)}
.P #wins.three .win[data-w=itemdet]{right:auto;top:46%}
.P #wins .wn{height:42px;font-size:10px}

/* ---- map name shows only when entering a map ---- */
#banner{transition:opacity .8s,visibility 0s}
#banner.away{opacity:0;visibility:hidden;transition:opacity .8s,visibility 0s .8s}
#topC{transition:transform .35s ease}
#topC.down{transform:translate(-50%,60px)}
.P #topC.down{transform:translateY(60px)}

/* ---- monster panel (top centre) ---- */
#mobBar{width:min(430px,62vw);padding:7px 12px 9px;border-radius:14px;background:linear-gradient(180deg,rgba(20,28,84,.93),rgba(10,14,48,.95));border:1.5px solid rgba(150,165,240,.5);box-shadow:0 6px 22px rgba(0,0,30,.5);color:#eef0ff;pointer-events:none}
#mobBar.hidden{display:none !important}
.mo-l1{display:flex;align-items:center;gap:7px;margin-bottom:5px;flex-wrap:wrap}
.mo-name{font-size:15.5px;font-weight:700;letter-spacing:.01em}
.mo-lv{font-size:12px;font-weight:700;padding:1px 8px;border-radius:9px;background:rgba(255,255,255,.14);color:#dfe4ff}
.mo-el{--ec:#ccc;font-size:11.5px;font-weight:700;color:var(--ec);padding:1px 8px;border-radius:9px;border:1px solid var(--ec);background:rgba(0,0,0,.28)}
.mo-tag{font-size:11.5px;font-weight:800;color:#ffd76a;letter-spacing:.03em}
.mo-hp{position:relative;height:21px;border-radius:11px;background:rgba(255,255,255,.14)}
.mo-hp i{position:absolute;left:0;top:0;bottom:0;border-radius:11px}
.mo-trail{background:linear-gradient(#fff,#ffc0c0);opacity:.92}
.mo-fill{background:linear-gradient(#ff8a7a,#d0343c);transition:width .08s linear}
#mobBar.elite .mo-fill{background:linear-gradient(#ffe08a,#d99a2a)}
#mobBar.boss{width:min(540px,72vw);border-color:rgba(255,150,176,.75);box-shadow:0 6px 26px rgba(210,42,90,.4)}
#mobBar.boss .mo-fill{background:linear-gradient(#ff9ab8,#d22a5a)}
.mo-t{position:absolute;inset:0;display:grid;place-items:center;font-size:12.5px;font-weight:800;font-variant-numeric:tabular-nums;text-shadow:0 1px 2px #000,0 0 3px #000;z-index:2}
.mo-dmg{position:absolute;inset:0;pointer-events:none;z-index:3}
.mo-d{position:absolute;top:-5px;font-size:16px;font-weight:800;color:#ffe08a;text-shadow:0 0 3px #000,0 1px 0 #000;animation:moDmg .95s ease-out forwards}
@keyframes moDmg{0%{opacity:0;transform:translate(calc(-50% + var(--dx,0px)),6px) scale(.7)}15%{opacity:1;transform:translate(calc(-50% + var(--dx,0px)),-6px) scale(1.2)}100%{opacity:0;transform:translate(calc(-50% + var(--dx,0px)),-32px) scale(1)}}
#mobBar.hit .mo-hp{animation:moHit .22s}
@keyframes moHit{35%{box-shadow:0 0 0 2px rgba(255,255,255,.85)}}
.mo-warn{text-align:center;font-weight:700;color:#ffb09a;font-size:12.5px}
.mo-warn.on{margin-top:5px;animation:bbblink .5s steps(2) infinite}
.P #mobBar{width:100%;padding:6px 9px 8px}
.P .mo-name{font-size:14px}

/* ---- announcement ---- */
#announce{top:10px;left:50%;transform:translate(-50%,-24px);opacity:0;display:flex;align-items:center;gap:10px;max-width:min(740px,92%);padding:9px 20px 9px 12px;border-radius:999px;
 background:linear-gradient(90deg,#7a1f3a,#b8581f 55%,#e0a23a);color:#fff;box-shadow:0 8px 30px rgba(120,30,40,.55),0 0 0 2px rgba(255,230,160,.55);z-index:20;pointer-events:none;transition:opacity .35s,transform .35s}
#announce.hidden{display:none !important}
#announce.on{opacity:1;transform:translate(-50%,0)}
#announce.gm{background:linear-gradient(90deg,#1f3a8a,#4a58e0 55%,#8a7af0);box-shadow:0 8px 30px rgba(40,50,160,.55),0 0 0 2px rgba(190,200,255,.55)}
.an-ic svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block}
.an-tag{font-size:11.5px;font-weight:800;letter-spacing:.05em;padding:2px 9px;border-radius:999px;background:rgba(0,0,0,.3);white-space:nowrap}
.an-txt{font-size:14px;font-weight:600;line-height:1.3}
.P #announce{top:6px;padding:7px 14px 7px 10px;max-width:calc(100% - 12px)}
.P .an-txt{font-size:12.5px}

/* ---- status islands (top right) ---- */
#netBar.panel{background:none;border:0;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;padding:0;display:flex;flex-wrap:wrap;gap:5px;justify-content:flex-end}
.isl{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 10px 0 8px;border-radius:13px;font-size:12px;font-weight:700;color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.28);white-space:nowrap;font-variant-numeric:tabular-nums;pointer-events:auto}
.isl svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.isl em{font-style:normal;font-weight:500;opacity:.85;font-size:10.5px}
.isl.g{background:#1f8a63}.isl.y{background:#b8851f}.isl.r{background:#b8324a}.isl.n{background:#5a5f78}
.isl.clk{background:#454c9a}.isl.onl{background:#1d8a98}.isl.mp{background:#7a4ab8}
.P .isl{height:22px;padding:0 7px 0 6px;font-size:10.5px;gap:4px}.P .isl svg{width:12px;height:12px}.P .isl em{display:none}

/* ---- bottom: hotbar + idle toggle (separate) ---- */
#botC{bottom:12px;left:50%;transform:translateX(-50%);display:flex;align-items:flex-end;gap:12px}
#idleDock{position:relative;display:flex;flex-direction:column;align-items:stretch;gap:6px;pointer-events:none}
#idleDock .id-row{display:flex;gap:6px;align-items:stretch;pointer-events:auto}
#idleDock .idle-btn{height:60px;min-width:140px;padding:0 18px 0 10px;display:flex;align-items:center;gap:10px;border:0;border-radius:16px;color:#fff;cursor:pointer;font:inherit;position:relative;overflow:hidden;
 background:linear-gradient(110deg,#6e58e8,#3fc6a8);box-shadow:0 6px 18px rgba(80,70,230,.5),inset 0 1px 0 rgba(255,255,255,.38)}
#idleDock .idle-btn::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);transform:translateX(-100%);animation:shine 2.8s ease-in-out infinite}
#idleDock .ib-play{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.26);display:grid;place-items:center;font-size:15px;flex:none}
#idleDock .ib-txt{display:flex;flex-direction:column;text-align:left;line-height:1.12;position:relative;z-index:1}
#idleDock .ib-txt b{font-size:19px;font-weight:700;letter-spacing:.01em}
#idleDock .ib-txt em{font-style:normal;font-size:10.5px;opacity:.92;font-weight:500;font-variant-numeric:tabular-nums}
#idleDock.on .idle-btn{background:linear-gradient(110deg,#1b7f66,#3fd6a8);box-shadow:0 0 0 3px rgba(63,214,168,.38),0 6px 18px rgba(30,150,110,.5)}
#idleDock.on .idle-btn::after{animation:none;display:none}
.ib-ring{width:36px;height:36px;border-radius:50%;border:3px solid rgba(255,255,255,.35);border-top-color:#fff;animation:idSpin 1s linear infinite;flex:none}
@keyframes idSpin{to{transform:rotate(360deg)}}
#idleDock.wait .idle-btn{background:linear-gradient(110deg,#b8851f,#e0b04a);color:#2f1d02}
#idleDock.town .idle-btn{background:linear-gradient(110deg,#5a5f9a,#7b6fb0)}
#idleDock .idle-btn:hover{filter:brightness(1.08)}
.idle-cfg{width:42px;border-radius:14px;background:var(--panel);color:var(--ink);cursor:pointer;border:1px solid var(--line);box-shadow:var(--shadow);display:grid;place-items:center;padding:0}
.idle-cfg svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.idle-cfg:hover{color:var(--accent);border-color:var(--accent)}
#claimBtn{display:none;pointer-events:auto}
#claimBtn.has{display:block;width:100%;padding:5px 8px;font-size:11.5px}
.cmp #botC{left:128px;transform:none}
.cmp #hotbar .slot{width:40px;height:40px}.cmp #hotbar .slot .ic{width:30px;height:30px}
.cmp #idleDock .idle-btn{min-width:118px}
.P #botC{bottom:70px;left:auto;right:8px;transform:none;gap:8px}
.P #idleDock .id-row{flex-direction:column}
.P #idleDock .idle-btn{min-width:100px;height:62px;padding:0 10px 0 8px;gap:7px}
.P #idleDock .ib-txt b{font-size:16.5px}.P #idleDock .ib-play,.P .ib-ring{width:30px;height:30px}
.P .idle-cfg{width:100%;height:34px}
.P #botL.cm-min{bottom:182px}

/* ---- menu: collapsible in landscape ---- */
#botR{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.menu-tog{display:flex;align-items:center;gap:5px;height:26px;padding:0 9px;border-radius:13px;border:1px solid var(--line);background:var(--panel);color:var(--ink2);cursor:pointer;font:inherit;font-size:11.5px;pointer-events:auto;box-shadow:var(--shadow)}
.menu-tog svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.menu-tog:hover{color:var(--accent);border-color:var(--accent)}
#botR.menu-off #menu{display:none}
.P .menu-tog{display:none}.P #botR.menu-off #menu{display:grid}

/* ---- inventory: fixed size, 50 cells per page ---- */
.inv-fix{height:100%;display:flex;flex-direction:column;gap:7px;min-height:0}
.inv-top{margin:0}
.inv-bar{display:flex;align-items:center;gap:6px;flex:none}
.inv-bar .grow{flex:1}
.inv-cap{font-size:12.5px;color:var(--ink2);font-weight:600}.inv-cap.full{color:var(--bad)}
.inv-fix .inv-grid{flex:1;min-height:0;max-height:none;display:grid;grid-template-columns:repeat(10,1fr);gap:5px;align-content:start;overflow:auto;padding:0 2px 2px}
.inv-fix .ii{aspect-ratio:1}
.inv-fix .ii-ic svg{width:70%;height:70%}
.inv-pager{flex:none;display:flex;justify-content:center;align-items:center;gap:14px;font-size:12.5px;color:var(--ink2)}
.inv-multi{margin:0;flex:none}
.P .inv-fix .inv-grid{grid-template-columns:repeat(5,1fr)}
.det{font-size:12.5px;line-height:1.5}
.det .det-btns{margin-top:10px}

/* ---- settings ---- */
.set-tabs{display:flex;gap:6px;margin-bottom:10px}
.set-body{display:flex;flex-direction:column}
.srow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 10px;border-radius:12px;background:rgba(96,112,214,.18);border:1px solid rgba(150,165,240,.28);margin-bottom:6px}
.srow .sl{min-width:0}.srow .sl b{font-size:13.5px;font-weight:600}.srow .sl small{display:block;color:var(--ink2);font-size:11.5px;line-height:1.3}
.srow .sctl{display:flex;align-items:center;gap:8px;flex:none}
.srow .seg{flex-wrap:wrap;justify-content:flex-end}
.srow .seg button{padding:5px 10px;font-size:12px}
.tst{font-size:11px;font-weight:800;min-width:26px;color:var(--ink2);letter-spacing:.03em}.tst.on{color:var(--good)}
.srow.dim{opacity:.6}.srow.dim .tog{opacity:.7}
.fake{padding:3px 10px;border-radius:9px;background:rgba(255,255,255,.12);font-size:12px;font-weight:600}
.et-soon{font-size:10px;font-weight:800;letter-spacing:.04em;padding:2px 7px;border-radius:8px;background:rgba(232,203,120,.2);color:#f3dca0;text-transform:uppercase}
.soon-banner{display:flex;gap:8px;align-items:center;padding:8px 10px;border-radius:10px;background:rgba(232,203,120,.12);border:1px dashed rgba(232,203,120,.5);color:#f3dca0;font-size:12px;margin-bottom:8px}
.soon-banner svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;flex:none}
.gm-box{padding:8px 10px;border-radius:12px;background:rgba(96,112,214,.12);border:1px dashed rgba(150,165,240,.4);margin-bottom:6px}

/* ---- idle summary ---- */
.isum-head{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.isum-ic{width:42px;height:42px;border-radius:13px;background:linear-gradient(110deg,#1f8a6e,#3fc6a8);display:grid;place-items:center;flex:none}
.isum-ic svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.isum-head small{display:block;color:var(--ink2);font-size:11.5px}
.isum-stats{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.isum-items{display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:6px}
.isum-it{position:relative;display:flex;flex-direction:column;align-items:center;padding:6px 4px;border-radius:10px;background:rgba(255,255,255,.07)}
.isum-it .ii-ic svg{width:34px;height:34px}.isum-it b{position:absolute;top:2px;right:5px;font-size:11px;text-shadow:0 1px 2px #000}
.isum-it small{font-size:10px;text-align:center;line-height:1.1;color:var(--ink2);margin-top:2px}

/* ---- equipment window: title row (replaces the potion row) ---- */
.eq-title{display:flex;align-items:center;gap:8px;width:100%;margin-top:8px;padding:8px 10px;border:0;border-radius:11px;background:rgba(255,255,255,.07);color:var(--ink);font:inherit;font-size:13px;cursor:pointer;text-align:left}
.eq-title:hover{background:rgba(255,255,255,.12)}
.eq-title .et-l{display:flex;align-items:center;gap:6px;color:var(--ink2);font-size:12px}
.eq-title .et-l svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2}
.eq-title b{flex:1;font-weight:500;color:var(--ink2)}
.chr-name .ptr{width:36px;height:36px;border-radius:50%;flex:none}

/* ---- cash shop ---- */
.shop-tabs{margin-bottom:10px}
.cash-wal{display:flex;gap:12px;margin:0 0 10px}
.cash-card{display:flex;gap:10px;align-items:center;padding:10px;border-radius:12px;background:rgba(96,112,214,.2);border:1px solid rgba(150,165,240,.3)}
.cash-ic svg{width:52px;height:52px;display:block}.cash-card small{display:block;color:var(--ink2);font-size:11.5px}
.cap-bar{position:relative;height:20px;border-radius:10px;background:#050830;border:1px solid var(--line);margin:10px 0;overflow:hidden}
.cap-bar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(#b4bff8,#6e7ee0)}
.cap-bar span{position:relative;display:block;text-align:center;font-size:11px;line-height:20px;font-weight:700;text-shadow:0 1px 1px #000}

/* ---- world map ---- */
.wm-chart{position:relative;height:340px;border-radius:14px;background:radial-gradient(70% 90% at 30% 20%,rgba(110,125,230,.18),transparent),linear-gradient(#0e1658,#0a1042);border:1px solid rgba(124,136,216,.3);overflow:hidden}
.wm-lines{position:absolute;inset:0;width:100%;height:100%}
.wm-lines line{stroke:rgba(170,180,240,.3);stroke-width:1.6;stroke-dasharray:4 3;vector-effect:non-scaling-stroke}
.wm-lines line.on{stroke:#9fb0ff;stroke-dasharray:none;stroke-width:2.6}
.wm-lines.wp{display:none}.P .wm-lines.wl{display:none}.P .wm-lines.wp{display:block}
.wm-node{position:absolute;left:var(--lx);top:var(--ly);transform:translate(-50%,-50%);width:122px;display:grid;grid-template-columns:38px 1fr;column-gap:7px;align-items:center;text-align:left;padding:6px 8px 8px 6px;border-radius:13px;border:1.5px solid rgba(150,165,240,.5);background:rgba(14,20,76,.96);color:#eef0ff;cursor:pointer;font:inherit;box-shadow:0 4px 14px rgba(0,0,30,.5)}
.wm-node:hover{border-color:#cfd6ff}
.wm-th{grid-row:1/3;width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--c0),var(--c1) 55%,var(--c2));box-shadow:inset 0 0 0 1px rgba(255,255,255,.45)}
.wm-node b{font-size:12px;line-height:1.15;font-weight:700;overflow:hidden;text-overflow:ellipsis}
.wm-node small{font-size:10px;color:#aab4ea;line-height:1.1}
.wm-node em{position:absolute;right:8px;bottom:-9px;font-style:normal;font-size:10px;font-weight:800;padding:1px 8px;border-radius:9px;white-space:nowrap}
.wm-cost{background:#e0b04a;color:#3a2a06}.wm-here{background:#3fd6a8;color:#06382a}.wm-lock{background:#5a5f78;color:#fff;padding:2px 7px !important}
.wm-lock svg{width:11px;height:11px;stroke:#fff;fill:none;stroke-width:2.4;display:block}
.wm-node.lock{filter:grayscale(.85) brightness(.75)}
.wm-node.here{box-shadow:0 0 0 3px rgba(63,214,168,.5),0 4px 14px rgba(0,0,30,.5)}
.wm-node.sel{border-color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.55),0 4px 14px rgba(0,0,30,.5)}
.wm-note{margin:10px 2px 0}
.P .wm-chart{height:440px}
.P .wm-node{left:var(--px);top:var(--py)}
.mi-head{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.mi-th{width:44px;height:44px;border-radius:12px;flex:none;background:linear-gradient(135deg,var(--c0),var(--c1) 55%,var(--c2));box-shadow:inset 0 0 0 1px rgba(255,255,255,.45)}
.mi-head small{display:block;color:var(--ink2);font-size:11.5px}
.mi-tabs{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.mi-tabs button{padding:4px 10px !important;font-size:12px !important}
.mi-desc{margin:0 0 8px;font-size:12.5px;line-height:1.5;color:var(--ink)}
.kvs .kv{padding:3px 0;border-bottom:1px solid rgba(150,165,240,.15)}
.mi-foot{position:sticky;bottom:0;display:flex;flex-direction:column;gap:4px;margin-top:10px;padding-top:12px;background:linear-gradient(transparent,rgba(6,10,52,.96) 32%)}
.mi-tp{width:100%;height:42px;font-size:14px}
.mi-foot small{text-align:center;color:var(--ink2);font-size:11.5px}
.mi-lock{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;padding:24px 12px;border-radius:12px;background:rgba(255,255,255,.05);color:var(--ink2)}
.mi-lock svg{width:30px;height:30px;stroke:var(--pv2);fill:none;stroke-width:1.8}
.mi-lock b{color:var(--ink)}
.m-dot{width:14px;height:14px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c);flex:none}
.el{--ec:#ccc;display:inline-block;margin-left:4px;font-size:11px;font-weight:700;color:var(--ec);padding:0 7px;border-radius:8px;border:1px solid var(--ec)}
.boss-card{padding:10px;border-radius:12px;background:rgba(210,42,90,.1);border:1px solid rgba(255,150,176,.4);margin-bottom:8px}
.bc-h{display:flex;align-items:center;gap:10px;margin-bottom:6px}.bc-h small{display:block;color:var(--ink2);font-size:11.5px}.bc-lv{margin-left:auto;font-weight:800;color:#ffb0c4}
.dropl{display:flex;flex-direction:column;gap:4px}
.drop{display:flex;align-items:center;gap:8px;padding:3px 8px;border-radius:9px;background:rgba(255,255,255,.06)}
.drop .ii-ic svg{width:26px;height:26px;display:block}.drop b{font-weight:600;font-size:12.5px}.drop em{margin-left:auto;font-style:normal;color:var(--gold2);font-size:12px;white-space:nowrap}
.w-sec.sub2{margin:10px 0 6px;background:linear-gradient(90deg,#3a4cb0,rgba(58,76,176,.2));font-size:12.5px}
.qs{font-size:11px;font-weight:800;padding:2px 8px;border-radius:8px}.qs.done{background:rgba(122,230,172,.18);color:var(--good)}.qs.act{background:rgba(124,136,216,.3);color:#dfe4ff}

/* v17 fixes */
.P #botR{align-items:stretch}
.P #topC{top:150px}

.win[data-w=status]{min-width:380px}
.win[data-w=char]{min-width:0}

/* v17 polish */
.win[data-w=inv]{--wih:556px}
.inv-fix .ii{aspect-ratio:1/.86}
.P .inv-fix .ii{aspect-ratio:1}
.wm-node{width:152px}

.mi-th.lock{background:linear-gradient(135deg,#5a5f78,#8a8fa8)}

#wins .wn{letter-spacing:0;font-size:9.5px}

.P #wins .win-nav{gap:3px}

.P #wins .wni svg{width:17px;height:17px}

/* ================= v18 ================= */
/* player card: CP island (left) and Scandium (right) share the bottom row */
#pc{flex-direction:column;gap:8px;padding:10px 12px 9px 10px}
.pc-top{display:flex;gap:11px}
.pc-foot{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cp-isl{display:inline-flex;align-items:center;gap:6px;padding:2px 11px;border-radius:999px;background:rgba(110,88,232,.16);border:1px solid rgba(110,88,232,.4);font-size:11.5px;font-weight:600;color:var(--ink2);letter-spacing:.03em}
.cp-isl b{color:var(--gold);font-size:13px;font-variant-numeric:tabular-nums}
.sc-isl{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600}
.sc-isl i{width:13px;height:13px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff6d0,#d9c27a 60%,#8a7330);flex:none}
.sc-isl b{font-variant-numeric:tabular-nums}.sc-isl em{font-style:normal;font-weight:500;color:var(--ink2);font-size:11px}
.P .cp-isl{padding:1px 9px;font-size:10.5px}.P .sc-isl{font-size:11px}.P .sc-isl em{font-size:9.5px}

/* status islands (v18.3): four separate islands to the left of the minimap; they replace the old status bar */
#netBar{top:12px;right:272px;z-index:8;transition:transform .35s ease;display:flex;flex-direction:column;align-items:flex-end;gap:8px;pointer-events:none}
#netBar .ni{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 14px 0 11px;border-radius:12px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);-webkit-backdrop-filter:blur(10px) saturate(1.2);backdrop-filter:blur(10px) saturate(1.2);color:var(--ink);font-size:13px;font-weight:500;white-space:nowrap;font-variant-numeric:tabular-nums;pointer-events:auto}
#netBar .ni svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
#netBar .ni b{font-weight:700;color:var(--ink)}
#netBar .ni b.g{color:var(--good)}#netBar .ni b.y{color:var(--ny)}#netBar .ni b.r{color:var(--nr)}#netBar .ni b.n{color:var(--ink2)}
#netBar .ni em{font-style:normal;font-weight:500;color:var(--ink)}
#netBar #nsx_time b{font-weight:500}
#nsx_fps svg{color:#3f5bf0}#nsx_ping svg{color:#8a5be8}#nsx_on svg{color:#1f8fd6}#nsx_time svg{color:var(--ink2)}
#topR{top:12px}
.P #topL{top:32px}.P #topR{top:32px}.P #topC{top:176px}

/* menu: 3 x 3 */
#menu{grid-template-columns:repeat(3,48px)}
.P #menu{grid-template-columns:repeat(9,1fr)}
.P .mb span{font-size:8.6px}

/* idle: the size of a hotbar slot, gold, with a passing glint; the gear is a small badge on its corner */
#idleDock{position:relative;display:block;width:46px;height:46px;flex:none}
#idleDock .id-row{position:relative;display:block;width:46px;height:46px}
#idleDock .idle-btn{position:relative;width:46px;height:46px;min-width:0;padding:0;border-radius:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;overflow:hidden;cursor:pointer;color:#4a2e00;font:inherit;
 border:1.5px solid #fff3b0;background:linear-gradient(160deg,#ffe98a 0%,#f6bf2f 48%,#c98410 100%);box-shadow:0 0 0 1px rgba(120,70,0,.5),0 3px 10px rgba(240,170,30,.55),inset 0 1px 0 rgba(255,255,255,.7),inset 0 -3px 6px rgba(150,80,0,.35)}
#idleDock .idle-btn::after{content:"";position:absolute;top:-30%;bottom:-30%;left:-60%;width:38%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.95),transparent);transform:rotate(18deg);animation:glint 2.6s ease-in-out infinite;pointer-events:none}
@keyframes glint{0%,55%{left:-60%}100%{left:130%}}
#idleDock .ib-ic{display:grid;place-items:center;width:22px;height:20px;font-size:14px;font-weight:800;line-height:1;position:relative;z-index:1}
#idleDock .ib-ic svg{width:20px;height:20px;display:block}
#idleDock .ib-lb{font-size:8.4px;font-weight:800;letter-spacing:.05em;line-height:1;margin-top:1px;position:relative;z-index:1;text-transform:uppercase}
#idleDock .idle-btn:hover{filter:brightness(1.07)}
#idleDock .idle-btn:active{transform:scale(.94)}
#idleDock.on .idle-btn{box-shadow:0 0 0 2px #3fd6a8,0 0 14px rgba(63,214,168,.7),0 3px 10px rgba(240,170,30,.5),inset 0 1px 0 rgba(255,255,255,.7)}
#idleDock .ib-ring{position:absolute;inset:3px;border-radius:9px;border:2px solid transparent;border-top-color:#4a2e00;border-right-color:rgba(74,46,0,.45);animation:idSpin 1.1s linear infinite;pointer-events:none}
#idleDock.on .idle-btn::after{animation-duration:3.4s}
#idleDock.wait .idle-btn{filter:saturate(.8);animation:idPulse 1s ease-in-out infinite}
@keyframes idPulse{50%{filter:brightness(1.2)}}
#idleDock.town .idle-btn{filter:saturate(.85)}
.idle-cfg{position:absolute;top:-8px;right:-8px;width:20px;height:20px;border-radius:50%;padding:0;display:grid;place-items:center;cursor:pointer;z-index:3;
 --gbg:#16207a;background:#16207a;color:#fff;border:2px solid #f2f4ff;box-shadow:0 2px 6px rgba(0,0,0,.45);transition:transform .15s}
.idle-cfg:hover{transform:scale(1.18) rotate(30deg);background:#2c3aa8;--gbg:#2c3aa8}
.idle-cfg svg{width:12px;height:12px;display:block}
#claimBtn.has{position:absolute;right:0;bottom:calc(100% + 8px);width:max-content;white-space:nowrap}
#botC{gap:10px;align-items:flex-end}
.cmp #idleDock,.cmp #idleDock .id-row,.cmp #idleDock .idle-btn{width:40px;height:40px}.cmp #idleDock .ib-lb{font-size:7.5px}
.cmp #botC{left:128px}
.P #idleDock,.P #idleDock .id-row,.P #idleDock .idle-btn{width:44px;height:44px}
.P #botC{bottom:70px;right:12px;gap:9px}
.P #idleDock .id-row{flex-direction:initial}
.P .idle-cfg{width:20px;height:20px}
.P #botL.cm-min{bottom:182px}

/* minimap: World Map button in the top-right corner of the frame, zoom buttons without text */
.mm-world{position:absolute;top:8px;right:8px;width:28px;height:26px}
.mm-world svg{width:16px;height:16px}
#zLbl{display:none !important}
.mm-zoom{gap:4px}

/* windows: no bottom bar any more, so they can be a little shorter */
.win[data-w=char]{--wih:640px}
.win[data-w=status]{--wih:520px}
.win[data-w=inv]{--wih:520px}
.win[data-w=itemdet]{--wih:480px}
.win[data-w=skill],.win[data-w=quest],.win[data-w=archpick]{--wih:520px}
.win[data-w=party],.win[data-w=guild]{--wih:380px}
.win[data-w=shop]{--wih:440px}
.win[data-w=set]{--wih:500px}
.win[data-w=worldmap]{--wih:470px}.win[data-w=mapinfo]{--wih:470px}
.win[data-w=idlesum]{--wih:440px}.win[data-w=idleset]{--wih:480px}.win[data-w=idlerew]{--wih:420px}
#wins .win-nav{display:none !important}

/* equipment: wallet under the title */
.eq-wallet{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:6px;padding:7px 12px;border-radius:11px;background:rgba(255,255,255,.07)}
.eq-wallet .cur{font-size:12.5px;gap:6px}.eq-wallet .cur i{width:13px;height:13px}.eq-wallet .cur b{font-size:13px}

/* inventory: bottom rows and star size */
.inv-pager{gap:10px}
.inv-pager .grow{flex:1}
.inv-foot{flex:none;display:flex;align-items:center;gap:8px;padding-top:2px}
.inv-foot .grow{flex:1}
.inv-foot .bulk{background:#2f7fd6;color:#fff;border-color:#2f7fd6}
.inv-foot .bulk.pri{background:#1d5fb5;border-color:#1d5fb5}
.inv-fix .ii-st{font-size:9.6px;letter-spacing:-.6px;white-space:nowrap;left:0;right:0;text-align:center;bottom:1px}
.inv-fix .ii-rf{font-size:9.5px}

/* idle stays gold in every state (older state colours removed) */
#idleDock .idle-btn,#idleDock.on .idle-btn,#idleDock.wait .idle-btn,#idleDock.town .idle-btn{background:linear-gradient(160deg,#ffe98a 0%,#f6bf2f 48%,#c98410 100%);color:#4a2e00}
#idleDock.town .idle-btn{filter:saturate(.9)}

/* phone fixes */
.P #botC{left:auto;transform:none;right:12px}
.P #wins{top:34px}
.P .inv-tabs button{padding:4px 7px;font-size:11.5px}
.P .inv-tabs{flex-wrap:nowrap}

.P #idleDock .idle-btn{min-width:0;padding:0;gap:0;width:44px;height:44px}
.P #idleDock .ib-lb{font-size:7.6px}

.cmp #idleDock .idle-btn{min-width:0}
#netBar.down{transform:translateY(46px)}
.P #netBar.down{transform:none}
/* portrait: no room beside the minimap, so the same four islands sit in one row at the very top */
.P #netBar{top:5px;left:6px;right:6px;flex-direction:row;justify-content:flex-end;align-items:center;gap:4px}
.P #netBar .ni{height:22px;padding:0 7px 0 6px;gap:4px;border-radius:9px;font-size:9.8px}
.P #netBar .ni svg{width:12px;height:12px}
@media (max-width:350px){.P #netBar #nsx_on em{display:none}}

/* announcement sits under the status row */
#announce{top:12px}
#topC.down{transform:translate(-50%,60px)}
.P #announce{top:30px}
.P #topC.down{transform:translateY(68px)}

/* monster panel: own container, compact. Landscape = top centre, a little lower than the status row; Portrait = bottom centre, just above the hotbar */
#mobC{top:72px;left:50%;transform:translateX(-50%);z-index:2;transition:transform .35s ease}
#mobC.down{transform:translate(-50%,40px)}
#mobBar{width:min(300px,44vw);padding:5px 10px 6px;border-radius:12px}
#mobBar.boss{width:min(380px,54vw)}
.mo-l1{gap:6px;margin-bottom:3px}
.mo-name{font-size:13px}
.mo-lv{font-size:10.5px;padding:0 7px}
.mo-el{font-size:10px;padding:0 7px}
.mo-tag{font-size:10px}
.mo-hp,.mo-hp i{border-radius:8px}
.mo-hp{height:16px}
.mo-t{font-size:11px}
.mo-d{font-size:14px}
.mo-warn{font-size:11.5px}
.mo-warn.on{margin-top:3px}
.P #mobC{top:auto;bottom:186px;width:calc(100% - 140px);max-width:260px}
.P #mobC.down{transform:translateX(-50%)}
.P #mobBar,.P #mobBar.boss{width:100%;padding:5px 9px 6px}
.P .mo-name{font-size:12.5px}
.P.dlg-open #mobC{opacity:0}
</style>

<body>
<div id="app">
  <div id="stage" class="L">
    <canvas id="cv" aria-label="Game world"></canvas>
    <div id="ui">
      <div id="topL">
        <div id="pc" class="panel">
          <div class="pc-top">
            <div class="pc-av"><canvas id="av" width="128" height="128"></canvas><span class="lvbadge">Lv <b id="lv">1</b></span></div>
            <div class="pc-main">
              <div class="pc-name"><span id="pname">Arin</span><span class="tier" id="pcTier">C0</span><span class="job" id="pcJob"></span></div>
              <div class="bar hp"><i id="hpF"></i><span><em>HP</em><b id="hpT"></b></span></div>
              <div class="bar sp"><i id="spF"></i><span><em>SP</em><b id="spT"></b></span></div>
              <div class="bar exp"><i id="exF"></i><span><em>Base</em><b id="exT"></b></span></div>
              <div class="bar jexp"><i id="jxF"></i><span><em>Job <span id="jlv">1</span>/<span id="jcap">10</span></em><b id="jxT"></b></span></div>
            </div>
          </div>
          <div class="pc-foot"><span class="cp-isl">CP <b id="cpV">0</b></span><span class="sc-isl" title="Scandium"><i></i><b id="wSc">0</b><em id="scLbl">Scandiums</em></span></div>

/* ---------- stat points (iRO classic) ---------- */
// level x -> x+1 grants floor(x/5)+3 points; 48 points at character creation
function statPointsTotal(lv){let p=48;for(let x=1;x<lv;x++)p+=fl(x/5)+3;return p}
// raising a stat from x to x+1 costs floor((x-1)/10)+2
const raiseCost=x=>fl((x-1)/10)+2;
function costTo(v){let c=0;for(let x=1;x<v;x++)c+=raiseCost(x);return c}
function spent(stats){return STATS.reduce((a,k)=>a+costTo(stats[k]||1),0)}

function elemMult(a,d,attune){
  if(!a||a==="neutral"||a==="holy"||!d||d==="neutral")return 1;
  if(STRONG[a]===d)return attune?1.75:1.5;
  if(STRONG[d]===a||a===d)return .75;

}
