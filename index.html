<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rare Earth Online — Gadolinium</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#c7cfdf; --panel:rgba(250,248,244,.9); --panel2:rgba(238,234,226,.95);
  --line:rgba(90,78,130,.22); --ink:#1f1c2e; --ink2:#615b78; --gold:#9a6e18; --gold2:#e9c46a;
  --accent:#6e58e8; --accent2:#a99cff; --shadow:0 8px 26px rgba(30,24,70,.2);
  --slot:#ece8f4; --slotb:rgba(90,78,130,.28);
  --sys:#23866a; --party:#2f6fc8; --guild:#9a4fc8;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#06080f; --panel:rgba(18,20,38,.82); --panel2:rgba(28,31,56,.92);
    --line:rgba(176,166,255,.2); --ink:#eef0fb; --ink2:#a5aac8; --gold:#e9c46a; --gold2:#ffe39a;
    --accent:#8a78ff; --accent2:#c3b8ff; --shadow:0 10px 30px rgba(0,0,0,.45);
    --slot:#1d2142; --slotb:rgba(176,166,255,.24);
    --sys:#6fe0b4; --party:#8ec0ff; --guild:#d7a3ff;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#06080f; --panel:rgba(18,20,38,.82); --panel2:rgba(28,31,56,.92);
  --line:rgba(176,166,255,.2); --ink:#eef0fb; --ink2:#a5aac8; --gold:#e9c46a; --gold2:#ffe39a;
  --accent:#8a78ff; --accent2:#c3b8ff; --shadow:0 10px 30px rgba(0,0,0,.45);
  --slot:#1d2142; --slotb:rgba(176,166,255,.24);
  --sys:#6fe0b4; --party:#8ec0ff; --guild:#d7a3ff;
  color-scheme:dark;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:Kanit,"Noto Sans Thai",Tahoma,system-ui,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
*,*::before,*::after{box-sizing:border-box}
button{font:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
#app{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(120% 90% at 50% 0%,rgba(110,88,232,.25),transparent 60%),var(--bg)}
#stage{position:relative;overflow:hidden;background:#10241c;flex:none}
#stage.framed{border-radius:30px;box-shadow:0 0 0 9px #13141a,0 0 0 10px #3b3d4a,0 30px 80px rgba(0,0,0,.45)}
#stage.framed.L{border-radius:20px}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:pointer}
#ui{position:absolute;inset:0;pointer-events:none;font-size:14px}
#ui>div{position:absolute}
.panel,#ui button,#ui input,.seg,#hotbar,#menu{pointer-events:auto}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);-webkit-backdrop-filter:blur(10px) saturate(1.2);backdrop-filter:blur(10px) saturate(1.2)}

/* player card */
#topL{top:12px;left:12px;width:300px;display:flex;flex-direction:column;gap:10px}
#pc{display:flex;gap:11px;padding:10px 12px 10px 10px}
.pc-av{position:relative;width:64px;height:64px;flex:none}
.pc-av canvas{width:100%;height:100%;border-radius:50%;border:2px solid var(--gold2);background:radial-gradient(circle at 40% 30%,#e3dcff,#5a49b8);display:block}
.lvbadge{position:absolute;bottom:-5px;left:50%;transform:translateX(-50%);background:linear-gradient(#f6dc8c,#c6912f);color:#3a2508;font-size:11px;font-weight:600;padding:0 8px;border-radius:10px;white-space:nowrap;border:1px solid rgba(80,50,10,.35)}
.pc-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.pc-name{display:flex;align-items:baseline;gap:7px;font-weight:600;font-size:15px;line-height:1.2}
.job{font-size:12px;font-weight:400;color:var(--ink2)}
.bar{position:relative;height:13px;border-radius:7px;background:rgba(10,10,30,.28);overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;width:100%;border-radius:7px;transition:width .35s}
.bar.hp i{background:linear-gradient(#ff95a0,#d3304a)}
.bar.sp i{background:linear-gradient(#95c8ff,#2f6fd8)}
.bar.exp i{background:linear-gradient(#ffe39a,#d39a2a)}
.bar span{position:relative;display:flex;justify-content:space-between;font-size:10px;line-height:13px;padding:0 6px;color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.65);font-weight:500}
.bar b{font-weight:500;font-variant-numeric:tabular-nums}
.pc-gold{font-size:12px;color:var(--ink2);display:flex;align-items:center;gap:5px}
.pc-gold b{color:var(--gold);font-weight:600;font-variant-numeric:tabular-nums}
.coin{width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3b5,#e0a630 60%,#9b6a12)}

/* idle */
#idle{padding:10px 12px}
.idle-h{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:600;font-size:13.5px}
.idle-t{display:flex;align-items:center;gap:7px}
.idle-t::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ink2);opacity:.5}
#idle.on .idle-t::before{background:#3fd6a8;opacity:1;box-shadow:0 0 0 4px rgba(63,214,168,.25)}
.tog{width:44px;height:24px;border-radius:12px;border:none;background:rgba(120,120,150,.45);position:relative;cursor:pointer;transition:background .2s;flex:none}
.tog i{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.tog.on{background:linear-gradient(90deg,var(--accent),#3fc6a8)}
.tog.on i{left:23px}
.idle-rows{display:grid;grid-template-columns:1fr 1fr;gap:3px 14px;margin:8px 0;font-size:12px;color:var(--ink2)}
.idle-rows div{display:flex;justify-content:space-between;gap:6px}
.idle-rows b{color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:9px;padding:6px 14px;font-size:13px;cursor:pointer}
.btn.pri{background:var(--accent);color:#fff;border-color:transparent}
.btn.gold{width:100%;background:linear-gradient(#f6dc8c,#d1a03e);color:#3a2508;border:1px solid rgba(90,60,10,.3);font-size:12.5px;font-weight:600}
.btn:disabled{opacity:.45;cursor:default}

/* banner */
#topC{top:12px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
#banner{text-align:center;padding:5px 44px 7px;background:linear-gradient(90deg,transparent,rgba(12,14,32,.62) 20%,rgba(12,14,32,.62) 80%,transparent);color:#fff}
.b-sub{font-size:12px;letter-spacing:.06em;color:#ead8a4}
.b-name{font-size:26px;font-weight:600;letter-spacing:.04em;line-height:1.15;color:#f3f0ff;text-shadow:0 0 18px rgba(170,150,255,.65),0 2px 4px rgba(0,0,0,.5)}
.b-meta{font-size:11.5px;color:#d3d6ee;display:flex;gap:12px;justify-content:center;font-variant-numeric:tabular-nums}
#hint{font-size:12.5px;padding:5px 14px;border-radius:20px;background:rgba(12,14,32,.6);color:#fff;transition:opacity .8s}
#hint.gone{opacity:0}

/* right column */
#topR{top:12px;right:12px;width:250px;display:flex;flex-direction:column;gap:10px}
#tools{display:flex;gap:6px;justify-content:flex-end;flex-wrap:nowrap}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:2px;box-shadow:var(--shadow)}
.seg button{border:0;background:none;font-size:12.5px;font-weight:500;color:var(--ink2);padding:3px 10px;border-radius:8px;cursor:pointer}
.seg button.on{background:var(--accent);color:#fff}
.ibtn{height:30px;min-width:30px;padding:0 8px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:5px;font-size:12px;cursor:pointer;box-shadow:var(--shadow)}
.ibtn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
#mmWrap{padding:6px;position:relative}
#mm{display:block;width:100%;height:122px;border-radius:9px;background:#132a23;cursor:crosshair;touch-action:none}
.mm-name{position:absolute;left:13px;top:10px;font-size:11px;color:#fff;text-shadow:0 1px 2px #000;pointer-events:none}
#quest{padding:9px 12px 10px;font-size:12.5px}
.q-h{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--gold);font-weight:600;margin-bottom:3px}
.q-go{border:0;background:var(--accent);color:#fff;font-size:11px;border-radius:7px;padding:1px 9px;cursor:pointer}
.q-title{font-weight:600}
.q-obj{color:var(--ink2);display:flex;gap:7px;align-items:flex-start;line-height:1.4}
.q-obj::before{content:"";width:7px;height:7px;margin-top:6px;border-radius:2px;transform:rotate(45deg);background:var(--gold2);flex:none}

/* chat */
.c-tabs button{border:0;background:none;font-size:12px;color:var(--ink2);padding:3px 10px;border-radius:7px 7px 0 0;cursor:pointer}
.c-tabs button.on{background:var(--panel2);color:var(--ink);font-weight:500}
#clog{flex:1;overflow-y:auto;padding:6px 10px;font-size:12.5px;line-height:1.5;background:var(--panel2);margin:0 6px;border-radius:0 8px 8px 8px;-webkit-user-select:text;user-select:text}
.m-sys{color:var(--sys)} .m-party{color:var(--party)} .m-guild{color:var(--guild)}
.m-n{font-weight:500;color:var(--accent)}
.m-me .m-n{color:var(--gold)}
.c-in{display:flex;gap:6px;padding:6px}
.c-in input{flex:1;min-width:0;border:1px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:8px;padding:5px 10px;font:inherit;font-size:12.5px}

/* hotbar */
#botC{bottom:12px;left:50%;transform:translateX(-50%)}
#hotbar{display:flex;gap:5px;padding:7px;border-radius:14px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.slot{position:relative;width:46px;height:46px;border-radius:10px;border:1px solid var(--slotb);background:var(--slot);display:grid;place-items:center;cursor:pointer;overflow:hidden;padding:0;transition:transform .08s}
.slot .ic{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;background:var(--c);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 -3px 6px rgba(0,0,0,.22)}
.slot svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 1px 1px rgba(0,0,0,.35))}
.slot .k{position:absolute;top:1px;left:4px;font-size:9.5px;color:var(--ink2);font-weight:500;z-index:2}
.slot .n{position:absolute;bottom:0;right:4px;font-size:10px;color:var(--ink);font-weight:600;z-index:2;text-shadow:0 0 3px var(--slot)}
.slot::after{content:"";position:absolute;inset:0;background:conic-gradient(rgba(8,8,22,.62) calc(var(--cd,0)*1turn),transparent 0);pointer-events:none}
.slot:active{transform:scale(.93)}
.slot.flash .ic{filter:brightness(1.45)}

/* menu */
#botR{right:12px;bottom:12px}
#menu{display:grid;grid-template-columns:repeat(4,48px);gap:6px;padding:7px;border-radius:14px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.mb{width:48px;height:48px;border-radius:12px;border:1px solid var(--slotb);background:var(--slot);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;padding:0}
.mb svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mb span{font-size:9.5px;line-height:1.1;max-width:46px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mb:hover{border-color:var(--accent);color:var(--accent)}

/* dialog + window */
#dlg{left:50%;transform:translateX(-50%);bottom:86px;width:min(580px,calc(100% - 24px));padding:14px 16px 12px;display:flex;gap:14px;align-items:flex-start}
.hidden{display:none !important}
.d-por{width:76px;height:76px;flex:none;border-radius:16px;border:2px solid var(--gold2);display:block;background:radial-gradient(circle at 40% 30%,#f2eeff,#7a68d8)}
.d-body{flex:1;min-width:0}
.d-name{font-weight:600;color:var(--gold);margin-bottom:2px}
.d-text{font-size:14.5px;line-height:1.6;min-height:46px}
.d-act{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}
#win{left:50%;top:50%;transform:translate(-50%,-50%);width:min(540px,calc(100% - 24px));max-height:min(80%,580px);display:flex;flex-direction:column;overflow:hidden;z-index:5}
.win-h{display:flex;align-items:center;justify-content:space-between;padding:10px 12px 10px 16px;border-bottom:1px solid var(--line);font-weight:600;font-size:15px;cursor:move;touch-action:none}
#winX{border:0;background:none;font-size:24px;color:var(--ink2);cursor:pointer;line-height:1;width:32px;height:32px;border-radius:8px}
#winX:hover{background:var(--panel2)}
#winB{padding:12px 16px 16px;overflow:auto;font-size:13.5px}
.w-sec{font-weight:600;color:var(--gold);margin:10px 0 6px;font-size:13px}
.w-sec:first-child{margin-top:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.stat{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;border-radius:9px;background:var(--panel2);border:1px solid var(--line)}
.stat b{font-variant-numeric:tabular-nums}
.rows{display:flex;flex-direction:column;gap:6px}
.row{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:10px;background:var(--panel2);border:1px solid var(--line)}
.row .grow{flex:1;min-width:0}
.row small{color:var(--ink2);display:block;font-size:11.5px}
.dot{width:30px;height:30px;border-radius:8px;flex:none;display:grid;place-items:center;background:var(--c,#888)}
.dot svg{width:17px;height:17px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.inv{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:6px}
.it{aspect-ratio:1;border-radius:10px;background:var(--slot);border:1px solid var(--slotb);position:relative;display:grid;place-items:center}
.it i{width:58%;height:58%;border-radius:50%;background:var(--c);box-shadow:inset -3px -4px 6px rgba(0,0,0,.25),inset 2px 3px 4px rgba(255,255,255,.5)}
.it b{position:absolute;right:5px;bottom:2px;font-size:10.5px;font-weight:600}
.it[title]:hover{border-color:var(--accent)}
.wt{margin-top:10px;font-size:12px;color:var(--ink2)}
.wt .bar{margin-top:4px}
.chk{color:var(--sys)}
.muted{color:var(--ink2);font-size:12.5px}

/* toasts */
#toasts{top:34%;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:9}
.toast{padding:7px 18px;border-radius:20px;background:rgba(12,14,32,.8);color:#fff;font-size:13px;animation:tin .3s ease both,tout .5s ease 2.4s forwards;white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis}
.toast.gold{background:linear-gradient(90deg,#c6912f,#f6dc8c,#c6912f);color:#3a2508;font-weight:600}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
@keyframes tout{to{opacity:0;transform:translateY(-10px)}}

/* compact landscape */
.L.cmp .slot{width:42px;height:42px}
.L.cmp .slot .ic{width:31px;height:31px}
.L.cmp #menu{grid-template-columns:repeat(4,42px)}
.L.cmp .mb{width:42px;height:42px}
.L.cmp .mb span{display:none}

/* portrait */
.P #ui{font-size:13px}
.P #topL{top:8px;left:8px;right:146px;width:auto;gap:6px}
.P #pc{padding:7px 9px 7px 7px;gap:9px}
.P .pc-av{width:50px;height:50px}
.P .pc-name{font-size:14px}
.P .bar{height:11px}
.P .bar span{font-size:9px;line-height:11px}
.P .pc-gold{font-size:11px}
.P #idle{padding:6px 10px}
.P .idle-h{font-size:12px}
.P .tog{width:38px;height:21px}
.P .tog i{width:15px;height:15px}
.P .tog.on i{left:20px}
.P #topR{top:8px;right:8px;width:130px;gap:6px}
.P #tools{gap:4px;flex-wrap:wrap}
.P .ibtn{height:28px;min-width:28px;padding:0 6px}
.P #layoutLbl{display:none}
.P .seg button{padding:3px 8px}
.P #mm{height:76px}
.P #quest{padding:7px 9px;font-size:11.5px}
.P #banner{padding:3px 26px 5px 10px;text-align:left;background:linear-gradient(90deg,rgba(12,14,32,.62) 65%,transparent);border-radius:9px 0 0 9px}
.P .b-name{font-size:19px}
.P .b-sub{font-size:11px}
.P .b-meta{justify-content:flex-start;font-size:10.5px}
.P #hint{font-size:11.5px}
.P #botR{left:0;right:0;bottom:0}
.P #menu{grid-template-columns:repeat(8,1fr);border-radius:16px 16px 0 0;padding:4px 4px 6px;gap:0;border-bottom:0}
.P .mb{width:auto;height:52px;background:none;border:0}
.P .mb span{font-size:9.5px;max-width:100%}
.P #botC{bottom:70px}
.P #hotbar{display:grid;grid-template-columns:repeat(5,44px);gap:5px;padding:6px}
.P .slot{width:44px;height:44px}
.P .slot .ic{width:32px;height:32px}
.P .c-in input{font-size:16px}
.P #dlg{bottom:186px}
.dlg-open #botL{opacity:0;pointer-events:none}
.dlg-open #botL *{pointer-events:none}
@media (prefers-reduced-motion:reduce){.toast{animation:none}}
/* ---- v2 additions ---- */
.pc-name .tier{font-size:10px;font-weight:600;padding:0 6px;border-radius:6px;background:var(--accent);color:#fff;line-height:16px}
.bar.jexp i{background:linear-gradient(#a6f0c6,#2a9e63)}
.bar span em{font-style:normal}
.wallet{display:flex;align-items:center;gap:10px;font-size:11.5px;color:var(--ink2);flex-wrap:wrap;margin-top:1px}
.cur{display:flex;align-items:center;gap:4px}
.cur i{width:11px;height:11px;border-radius:50%;flex:none}
.cur b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.cur.sc i{background:radial-gradient(circle at 35% 35%,#fff6d0,#d9c27a 60%,#8a7330)}
.cur.y i{background:radial-gradient(circle at 35% 35%,#d9fff4,#3fc6a8 60%,#1d6e5c)}
.cur.la i{background:radial-gradient(circle at 35% 35%,#efe9ff,#8a78ff 60%,#4a36b0)}
.cp{margin-left:auto;font-weight:500}
.cp b{color:var(--gold);font-weight:600;font-variant-numeric:tabular-nums}
.idle-status{display:flex;align-items:center;gap:7px;margin-top:7px;padding:5px 9px;border-radius:9px;background:var(--panel2);font-size:12px;line-height:1.35}
.idle-status::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ink2);flex:none}
#idle.on .idle-status{color:var(--sys)}
#idle.on .idle-status::before{background:#3fd6a8;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 5px rgba(63,214,168,.15)}}
.idle-rate{font-size:11.5px;color:var(--ink2);margin-bottom:8px}
#claimBtn{display:none}
#claimBtn.has{display:block}
.P .idle-rows,.P .idle-rate{display:none}
.P #claimBtn.has{margin-top:6px;padding:4px 8px;font-size:11.5px}
.P #topC{top:200px;left:8px;transform:none;align-items:flex-start;max-width:calc(100% - 154px)}
.P .wallet{font-size:10.5px;gap:7px}
.P .bar{height:10px}
.P .bar span{line-height:10px;font-size:8.5px}
#banner{transition:opacity .8s}
.P #banner.away{opacity:0}
/* chat */
#botL{left:12px;bottom:12px;width:360px}
#botL.cm-min{width:auto}
#botL.cm-min #chat{display:none}
#botL:not(.cm-min) #chatPill{display:none}

#chat{display:flex;flex-direction:column;height:232px;overflow:hidden}
.c-head{display:flex;align-items:flex-end;padding:6px 6px 0;gap:4px}

.c-btns{display:flex;gap:2px;padding-bottom:3px}
.cbtn{width:30px;height:26px;border:0;border-radius:7px;background:none;color:var(--ink2);cursor:pointer;display:grid;place-items:center;padding:0}

#deathOv{inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:radial-gradient(ellipse at center,rgba(60,0,10,.25),rgba(40,0,8,.75));color:#fff;z-index:35;text-shadow:0 2px 8px rgba(0,0,0,.6);pointer-events:auto}

.w-dev{display:flex;flex-wrap:wrap;gap:6px}
.w-dev .btn{font-size:12.5px}
.btn.danger{color:#d3304a;border-color:rgba(211,48,74,.4)}

#idle{display:flex;flex-direction:column;gap:8px}
.idle-btn{display:flex;align-items:center;justify-content:center;gap:9px;height:46px;border:0;border-radius:14px;cursor:pointer;color:#fff;font-size:15px;font-weight:600;letter-spacing:.02em;
 background:linear-gradient(110deg,#6e58e8,#3fc6a8);box-shadow:0 8px 22px rgba(80,60,220,.35),inset 0 1px 0 rgba(255,255,255,.35);position:relative;overflow:hidden}
.idle-btn::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);transform:translateX(-100%);animation:shine 2.8s ease-in-out infinite}
@keyframes shine{60%,100%{transform:translateX(100%)}}
.idle-btn:hover{filter:brightness(1.08)}
.idle-btn .ib-play{width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.25);display:grid;place-items:center;font-size:11px}
#idle.town .idle-btn{background:linear-gradient(110deg,#5a5f78,#7b6fb0);box-shadow:var(--shadow);font-size:13.5px}
#idle.town .idle-btn::after{display:none}
#idle.on .idle-btn{cursor:default;background:linear-gradient(110deg,#1f8a6e,#3fc6a8);height:38px;font-size:13.5px}
.ib-dot{width:9px;height:9px;border-radius:50%;background:#d9fff2;animation:pulse 1.2s ease-in-out infinite}
#idlePanel{display:none;padding:9px 12px}
#idle.on #idlePanel{display:block;animation:tin .25s ease}
#idlePanel .idle-status{margin-top:0}
.idle-vip{font-size:11.5px;color:var(--ink2);line-height:1.4;padding:6px 8px;border-radius:8px;border:1px dashed var(--line);margin-top:2px}
.idle-vip.vip{color:var(--gold);border-color:rgba(233,196,106,.6);background:rgba(233,196,106,.08)}
.idle-vip.vip::before{content:"VIP ";font-weight:700}
.idle-rule{font-size:10.5px;color:var(--ink2);margin-top:5px;opacity:.8}
.idle-rate:empty{display:none}
.P .idle-btn{height:40px;font-size:13.5px}
.P #idle.on .idle-btn{height:32px}
.P .idle-vip,.P .idle-rule{display:none}
.P #idlePanel{padding:6px 9px}
#mmWrap{padding:0;overflow:hidden}
.mm-head,.q-h{display:flex;align-items:center;justify-content:space-between;gap:6px}
.mm-head{padding:6px 6px 4px 11px}
.mm-name{position:static;font-size:12px;font-weight:600;color:var(--ink);text-shadow:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mm-body{position:relative;padding:0 6px 6px}
#mm{height:128px}
.mmb{width:26px;height:24px;border-radius:7px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0;font-size:15px;line-height:1;flex:none}
.mmb svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
.mmb:disabled{opacity:.4;cursor:default}
#mmWrap.closed .mm-body{display:none}
#mmWrap.closed #mmTog svg,#quest.closed #qTog svg{transform:rotate(-90deg)}
.mm-home{position:absolute;left:12px;bottom:12px;width:30px;height:30px;background:rgba(18,20,40,.75);color:#fff;border-color:rgba(255,255,255,.25)}
.mm-zoom{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;align-items:center;gap:3px}
.mm-zoom .mmb{width:28px;height:26px;background:rgba(18,20,40,.75);color:#fff;border-color:rgba(255,255,255,.25)}
.mm-zoom span{font-size:9.5px;color:#fff;text-shadow:0 1px 2px #000;white-space:nowrap}
#quest{padding:8px 9px 9px}
#quest .q-h{margin-bottom:5px;padding-left:3px}
#quest.closed #qBody{display:none}
#quest.closed .q-h{margin-bottom:0}
#qCount{color:var(--ink2);font-weight:500}
#qBody{display:flex;flex-direction:column;gap:5px;max-height:260px;overflow-y:auto}
.ql{display:block;text-align:left;width:100%;border:1px solid var(--line);border-left:3px solid var(--qc);border-radius:8px;background:var(--panel2);color:var(--ink);padding:5px 8px;cursor:pointer;font-size:12px;line-height:1.35}
.ql:hover{border-color:var(--qc)}
.ql .qt{font-size:10px;font-weight:600;color:var(--qc);margin-right:5px}
.ql .qn{font-weight:600}
.ql .qo{display:block;color:var(--ink2);font-size:11.5px}
.ql.nav{box-shadow:0 0 0 2px var(--qc) inset}
.ql.nav .qn::after{content:" ▶";color:var(--qc);animation:pulse 1.2s infinite}
.qrow{border-left:3px solid var(--qc)}
.btn.sm{padding:4px 9px;font-size:12px}
.P #mm{height:80px}
.P #topR{width:150px}
.P #topL{right:166px}
.P #topC{max-width:calc(100% - 174px)}
.P .mm-zoom span{display:none}
.P .mm-zoom{flex-direction:row;right:10px;bottom:10px}
.P .mm-zoom .mmb,.P .mm-home{width:24px;height:22px}
.P .mm-home{left:10px;bottom:10px}
.P .ql{font-size:11px;padding:4px 6px}
.P .ql .qo{font-size:10.5px}
.P #qBody{max-height:150px}
#idle,.P #idle{padding:0}
.P #topC{top:252px}

#errBox{left:50%;top:12px;transform:translateX(-50%);width:min(420px,calc(100% - 24px));padding:10px 12px;display:flex;flex-direction:column;gap:6px;font-size:12.5px;z-index:60}
#errBox #errMsg{color:var(--ink2);word-break:break-word}
#errBox div{display:flex;gap:6px;justify-content:flex-end}
@media (pointer:coarse){
  .panel,#hotbar,#menu,.chat-pill{-webkit-backdrop-filter:none !important;backdrop-filter:none !important}
  :root{--panel:rgba(250,248,244,.96)}
}
@media (pointer:coarse) and (prefers-color-scheme:dark){:root:not([data-theme="light"]){--panel:rgba(18,20,38,.94)}}
@media (pointer:coarse){:root[data-theme="dark"]{--panel:rgba(18,20,38,.94)}}
.idle-btn::after{will-change:transform}
/* ---- v3.2 idle stop button ---- */
.idle-row{display:flex;gap:6px;align-items:stretch}
.idle-row .idle-btn{flex:1;min-width:0}
.idle-stop{flex:none;padding:0 14px;border-radius:14px;border:1px solid rgba(211,48,74,.45);background:var(--panel2);color:#d3304a;font:inherit;font-size:13px;font-weight:600;cursor:pointer;box-shadow:var(--shadow)}
.idle-stop:hover{background:rgba(211,48,74,.12)}
.idle-stop:focus-visible{outline:2px solid #d3304a;outline-offset:2px}
.P .idle-stop{padding:0 10px;font-size:12px}
/* ---- v4 loader ---- */
#loader{position:absolute;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(24,16,58,.84),rgba(4,6,16,.95));pointer-events:auto}
#loader.hidden{display:none !important}
.ld-box{width:min(360px,80%);text-align:center;color:#eef0fb}
.ld-title{font-size:18px;font-weight:600;margin-bottom:14px;color:#f3f0ff}
.ld-bar{height:8px;border-radius:5px;background:rgba(255,255,255,.12);overflow:hidden}
.ld-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#6e58e8,#e9c46a);transition:width .2s}
.ld-pct{font-size:12px;color:#c8cbe6;margin-top:6px;font-variant-numeric:tabular-nums}
.ld-tip{font-size:12.5px;color:#a9aed0;margin-top:16px;line-height:1.55;min-height:40px}
/* ---- v4.1 status ---- */
.fx-row{display:flex;flex-wrap:wrap;gap:5px;margin-top:-2px}
.fx-row:empty{display:none}
.fx{display:flex;align-items:center;gap:4px;padding:2px 8px 2px 2px;border-radius:14px;background:var(--panel);border:1px solid var(--line);font-size:11px;box-shadow:var(--shadow);cursor:help;-webkit-user-select:none;user-select:none}
.fx.debuff{border-color:rgba(211,48,74,.55)}
.fx .fxi{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--c);box-shadow:inset 0 1px 0 rgba(255,255,255,.45)}
.fx .fxi svg{width:12px;height:12px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 1px 1px rgba(0,0,0,.35))}
.fx b{font-weight:500;color:var(--ink2);font-variant-numeric:tabular-nums}
.net{display:flex;flex-wrap:wrap;gap:4px 9px;padding:6px 9px;font-size:11px;color:var(--ink2)}
.net:empty{display:none}
.ns{display:flex;align-items:center;gap:4px;white-space:nowrap}
.ns>svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ns .v{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.ns .u{font-size:9.5px;color:var(--ink2)}
.ns.good .v{color:#2fbf8a}.ns.mid .v{color:#d99a1e}.ns.bad .v{color:#d3304a}
.ns.good>svg,.ns.good .sigbars{color:#2fbf8a}.ns.mid>svg,.ns.mid .sigbars{color:#d99a1e}.ns.bad>svg,.ns.bad .sigbars{color:#d3304a}
.ns .sim{font-size:8.5px;padding:0 3px;border-radius:4px;background:rgba(120,120,150,.32);color:var(--ink2);font-weight:600;letter-spacing:.03em}
.sigbars{display:inline-flex;align-items:flex-end;gap:1.5px;height:13px;color:var(--ink)}
.sigbars i{display:block;width:2.6px;background:currentColor;border-radius:1px}
.P .net{font-size:10px;gap:3px 6px;padding:5px 6px}
.P .ns>svg{width:12px;height:12px}
.P .fx{font-size:10px;padding:1px 6px 1px 2px}
.P .fx .fxi{width:17px;height:17px}
.P .fx-row{margin-top:0}
</style>

      </div>

/* ================= world basics ================= */
const TW=64,TH=32,HW=32,HH=16,N=49;
/* Lite mode: phones and low-memory devices get a smaller ground texture and keep only one map in memory */
const LITE=(()=>{try{const sm=Math.min(screen.width||9999,screen.height||9999)<=820;return matchMedia("(pointer:coarse)").matches||sm||(navigator.deviceMemory&&navigator.deviceMemory<=4)}catch(e){return true}})();
const GS=LITE?1:1.25;
const T_G=0,T_R=1,T_P=2,T_W=3,T_D=4,T_F=5;
const I=(x,y)=>y*N+x, inb=(x,y)=>x>=0&&y>=0&&x<N&&y<N;
function hash(x,y){let h=(x*374761393+y*668265263)|0;h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return (h>>>0)/4294967296}
function P(x,y,z=0){return [(x-y)*HW,(x+y)*HH-z]}
const isRoadBand=(x,y)=>(x>=23&&x<=25)||(y>=23&&y<=25);
function shade(hex,f){const n=parseInt(hex.slice(1),16);let r=n>>16,gg=n>>8&255,b=n&255;if(f<0){r*=1+f;gg*=1+f;b*=1+f}else{r+=(255-r)*f;gg+=(255-gg)*f;b+=(255-b)*f}return `rgb(${r|0},${gg|0},${b|0})`}
function newMap(id){return {id,map:new Uint8Array(N*N),blk:new Uint8Array(N*N),statics:[],B:[],portals:[],pools:[],npcs:[],wanderers:[],monsters:[]}}
function addS(m,o){const p=P(o.cx,o.cy);o.sx=p[0];o.sy=p[1];m.statics.push(o);return o}
const inEll=(x,y,e)=>((x-e[0])/e[2])**2+((y-e[1])/e[3])**2<=1;

/* ================= town ================= */
const HOUSE_ROOFS=["#c8743a","#4f7fb8","#7f9a3a","#b85a7a","#3f8a78","#c69a3a"];
function buildTown(){
  const m=newMap("town");Object.assign(m,{nameK:"mapName",subK:"mapSub",bg:["#163327","#0a1712"]});
  const {map,blk}=m;m.pools=[[37,12,4.2,3]];
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    let tp=T_G;
    if(hash(x>>2,(y>>2)+17)<.2&&hash(x,y)<.55)tp=T_F;
    if(isRoadBand(x,y))tp=T_R;
    if(Math.hypot(x+.5-24.5,y+.5-24.5)<=7.3)tp=T_P;
    if(inEll(x+.5,y+.5,m.pools[0])){tp=T_W;blk[I(x,y)]=1}
    map[I(x,y)]=tp;
    if(x===0||y===0||x===N-1||y===N-1)blk[I(x,y)]=1;
  }
  m.B=[
   {id:"guild",x:13,y:13,w:5,h:4,H:76,wall:"#ece5d6",trim:"#4d3a30",roof:"#3e54a0",label:"b_guild",flag:true},
   {id:"tool",x:29,y:15,w:3,h:3,H:52,wall:"#f3e9d3",trim:"#6b4a2f",roof:"#2f8f86",label:"b_tool"},
   {id:"inn",x:30,y:29,w:4,h:4,H:68,wall:"#f2e8da",trim:"#5b3b2a",roof:"#7b55c9",label:"b_inn"},
   {id:"smith",x:15,y:29,w:4,h:3,H:54,wall:"#bdb7ad",trim:"#463c35",roof:"#ad4038",label:"b_smith",chimney:true},
   ...[[36,19],[9,19],[27,7],[37,35],[8,34],[18,40]].map(([x,y],i)=>({id:"h"+i,x,y,w:3,h:3,H:46,wall:["#f4ead8","#eee6e0","#f2efe2"][i%3],trim:"#5a4433",roof:HOUSE_ROOFS[i]}))
  ];
  for(const b of m.B){
    for(let y=b.y;y<b.y+b.h;y++)for(let x=b.x;x<b.x+b.w;x++)blk[I(x,y)]=1;
    const dx=b.x+Math.floor(b.w/2),dy=b.y+b.h;const vert=b.y+b.h/2<24.5;let x=dx,y=dy,guard=0;
    while(inb(x,y)&&map[I(x,y)]!==T_R&&map[I(x,y)]!==T_P&&guard++<60){map[I(x,y)]=T_R;if(vert)y++;else x+=(x<24?1:-1)}
    addS(m,{kind:"bld",b,cx:b.x+b.w/2,cy:b.y+b.h/2,k:b.x+b.y+(b.w+b.h)/2});
  }
  for(let y=19;y<22;y++)for(let x=19;x<22;x++)blk[I(x,y)]=1;
  addS(m,{kind:"crystal",cx:20.5,cy:20.5,k:41.5});
  for(const [k,x,y] of [["barrel",19,30],["barrel",19,31],["crate",32,17],["crate",32,16],["barrel",34,31],["stall",28,21],["stall",21,28]]){blk[I(x,y)]=1;addS(m,{kind:k,x,y,cx:x+.5,cy:y+.5,k:x+y+1,v:hash(x,y)})}
  for(let i=3;i<N-3;i+=5)for(const [x,y] of [[i,22],[i,26],[22,i],[26,i]]){
    if(!inb(x,y)||blk[I(x,y)])continue;const tp=map[I(x,y)];if(tp!==T_G&&tp!==T_F)continue;
    blk[I(x,y)]=1;addS(m,{kind:"lamp",x,y,cx:x+.5,cy:y+.5,k:x+y+1,v:hash(x,y)});
  }
  const pt={x:46,y:24,to:"field1",labelK:"field1_name"};m.portals.push(pt);addS(m,{kind:"portal",p:pt,cx:46.5,cy:24.5,k:71});
  for(const [x,y] of [[26,21],[31,18],[19,26]])blk[I(x,y)]=1;
  plantTrees(m,(x,y,border,r)=>{
    if(Math.hypot(x-46,y-24)<4)return null;
    if(r<(border?.62:.05)){const hv=hash(y*7,x*11);return {kind:"tree",v:hv<.1?3:hv<.2?2:hv<.55?1:0}}
    return null;
  });
  return m;
}
function plantTrees(m,pick){
  const {map,blk}=m;
  for(let y=1;y<N-1;y++)for(let x=1;x<N-1;x++){
    if(blk[I(x,y)])continue;const tp=map[I(x,y)];if(tp!==T_G&&tp!==T_F)continue;
    const border=x<4||y<4||x>N-5||y>N-5;let ok=true;
    for(let j=-1;j<=1&&ok;j++)for(let i=-1;i<=1;i++){const nx=x+i,ny=y+j;if(!inb(nx,ny))continue;const nt=map[I(nx,ny)];
      if(nt===T_R||nt===T_P||nt===T_W||nt===T_D||(blk[I(nx,ny)]&&!(nx===0||ny===0||nx===N-1||ny===N-1))){ok=false;break}}
    if(!ok)continue;
    const o=pick(x,y,border,hash(x*3+1,y*5+2));
    if(o){blk[I(x,y)]=1;addS(m,Object.assign({x,y,cx:x+.5,cy:y+.5,k:x+y+1,s:.82+hash(x+5,y+9)*.38},o))}
  }
}

const fPathX=y=>27+Math.round(Math.sin(y*.19+1)*3);
const f2PathX=y=>18+Math.round(Math.sin(y*.2)*3);

const FCFG={

function buildField(id){
  const c=FCFG[id],m=newMap(id);Object.assign(m,{nameK:c.nameK,subK:c.subK,bg:c.bg,rec:c.rec,pal:FPAL[id],pools:c.pools});
  const {map,blk}=m;
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    let tp=T_G;
    if(hash((x>>2)+40,(y>>2)+3)<.22&&hash(x+9,y)<.5)tp=T_F;
    if(c.paths(x,y))tp=T_D;
    for(const e of m.pools)if(inEll(x+.5,y+.5,e)){tp=T_W;blk[I(x,y)]=1}
    map[I(x,y)]=tp;

  const need=maps.filter(m=>m&&!m.ground);if(!need.length){cb();return}
  for(const m of need){m._gp=m._gp||0;queueBuild(m,true)}

function checkWaiters(){
  if(!waiters.length)return;const done=[],rest=[];
  for(const w of waiters)(w.maps.every(m=>m.ground)?done:rest).push(w);
  waiters.length=0;waiters.push(...rest);for(const w of done)w.cb();
}

function updateLoader(dt){
  const el=$("#loader");

  let p=1;for(const w of waiters)for(const m of w.maps)p=Math.min(p,m._gp||0);
  $("#ldBar").style.width=Math.round(p*100)+"%";$("#ldPct").textContent=Math.round(p*100)+"%";

}

function tile(m,x,y){

  if(tp===T_R||tp===T_D){
    const dirt=tp===T_D;
    const c=dirt?`hsl(${(fieldMap?fp.dirt:26)+h*6},${28+h*8}%,${38+h*6}%)`:`hsl(36,${15+h*6}%,${57+h*7}%)`;fillPoly(pts,c,c,1);

  }else{

    const c=fieldMap?`hsl(${fp.gH+nz*fp.gHr},${fp.gS+nz*fp.gSr}%,${fp.gL+nz*fp.gLr}%)`:`hsl(${92+nz*20},${40+nz*12}%,${39+nz*9}%)`;fillPoly(pts,c,c,1);

    if(m.map[I(x,y)]===T_F)for(let i=0;i<5;i++){const u=hash(x*29+i,y*3)*.8+.1,v=hash(x,y*31+i)*.8+.1;const [sx,sy]=P(x+u,y+v);

  }

function buildMini(m){

  const Q=(x,y)=>[(x-y)*4,(x+y)*2];

  for(const o of m.statics){

    else if(o.kind==="shroom")dia(o.x,o.y,o.alt?"#ff9a5a":o.v<.5?"#3fd0c4":"#9a6cf0");else if(o.kind==="crys")dia(o.x,o.y,o.alt?"#ffd890":"#b7f4ff");else if(o.kind==="rock")dia(o.x,o.y,"#6a6e7c");
    else if(o.kind==="bld"){const b=o.b;for(let y=b.y;y<b.y+b.h;y++)for(let x=b.x;x<b.x+b.w;x++)dia(x,y,b.roof)}}

/* ================= map travel ================= */
/* Arrival = a walkable tile next to the destination map's portal that leads back to where we came from */
function walkableNear(m,x,y){
  for(let r=1;r<=6;r++){            // nearest ring first
    let best=null,bd=1e9;
    for(let yy=y-r;yy<=y+r;yy++)for(let xx=x-r;xx<=x+r;xx++){
      if(Math.max(Math.abs(xx-x),Math.abs(yy-y))!==r||!walkM(m,xx,yy))continue;
      const d=Math.hypot(xx-24.5,yy-24.5);if(d<bd){bd=d;best=[xx+.5,yy+.5]}   // within that ring, face the map center
    }
    if(best)return best;
  }
  return [24.5,24.5];
}
function arriveAt(to,from){
  const m=MAPS[to],p=m&&m.portals.find(q=>q.to===from);
  return p?walkableNear(m,p.x,p.y):[24.5,24.5];
}

function gainBase(n){S.exp+=n;let up=false;while(S.exp>=need(S.lv)){S.exp-=need(S.lv);S.lv++;up=true;toast(fmt("levelUp",{n:S.lv}),true)}
  if(up){S.hp=hpMax();S.sp=spMax();fx.push({k:"pillar",x:player.x,y:player.y,t:0,d:1.4,c:"#ffd76a",follow:true});save()}}
function gainJob(n){if(S.jlv>=JCAP){S.jexp=0;return}S.jexp+=n;while(S.jlv<JCAP&&S.jexp>=jneed(S.jlv)){S.jexp-=jneed(S.jlv);S.jlv++;toast(fmt("jobUp",{n:S.jlv}),true);fx.push({k:"ring",x:player.x,y:player.y,t:0,d:.8,c:"#7cf0a8",r:70,follow:true})}
  if(S.jlv>=JCAP){S.jexp=0;toast(t("jobMax"))}}

const RANGE=1.55,ASPD=.95;
function nearestMon(max,noElite){let best=null,bd=max||99;for(const m of liveMon()){if(noElite&&m.elite&&S.lv<mLv(m)+3)continue;const d=dist(m,player);if(d<bd){bd=d;best=m}}return best}
function hitMon(mo,mult){
  if(!mo||mo.dead||mo.dieT>0)return;
  const crit=Math.random()<.1;let dmg=crit?Math.round(atkV()*mult*1.5*(.9+Math.random()*.2)):Math.max(1,Math.round(atkV()*mult*(.85+Math.random()*.3)-mDef(mo)));
  mo.hp-=dmg;mo.hitT=.16;mo.aggro=true;mo.speed=MON[mo.type].speed*1.6;player.combatT=0;
  fx.push({k:"dmg",x:mo.x,y:mo.y,t:0,d:.95,txt:num(dmg)+(crit?"!":""),c:crit?"#ffd84a":"#ffffff",big:crit,ox:(Math.random()-.5)*30,h:MON[mo.type].h*mSize(mo)});
  fx.push({k:"burst",x:mo.x,y:mo.y,t:0,d:.25,c:crit?"#ffe28a":"#ffffff",n:6,z:MON[mo.type].h*.5});
  if(mo.hp<=0)killMon(mo);
}
function killMon(mo){
  const d=MON[mo.type],E=mo.elite;mo.hp=0;mo.dieT=.45;mo.aggro=false;mo.path=[];if(player.target===mo)player.target=null;
  const sc=Math.round((d.sc[0]+Math.floor(Math.random()*(d.sc[1]-d.sc[0]+1)))*(E?ELITE.sc:1)),be=d.exp[0]*(E?ELITE.exp:1),je=d.exp[1]*(E?ELITE.exp:1);
  S.sc+=sc;gainBase(be);gainJob(je);S.kills++;
  let mats=0;if(E||Math.random()<d.drop[1]){const n=E?3:1;S.inv[d.drop[0]]+=n;mats+=n;floatText(`+ ${t(d.drop[0])}${n>1?" x"+n:""}`,"#c3b6ff")}
  if(E&&Math.random()<.35){S.inv.mat_core++;mats++;floatText("+ "+t("mat_core"),"#ffd76a")}
  if(Math.random()<.08){S.inv.mat_ore++;mats++;floatText("+ "+t("mat_ore"),"#e3dcff")}
  floatText(`+${num(be)} EXP`,"#ffd76a");floatText(`+${num(sc)} Sc`,"#e9d89a");
  const P0=MPAL[mo.type];fx.push({k:"burst",x:mo.x,y:mo.y,t:0,d:.6,c:d.sprite==="lumite"?P0.mid:d.sprite==="crawlix"?P0.c[0]:P0.i1,n:E?28:16,z:d.h*.5});
  if(E)fx.push({k:"ring",x:mo.x,y:mo.y,t:0,d:.8,c:"#ffd76a",r:90});
  if(S.idle){const s=S.sess;s.kills++;s.base+=be;s.job+=S.jlv<JCAP?je:0;s.sc+=sc;s.mats+=mats}
  questEvent({t:"kill",mo});
}
function monHit(mo){
  const d=MON[mo.type];player.combatT=0;const atk=mAtk(mo);
  if(Math.random()<.07){fx.push({k:"dmg",x:player.x,y:player.y,t:0,d:.9,txt:t("miss"),c:"#c8c8d8",ox:(Math.random()-.5)*24,h:52});return}
  let dmg=Math.max(1,Math.round(atk*(.8+Math.random()*.4)-defV()*.6));if(player.guardT>0)dmg=Math.ceil(dmg*.5);
  S.hp-=dmg;fx.push({k:"dmg",x:player.x,y:player.y,t:0,d:.95,txt:num(dmg),c:"#ff5a6a",ox:(Math.random()-.5)*24,h:52});
  if(S.hp<=0){S.hp=0;die()}
}
function die(){
  if(player.dead)return;player.dead=true;deathT=3;S.deaths++;player.path=[];player.target=null;
  player.nav=null;if(S.idle)setIdle(false,true);deaggroAll();
  $("#deathOv").classList.remove("hidden");pushChat({ch:"sys",k:"sys_dead"});
}
function respawn(){player.dead=false;S.hp=hpMax();S.sp=spMax();$("#deathOv").classList.add("hidden");goMap("town",24.5,24.5)}
function updateCombat(dt){
  player.atkCd=Math.max(0,player.atkCd-dt);player.lunge=Math.max(0,player.lunge-dt);player.guardT=Math.max(0,player.guardT-dt);player.combatT+=dt;
  const tg=player.target;if(!tg)return;
  if(tg.dead||tg.dieT>0){player.target=null;return}
  const d=dist(player,tg);
  if(d>RANGE){player.chaseT-=dt;if(player.chaseT<=0||!player.path.length){player.chaseT=.35;walkTo(player,Math.floor(tg.x),Math.floor(tg.y))}}
  else{player.path=[];player.moving=false;faceToward(player,tg.x,tg.y);if(player.atkCd<=0){player.atkCd=ASPD;player.lunge=.2;hitMon(tg,1)}}
}
function updateMon(mo,dt){
  if(mo.dead){mo.respawn-=dt;if(mo.respawn<=0)respawnMon(mo);return}
  if(mo.dieT>0){mo.dieT-=dt;if(mo.dieT<=0){mo.dead=true;mo.respawn=mo.elite?45+Math.random()*15:8+Math.random()*7}return}
  mo.hitT=Math.max(0,mo.hitT-dt);mo.atkCd=Math.max(0,mo.atkCd-dt);
  if(mo.hp<mo.maxHp&&!mo.aggro)mo.hp=Math.min(mo.maxHp,mo.hp+mo.maxHp*.05*dt);
  if(mo.aggro&&!player.dead){
    const d=dist(mo,player);
    if(d>14){mo.aggro=false;mo.speed=MON[mo.type].speed;walkTo(mo,Math.floor(mo.home[0]),Math.floor(mo.home[1]))}
    else if(d>1.25){mo.repath-=dt;if(mo.repath<=0||!mo.path.length){mo.repath=.5;walkTo(mo,Math.floor(player.x),Math.floor(player.y))}}
    else{mo.path=[];mo.moving=false;faceToward(mo,player.x,player.y);if(mo.atkCd<=0){mo.atkCd=MON[mo.type].aspd;monHit(mo)}}
  }else{
    mo.wait-=dt;
    if(!mo.path.length&&mo.wait<=0){const tx=Math.floor(mo.home[0]+(Math.random()-.5)*8),ty=Math.floor(mo.home[1]+(Math.random()-.5)*8);if(walk(tx,ty))walkTo(mo,tx,ty);mo.wait=2+Math.random()*5}
  }
  moveChar(mo,dt);
}

function update(dt){
  T+=dt;
  if(player.dead){deathT-=dt;if(deathT<=0)respawn()}
  if(holding&&lastHold&&!player.dead){holdTimer+=dt;if(holdTimer>.3){holdTimer=0;const [wx,wy]=toWorld(lastHold.x,lastHold.y),[tx,ty]=isoToTile(wx,wy),a=Math.floor(tx),b=Math.floor(ty);if(!player.target&&inb(a,b)&&walk(a,b)&&walkTo(player,a,b))setMarker(a+.5,b+.5)}}
  if(!player.dead){updateCombat(dt);moveChar(player,dt)}
  if(!warping&&!player.dead)for(const p of cur.portals)if(Math.hypot(player.x-p.x-.5,player.y-p.y-.5)<.6){const a=arriveAt(p.to,cur.id);goMap(p.to,a[0],a[1]);break}
  if(marker){marker.t+=dt*1.6;if(!player.path.length&&marker.t>1.2)marker=null}
  if(cur===town){
    for(const w of town.wanderers){moveChar(w,dt);w.wait-=dt;
      if(!w.path.length&&w.wait<=0){let tx,ty,gd=0;do{tx=Math.floor(w.x)+Math.floor(Math.random()*15)-7;ty=Math.floor(w.y)+Math.floor(Math.random()*15)-7}while((!walk(tx,ty)||Math.hypot(tx-24,ty-24)>14)&&gd++<40);if(gd<40)walkTo(w,tx,ty);w.wait=2+Math.random()*6}}
    for(const n of town.npcs)if(Math.hypot(n.x-player.x,n.y-player.y)<3.5){faceToward(n,player.x,player.y);n.back=false}
  }else for(const mo of cur.monsters)updateMon(mo,dt);
  for(const c of [player,...town.wanderers])if(c.bubble){c.bubble.t-=dt;if(c.bubble.t<=0)c.bubble=null}
  for(const s of SLOTS)if(s.left>0)s.left=Math.max(0,s.left-dt);
  if(!player.dead){S.sp=Math.min(spMax(),S.sp+dt*(1.5+S.lv*.2));if(player.combatT>4)S.hp=Math.min(hpMax(),S.hp+hpMax()*(cur===town?.08:.015)*dt)}
  updateIdle(dt);updateNav(dt);
  for(const f of fx)f.t+=dt;fx=fx.filter(f=>f.t<f.d);
  ambT-=dt;if(ambT<=0){ambT=7+Math.random()*8;const m=AMB[(Math.random()*AMB.length)|0],w=town.wanderers[(Math.random()*town.wanderers.length)|0];
    if(cur===town)w.bubble={txt:{en:m.en,th:m.th},t:4.5};pushChat({ch:m.ch,name:w.name,en:m.en,th:m.th})}
  updateFx(dt);
  uiT-=dt;if(uiT<=0){uiT=.12;updateUI()}
  saveT-=dt;if(saveT<=0){saveT=5;if(!warping)save()}
}
function updateUI(){
  const pc=(a,b)=>Math.max(0,Math.min(100,a/b*100))+"%";
  $("#hpF").style.width=pc(S.hp,hpMax());$("#hpT").textContent=`${num(S.hp)} / ${num(hpMax())}`;
  $("#spF").style.width=pc(S.sp,spMax());$("#spT").textContent=`${num(S.sp)} / ${num(spMax())}`;
  $("#exF").style.width=pc(S.exp,need(S.lv));$("#exT").textContent=(S.exp/need(S.lv)*100).toFixed(1)+"%";
  $("#jlv").textContent=S.jlv;$("#jxF").style.width=S.jlv>=JCAP?"100%":pc(S.jexp,jneed(S.jlv));$("#jxT").textContent=S.jlv>=JCAP?"MAX":(S.jexp/jneed(S.jlv)*100).toFixed(1)+"%";
  $("#lv").textContent=S.lv;$("#wSc").textContent=num(S.sc);$("#wY").textContent=num(S.y);$("#wLa").textContent=num(S.la);$("#cpV").textContent=num(cpV());
  $("#coord").textContent=`${Math.floor(player.x)}, ${Math.floor(player.y)}`;
  if(Math.random()<.05)online+=Math.round((Math.random()-.5)*6);$("#online").textContent=fmt("online",{n:num(online)});
  renderNet();renderFx();
  const se=S.sess,s=Math.floor(se.t);
  $("#iTime").textContent=[s/3600,(s%3600)/60,s%60].map(v=>String(Math.floor(v)).padStart(2,"0")).join(":");
  $("#iKills").textContent=num(se.kills);$("#iBase").textContent="+"+num(se.base);$("#iJob").textContent="+"+num(se.job);$("#iSc").textContent="+"+num(se.sc);$("#iMat").textContent="+"+num(se.mats);
  $("#iRate").textContent=se.t>20?fmt("rate",{e:num(se.base/se.t*3600),s:num(se.sc/se.t*3600)}):"";
  $("#idleStatus").textContent=idleStatus();
  if(S.idle&&S.vip&&isField()){const o=offlineCalc(cur.id,3600);$("#iVipRate").textContent=o?fmt("vipRate",{k:num(o.kph),p:o.eff}):""}else $("#iVipRate").textContent="";
  SLOTS.forEach((sl,i)=>{const b=document.querySelector(`.slot[data-i="${i}"]`);if(b)b.style.setProperty("--cd",sl.left>0?(sl.left/sl.cd).toFixed(3):0)});
  document.querySelectorAll(".slot .n").forEach(n=>{const sl=SLOTS[+n.parentElement.dataset.i];if(sl&&sl.cnt)n.textContent=S.inv[sl.cnt]});
}

/* ---- closing the game: save state, and remember when idle was left running ---- */
function onLeave(){
  if(resetDone)return;
  S.away=(S.idle&&isField())?{t:Date.now(),map:cur.id,vip:!!S.vip}:null;
  save();
}
/* ---- coming back: work out what the idle earned while away ---- */
function processAway(map,vip,secs){
  secs=Math.min(12*3600,secs);if(secs<60)return false;
  const full=offlineCalc(map,secs);if(!full)return false;
  S.pending={secs,map,vip:!!vip,full};return true;
}
function grantIdle(f,mult){
  S.sc+=Math.round(f.sc*mult);S.kills+=Math.round(f.kills*mult);
  gainBase(Math.round(f.base*mult));gainJob(Math.round(f.job*mult));
  for(const k in f.items)S.inv[k]=(S.inv[k]||0)+Math.round(f.items[k]*mult);
  checkInstant();renderHotbar();
}
/* up=true: pay Yttrium (1 per hour, rounded up) to upgrade. VIP 100%→120%, others 80%→100%. */
function settleIdle(up){
  const p=S.pending;if(!p)return;
  const cost=Math.ceil(p.secs/3600);
  if(up&&S.y<cost){toast(t("rw_noYtt"));return}
  if(up)S.y-=cost;
  const mult=up?(p.vip?1.2:1):(p.vip?1:.8);
  S.pending=null;
  grantIdle(p.full,mult);
  toast(t(up?"rw_upDone":"rw_done"),true);
  closeWin();renderClaim();save();
}
function simClose(){
  const map=isField()?cur.id:"field1";S.idle=false;
  if(processAway(map,S.vip,3600)){renderIdle();renderClaim();openWin("idlerew");save()}
}

  return `<p class="muted">${t("rw_time")}: ${fmt("hrs",{h:hh,m:mm})} · ${t(p.vip?"rw_hidden":"rw_visible")}</p>
   <div class="w-sec">${t(p.vip?"rw_baseVip":"rw_baseNon")}</div>
   <div class="stats">${row(t("kills"),F.kills*f)}${row("Base EXP",F.base*f)}${row("Job EXP",F.job*f)}${row("Scandium",F.sc*f)}${row(t("mats"),matN*f)}</div>
   <div class="w-sec">${t(p.vip?"rw_upVip":"rw_upNon")}</div>
   <p class="muted">${fmt("rw_cost",{c:cost,y:num(S.y)})}</p>
   <div class="w-dev"><button class="btn pri" data-act="rwYes">${fmt("rw_yes",{c:cost})}</button><button class="btn" data-act="rwNo">${t("rw_no")}</button></div>`};

/* ================= language + layout ================= */
function setLang(l){lang=l;document.documentElement.lang=l;applyI18n();toast(t("langSet"));save()}
function applyI18n(){
  document.querySelectorAll("[data-i18n]").forEach(e=>e.textContent=t(e.dataset.i18n));
  const coarse=matchMedia("(pointer:coarse)").matches;const h=$("#hint");if(h.dataset.k)h.textContent=t(h.dataset.k+(coarse?"Tap":""));
  $("#cin").placeholder=t(coarse?"chatPhM":"chatPh");
  $("#bName").textContent=t(cur.nameK);$("#bSub").textContent=t(cur.subK);$("#mmName").textContent=t(cur.nameK);$("#bRec").textContent=cur.rec?fmt("rec",{n:num(cur.rec)}):"";
  renderMenu();renderHotbar();renderTabs();renderChat();renderChatBtns();renderQuest();renderDlg();renderWin();renderClaim();renderIdle();renderMM();updateUI();
}
function setLayout(m){layoutMode=m;layout();renderWin();toast(fmt("layoutSet",{m:t("lay_"+m)}));save()}
function updateLayoutBtn(){}
function setZoom(i){zIdx=Math.max(0,Math.min(ZL.length-1,i));renderMM();save()}
function renderMM(){$("#zLbl").textContent=t("z"+zIdx);$("#zOut").disabled=zIdx===0;$("#zIn").disabled=zIdx===ZL.length-1;
  $("#zIn").title=t("zoomIn");$("#zOut").title=t("zoomOut");$("#mmHome").title=t("mmHome");$("#mmTog").title=t("mmToggle");$("#mmWrap").classList.toggle("closed",!mmOpen);
  $("#mmHome").classList.toggle("hidden",!isField())}
$("#zIn").addEventListener("click",()=>setZoom(zIdx+1));
$("#zOut").addEventListener("click",()=>setZoom(zIdx-1));
$("#mmHome").addEventListener("click",warpTown);
$("#mmTog").addEventListener("click",()=>{mmOpen=!mmOpen;renderMM();save();if(mmOpen)requestAnimationFrame(sizeMM)});
document.addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT")return;
  if(e.key==="Enter"){if(dlg){$("#dNext").click();return}if(chatMode==="min")setChat("norm");$("#cin").focus();e.preventDefault();return}
  if(e.key==="Escape"){if(dlg)closeDlg();else if(chatMode==="full")setChat("norm");else closeWin();return}
  if(/^[0-9]$/.test(e.key))useSlot((+e.key+9)%10);
});

/* ================= avatar ================= */
function drawAvatar(){const c=$("#av"),a=c.getContext("2d");a.setTransform(1,0,0,1,0,0);a.clearRect(0,0,128,128);const old=g;g=a;drawChibi({pal:PAL.player,dir:1,back:false,moving:false,phase:0,seed:0},64,190,3.05);g=old}

/* ================= boot ================= */
let saved=loadSave();
try{if(saved){
  const gs=saved.gameState;Object.assign(S,gs);
  S.inv=Object.assign({red:0,blue:0,wing:0,apple:0,mat_gel:0,mat_shell:0,mat_lens:0,mat_ore:0,mat_gel2:0,mat_amber:0,mat_frost:0,mat_core:0},gs.inv);
  if(!S.q||typeof S.q!=="object"||!S.q.main)S.q={main:{s:"active",st:0,p:0,n:0}};
  for(const id of Object.keys(S.q)){const q=S.q[id],d=QD[id];if(!d||!q||typeof q!=="object"){delete S.q[id];continue}
    q.st=Math.max(0,q.st|0);q.p=Math.max(0,q.p|0);q.n=Math.max(0,q.n|0);if(q.s==="active"&&q.st>=d.stages.length)q.s=d.rep?"avail":"done"}
  S.pins=(Array.isArray(S.pins)?S.pins:["main"]).filter(id=>QD[id]&&S.q[id]).slice(0,5);
  for(const k of ["lv","jlv"])S[k]=Math.max(1,Math.floor(+S[k]||1));S.jlv=Math.min(JCAP,S.jlv);
  for(const k of ["exp","jexp","sc","y","la","kills","deaths","hp","sp"])S[k]=Math.max(0,+S[k]||0);
  for(const k in S.inv)S.inv[k]=Math.max(0,Math.floor(+S.inv[k]||0));
  if(!S.sess||typeof S.sess!=="object")S.sess={t:0,kills:0,base:0,job:0,sc:0,mats:0};
  if(!(saved.x>0&&saved.y>0)){saved.x=24.5;saved.y=24.5;saved.map="town"}
  lang=saved.lang||lang;layoutMode=saved.layoutMode||"auto";zIdx=Math.max(0,Math.min(4,(saved.zIdx??2)|0));chatMode=saved.chatMode||"min";mmOpen=saved.mmOpen!==false;qOpen=saved.qOpen!==false;
  cur=MAPS[saved.map]||town;player.x=saved.x;player.y=saved.y;if(!walk(Math.floor(player.x),Math.floor(player.y))){player.x=24.5;player.y=24.5;cur=town}
  S.hp=Math.max(1,Math.min(S.hp,hpMax()));S.sp=Math.min(S.sp,spMax());
  /* idle while the game was closed */
  const wasIdle=!!S.idle;S.idle=false;
  const away=S.away||(wasIdle?{t:saved.savedAt,map:saved.map,vip:!!S.vip}:null);S.away=null;
  if(away&&MAPS[away.map]&&away.map!=="town"){const secs=(Date.now()-away.t)/1000;
    if(secs>=60)processAway(away.map,away.vip,secs);else if(wasIdle&&isField())S.idle=true}
  lastSave=saved.savedAt;
}}catch(e){saved=null;cur=town;player.x=24.5;player.y=24.5;S.idle=false;S.pending=null;S.away=null;S.q={main:{s:"active",st:0,p:0,n:0}};S.pins=["main"]}
document.documentElement.lang=lang;
buildMini(cur);
pushChat({ch:"sys",k:"sys_welcome"});pushChat({ch:"sys",k:"sys_server"});pushChat({ch:"sys",k:saved?"sys_back":"sys_tip"});
setChat(chatMode);layout();applyI18n();drawAvatar();setBanner();
showHint(isField()?"hintField":"hint");
whenReady([cur],()=>{},"ld_boot");
for(const n of NEIGH[cur.id]||[])queueBuild(MAPS[n],false);
if(!LITE)for(const m of Object.values(MAPS))queueBuild(m,false);
if(S.pending)setTimeout(()=>{if(!winId&&S.pending)openWin("idlerew")},1600);
if(document.fonts)document.fonts.ready.then(drawAvatar);
new ResizeObserver(()=>layout()).observe(app);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")onLeave();else if(S.away){S.away=null;save()}});
window.addEventListener("pagehide",onLeave);
let last=performance.now(),ldT=0,errCount=0;
function showErr(e){errCount++;if(errCount>3)return;const el=$("#errBox");el.classList.remove("hidden");$("#errMsg").textContent=String(e&&e.message||e).slice(0,160)}
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  NET.fpsN++;NET.fpsT+=dt;if(NET.fpsT>=.5){NET.fps=Math.round(NET.fpsN/NET.fpsT);NET.fpsN=0;NET.fpsT=0}
  try{
    pumpJobs(waiters.length?40:4);checkWaiters();
    update(dt);
    if(W>=120&&H>=120&&cv.width>0){render();if(mmOpen)drawMini()}
  }catch(e){showErr(e);try{ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.globalCompositeOperation="source-over"}catch(_){}}
  ldT-=dt;if(ldT<=0){ldT=.1;try{updateLoader(.1)}catch(_){}}
  requestAnimationFrame(frame);
}
$("#errReset").addEventListener("click",()=>{try{localStorage.removeItem(SAVE_KEY);localStorage.removeItem(OLD_KEY)}catch(_){}resetDone=true;location.reload()});
$("#errHide").addEventListener("click",()=>$("#errBox").classList.add("hidden"));
window.addEventListener("error",e=>showErr(e.error||e.message));
window.__reo={LITE,S,player,goMap,MAPS,town,setIdle,get cur(){return cur},save,hitMon,useSlot,startNav,acceptQuest,offlineCalc,processAway,settleIdle,simClose,onLeave,whenReady};
requestAnimationFrame(frame);
})();

</script>
